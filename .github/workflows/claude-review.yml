name: Claude PR Review

# Ревьюер роли reviewer-pr. Карточка роли и КРИТЕРИИ — REVIEWER.md в корне
# (единственный список); ROLES.md упразднён (тред 012) и здесь не читается.
# Триггеры намеренно РУЧНЫЕ — не на каждый synchronize: расход квоты под контролем.
#   • метка `review` на PR
#   • коммент `@claude` в PR
#   • workflow_dispatch с номером PR
# РАЗМОРОЖЕН 2026-08-19 (решение john в чате ~07:37Z, тред `014-merge-model`,
# постановка curator): репозиторий обслуживает сам себя — почта, роли и события
# merge здесь СВОИ, и довод заморозки («воркфлоу читает почту проекта, которого
# здесь нет») его больше не касается. Тело шагов приехало из отлаженной живой
# версии прежнего дома побайтово; правки этого коммита — только generic-поправки,
# названные по месту: команды прогонов (`pnpm test`/`pnpm typecheck` вместо
# `turbo`), имя воркфлоу тестов (`checks.yml`), секрет модели и доки власти
# ЭТОГО репозитория.
#
# НОМЕРА В ЭТОМ ФАЙЛЕ — ПРОИСХОЖДЕНИЕ, А НЕ АДРЕСА ЗДЕШНЕЙ ПОЧТЫ. Каждый
# doc-блок ниже вырос из измеренного случая ПРЕЖНЕГО ДОМА — репозитория, где
# протокол жил до переезда, — и его номер треда/PR означает разговор ТОГО
# репозитория: «тред 014» в шапке шага — тред 014 прежнего дома, а не
# `014-merge-model` этой почты. Поэтому в тексте, который читает МОДЕЛЬ (`prompt`
# ниже), такие ссылки помечены словами «прежний дом» — иначе ревьюер пойдёт
# читать здешний тред с тем же номером и прочитает не тот разговор. ЧЕЙ это дом,
# ревьюеру знать незачем: имя соседнего контура здесь не называется намеренно.

on:
  pull_request:
    types: [labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: Номер PR для ревью
        required: true
        type: string
      max_turns:
        description: Лимит ходов ревьюера (для проверки поведения на исчерпании бюджета, тред 014)
        required: false
        default: "250"
        type: string

jobs:
  review:
    # CONCURRENCY НА УРОВНЕ JOB, не workflow (тред 014). При workflow-level группа
    # вычисляется ДО job-`if`, и бот-коммент самого ревьюера (issue_comment),
    # отсеиваемый условием ниже, всё равно успевал погасить идущий прогон по метке
    # — ревьюер убивал сам себя между публикацией вердикта в PR и записью в тред
    # (run 29883515576, cancelled). Отсечённый по `if` job в concurrency-группу НЕ
    # входит, поэтому перенос на уровень job это закрывает.
    concurrency:
      group: claude-review-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
      cancel-in-progress: true
    # Комменты ботов игнорируем: ревьюер не реагирует ни на себя, ни на другую
    # автоматику — второй слой защиты от того же самозацикливания.
    if: |
      (github.event_name == 'pull_request' && github.event.label.name == 'review') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null && github.event.comment.user.type != 'Bot' && contains(github.event.comment.body, '@claude')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write # запись вердикта в ветку comms
      pull-requests: write # review-коммент в PR
      issues: write # триггер issue_comment
      id-token: write
      actions: read
      # `checks: read` — не про сами джобы ревьюера, а про то, что ревьюер обязан
      # ПРОГОНЯТЬ, а не оценивать: GraphQL-поле `statusCheckRollup` (`gh pr view`,
      # `cli merge-gate`) GitHub отдаёт только токену с этим scope, а у installation-
      # токена джобы есть РОВНО перечисленное здесь — неперечисленное обнуляется, а не
      # наследуется. Без строки весь вызов падает `Resource not accessible by
      # integration`, и это уже случалось: вердикт по #61 не смог воспроизвести
      # заявленный живой прогон merge-gate именно из-за неё.
      #
      # ЭТОЙ СТРОКИ ОДНОЙ НЕ ХВАТАЕТ, и это выяснилось фактом (вердикт по #61,
      # 2026-07-29, тред 026): после её посадки тот же вызов из среды ревьюера падал
      # тем же отказом. `permissions:` управляет токеном ДЖОБЫ, а внутри действия
      # `gh` ходит НЕ им: `claude-code-action` меняет OIDC-токен на собственный
      # app-токен и им же перезаписывает `GH_TOKEN` в окружении модели
      # (`src/entrypoints/run.ts`: `process.env.GH_TOKEN = githubToken`) — поэтому
      # и `env: GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}` на шаге действия ничего бы не
      # изменил, его затирают. Scope у app-токена запрашивается отдельно —
      # `additional_permissions` на самом шаге (ниже); строка здесь остаётся
      # обязательной половиной: обмен не выдаёт того, чего нет у джобы.
      checks: read
    steps:
      # Полная история: ревьюеру нужен merge-base с main для честного диффа,
      # ветка comms дотягивается отдельным fetch из промпта.
      # Bash разрешён целиком (claude_args ниже): гранулярный allowlist из
      # префиксов не переживает ни составные команды, ни подстановки — первый
      # прогон дал 24 отказа прав и ноль публикаций при успешном статусе джобы.
      # Раннер одноразовый, а метку `review` вешает человек с правами на репо.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Зависимости PR-чекаута — чтобы ревьюер ПРОГНАЛ проверки, а не рассуждал о
      # диффе (тред 007). Шаги те же и в том же порядке, что в `checks.yml`: расхождение
      # окружений ревьюера и CI и есть закрываемая дыра.
      # (setup-node с `cache: pnpm` требует, чтобы pnpm был поднят раньше.)
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # ВТОРОЙ ЧЕКАУТ main + УСТАНОВКА — пакет `agent-protocol` для ЗАПИСИ вердикта
      # в тред через `cli new-message` (тред 014). Тот же приём `.code`, что у
      # merge-notify: писать надо АКТУАЛЬНОЙ версией протокола, а не той, что в
      # PR-ветке (её и ревьюируем). `pnpm install` здесь ОБЯЗАТЕЛЕН: без него на
      # свежем чекауте `tsx: not found`, и запись уходит в путь ошибки — ровно та
      # дыра, что reviewer-pr поймал в `/wake` (PR #30). merge-notify/comms-derived
      # ставят зависимости после второго чекаута всегда; здесь тем более.
      - uses: actions/checkout@v5
        with:
          ref: main
          path: .code
      - run: pnpm install --frozen-lockfile
        working-directory: .code

      # ДУБЛЬ-ТЕСТЫ СРЕЗАЮТСЯ ФАКТОМ, А НЕ ДОВЕРИЕМ (решение john 2026-08-03:
      # «пусть гоняется в облаке, но тесты лишний раз не гоняем»; постановка —
      # тред 049, msg `2026-08-03T07-32-41Z-curator.md` п.2). `Claude PR Review`
      # остаётся в облаке именованным исключением по радиусу поражения — значит
      # его минуты режутся не переездом, а тем, что ревьюер не повторяет прогон,
      # который уже состоялся на ТОМ ЖЕ коде: полный `pnpm test` в джобе
      # `checks` — основной вес облачных минут за окно инвентаризации.
      #
      # «НА ТОЙ ЖЕ ГОЛОВЕ» ЗДЕСЬ БУКВАЛЬНО, и это первое требование постановки:
      # спрашивается не «есть ли в репозитории зелёный `checks`», а «зелёный ли
      # `checks` НА ГОЛОВЕ ЭТОГО PR». Прогоны `checks.yml` фильтруются по
      # `head_sha` головы PR (`gh pr view --json headRefOid`) — чужой коммит в
      # выборку не попадает по построению, а не по внимательности. Из них
      # берётся САМЫЙ СВЕЖИЙ по `created_at`: перезапуск (`re-run`) живёт тем же
      # `run_id` и отдаёт джобы последней попытки, поэтому «последняя попытка
      # имени» получается сама, тем же способом, каким её считает `merge-gate`.
      #
      # ФАКТ УСТАНАВЛИВАЕТСЯ ДЕТЕРМИНИРОВАННЫМ ШАГОМ, А НЕ МОДЕЛЬЮ — по той же
      # причине, что шаг статуса и шаг самопропуска: поручать модели решать,
      # можно ли ей не работать, значит строить способ не работать. Модель
      # получает ГОТОВЫЙ ответ строкой промпта и не спрашивает GitHub сама.
      #
      # ШАГ НЕ КРАСИТ ПРОГОН НИКОГДА (та же конструкция, что у шага
      # самопропуска): любой отказ сети, токена или разбор пустого ответа даёт
      # `green=0`, то есть поведение ДО этой правки — ревьюер гоняет всё сам.
      # Ошибка в сторону лишнего прогона стоит минут, ошибка в другую сторону —
      # непроверенного кода, выданного за проверенный.
      #
      # ВИДИМОСТЬ — второе требование постановки. Молчаливый пропуск неотличим
      # от «тесты прошли» (тот самый класс «зелёная джоба ≠ вердикт»), поэтому
      # решение печатается ДВАЖДЫ: строкой в лог джобы и `::notice::` в сводку
      # прогона, и обе несут id прогона `checks`, на который сослались. Третий
      # адрес — сам вердикт: промпт требует назвать этот id строкой (п. 2).
      - name: Зелёный `checks` на ТОЙ ЖЕ голове — установить факт
        id: checks_on_head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
        run: |
          set -uo pipefail
          GREEN=0; HEAD_SHA=""; RUN_ID=""; RUN_URL=""; CONCLUSION=""; WHY=""

          HEAD_SHA=$(gh pr view "$PR" --json headRefOid -q .headRefOid 2>/dev/null) || HEAD_SHA=""
          if [ -z "$HEAD_SHA" ]; then
            WHY="голову PR #${PR} узнать не удалось (gh pr view)"
          else
            # Прогоны checks.yml РОВНО на этой голове, самый свежий по created_at.
            RUN_ID=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/checks.yml/runs?head_sha=${HEAD_SHA}&per_page=100" \
              --jq '[.workflow_runs[]] | sort_by(.created_at) | last | .id' 2>/dev/null) || RUN_ID=""
            [ "$RUN_ID" = "null" ] && RUN_ID=""
            if [ -z "$RUN_ID" ]; then
              WHY="на голове ${HEAD_SHA} нет ни одного прогона checks.yml"
            else
              RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}"
              # Джобы последней попытки этого прогона; имя `checks` — джоба
              # checks.yml, которая и гоняет `pnpm test`.
              CONCLUSION=$(gh api \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" \
                --jq '[.jobs[] | select(.name=="checks" and .status=="completed")] | sort_by(.started_at) | last | .conclusion' 2>/dev/null) || CONCLUSION=""
              [ "$CONCLUSION" = "null" ] && CONCLUSION=""
              case "$CONCLUSION" in
                success) GREEN=1 ;;
                "")      WHY="в прогоне ${RUN_ID} джоба 'checks' ещё не завершена (или её там нет)" ;;
                *)       WHY="в прогоне ${RUN_ID} джоба 'checks' завершилась '${CONCLUSION}'" ;;
              esac
            fi
          fi

          {
            echo "green=${GREEN}"
            echo "head_sha=${HEAD_SHA}"
            echo "run_id=${RUN_ID}"
            echo "run_url=${RUN_URL}"
            echo "conclusion=${CONCLUSION}"
            echo "why=${WHY}"
          } >> "$GITHUB_OUTPUT"

          if [ "$GREEN" = 1 ]; then
            echo "checks-on-head: ЗЕЛЁНЫЙ · голова ${HEAD_SHA} · прогон checks ${RUN_ID} · ${RUN_URL}"
            echo "::notice::Дубль-тесты срезаны: 'checks' на голове ${HEAD_SHA} зелёный — прогон ${RUN_ID} (${RUN_URL}). Полный 'pnpm test' ревьюер не гоняет (тред 049)."
          else
            echo "checks-on-head: НЕТ · голова ${HEAD_SHA:-?} · прогон checks ${RUN_ID:-нет} · причина: ${WHY}"
            echo "::notice::Дубль-тестов не срезаем: ${WHY} — ревьюер гоняет 'pnpm test' сам, как раньше."
          fi
          exit 0

      - uses: anthropics/claude-code-action@v1
        id: reviewer
        with:
          # ЧЕМ ПЛАТИТ РЕВЬЮЕР ЭТОГО РЕПОЗИТОРИЯ — `CLAUDE_CODE_OAUTH_TOKEN`, тот же
          # секрет и та же строка, что в прежнем доме: подписочный токен, а не
          # API-ключ. Разморозка (#21) поставила здесь `anthropic_api_key` по
          # постановке треда `014-merge-model` — а john положил рукой ИМЕННО
          # oauth-токен (его решение, ~08:40Z того же треда: «API-ключей нет и не
          # планируется»). Строка, ждущая секрета, которого не будет, — красная
          # джоба на каждом круге, поэтому расхождение двух копий по деньгам
          # закрыто, а не описано. Отдельного гарда на пустой секрет тут нет: метку
          # `review` вешает рука, и пустой секрет даёт красную джобу на том же
          # круге — то есть отказ виден тому, кто его и попросил.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # SCOPE ДЛЯ ТОКЕНА, КОТОРЫМ РАБОТАЕТ САМА МОДЕЛЬ (вторая половина к
          # `checks: read` в `permissions:` выше). Действие меняет OIDC-токен джобы на
          # свой app-токен, и обмен запрашивает РОВНО contents/pull_requests/issues,
          # если не сказано иначе; `additional_permissions` — то самое «иначе».
          # Без него `gh pr view --json statusCheckRollup` (и `cli merge-gate`,
          # который на нём стоит) отказывает ревьюеру `Resource not accessible by
          # integration` — наблюдалось дважды подряд, на #61 до и после посадки
          # `checks: read` в джобу.
          #
          # Форму выбирали из двух. `github_token: ${{ secrets.GITHUB_TOKEN }}`
          # тоже дало бы scope (он ОТМЕНЯЕТ обмен и берёт токен джобы как есть) — и
          # вместе с обменом отменил бы гард самого действия «workflow ветки
          # отличается от дефолтной — пропускаю себя», на котором стоит норма
          # правила №14 (воркфлоу-PR своего ревью не получает). Права ревьюера не
          # стоят снятия защиты от промпт-инъекции через правку воркфлоу в PR.
          #
          # ПРОВЕРЯЕТСЯ ЭТО ТОЛЬКО ПОСЛЕ MERGE — по той же причине: на PR, который
          # правит этот файл, действие пропускает себя, то есть обмен здесь не
          # состоится вовсе. Если у установки приложения нет `checks`, обмен
          # откажет и джоба упадёт громко на первом же круге ревью после merge —
          # тогда откат этих строк возвращает прежнее поведение целиком.
          #
          # ЧТО ИЗ ЭТОГО СБЫЛОСЬ, ИЗМЕРЕНО ФАКТОМ (тред 026, 4.4; прогон 30617709963,
          # артефакт `reviewer-execution-112-30617709963`): обмен НЕ отказал и джоба НЕ
          # упала — `checks: read` до app-токена доехал. В том же прогоне рукой ревьюера:
          #   • `GET /commits/{sha}/check-runs` → 200, `total_count: 3` (репозиторий
          #     ПРИВАТНЫЙ, значит скоуп `checks` у токена есть, иначе был бы 403);
          #   • `GET /commits/{sha}/status` → 403 (это `statuses`, отдельный скоуп);
          #   • `gh pr view --json statusCheckRollup` → GraphQL-отказ РОВНО на подполе
          #     `...statusCheckRollup.contexts.nodes.N.checkSuite.workflowRun` — это
          #     ресурс Actions, а не Checks.
          # Отсюда `actions: read` ниже: у ДЖОБЫ он есть (`permissions:` выше), но
          # app-токен наследует не права джобы, а РОВНО запрошенное здесь — обмен шлёт
          # этот блок как есть (`claude-code-action/src/github/token.ts`,
          # `parseAdditionalPermissions` → тело обмена). Одного `checks: read` не хватало
          # не потому, что его не выдали, а потому, что `gh` в этом запросе трогает ещё и
          # Actions.
          additional_permissions: |
            checks: read
            actions: read
          prompt: |
            REPO: ${{ github.repository }}
            PR: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}

            Ты — роль `reviewer-pr` протокола agent-comms. Код НЕ меняешь, PR НЕ мёрджишь.
            Карточка роли и КРИТЕРИИ — `REVIEWER.md` в корне репо (единственный список).

            ТВОЙ ХОД И ЕСТЬ ТВОЯ СЕССИЯ: завершил ход — процесс вышел, и разбудить
            его нечем. Поэтому ЖДАТЬ МОЖНО ТОЛЬКО В ПЕРЕДНЕМ ПЛАНЕ: длинный прогон
            (`pnpm test`, `pnpm typecheck`) запускается и ДОЖИДАЕТСЯ той
            же командой, а фоновый запуск с намерением «вернусь, когда закончится» —
            это выход без результата. Так теряется круг ревью целиком: действие
            заканчивается `success`, `verdict.md` не создан, и гаснут разом все три
            доставки (дефект H2, воспроизведён дважды на одной голове `e55b806`,
            тред 023 прежнего дома).

            ЛОВУШКА НАЗВАНА ИМЕНАМИ ТВОИХ ЖЕ ИНСТРУМЕНТОВ, а не абстракцией:
            `Bash` с `run_in_background` здесь НЕ ИСПОЛЬЗУЕТСЯ. Ждущего инструмента
            в твоём `--allowedTools` НЕТ — ни `Monitor`, ни `TaskOutput`: список
            целиком это `Read, Grep, Glob, Edit, Write, Bash` и инлайн-коммент
            GitHub. Значит вернуться к фоновому прогону тебе НЕЧЕМ: попытка встать
            на него блокирующим ожиданием — отказ прав, и «ожиданием» остаётся
            парковка, то есть выход без вердикта. Так умер круг по PR #116 прежнего дома (голова
            `6eecb593`, прогон 30626953657): замер базы ушёл в фон, `Monitor`
            отказал, 65 ходов и $2.91 не дали ни строки суждения (тред 044 прежнего дома).

            ВЫПОЛНИМАЯ ЗАМЕНА, без которой «не уходи в фон» — требование
            невыполнимое: длинный замер РАЗБИВАЕТСЯ НА ШАГИ под потолок одного
            вызова `Bash` (`timeout: 600000`, десять минут — максимум, и задавать
            его надо явно: по умолчанию вызов обрывается заметно раньше). Замер
            базы делается так: `git worktree add` + `pnpm install --frozen-lockfile`
            ОДНИМ вызовом, `pnpm test` (или `vitest run`) — СЛЕДУЮЩИМ; не
            влезает и это — дели дальше, по пакетам или по проектам vitest. Каждый
            шаг завершается сам и возвращает тебе вывод; фон не нужен ни на одном.

            Не помещаешься в ходы или прогон не успевает даже по шагам — вердикт
            всё равно пишется по тому, что успел, а непрогнанное называется словами:
            частичный вердикт доставлен, а полный, которого никто не получил, — нет.

            ПОРЯДОК ДОСТАВКИ ВАЖЕН: вердикт пишется СНАЧАЛА В ТРЕД, ПОТОМ комментом
            в PR. Тред для протокола первичен: если прогон оборвётся (лимит ходов,
            сбой) ПОСЛЕ записи в тред — вердикт уцелел; обратный порядок его терял
            (тред 014 прежнего дома). Поэтому запись в тред — среди первых
            действий после того, как вердикт сформирован, а не последним шагом.

            1. Отревьюй PR строго по `REVIEWER.md`: дифф (`gh pr diff`), описание и
               обсуждение (`gh pr view --comments`), плюс ЛЮБЫЕ файлы базы, нужные
               для контекста — ревью по одному диффу критериями 2, 3 и 9 не делается.

               Постановка — тред из строки `thread: NNN-slug` в описании PR. Подтяни
               почту и прочитай тред ЦЕЛИКОМ, включая ОСТАЛЬНЫЕ файлы папки (крупные
               постановки — отдельными документами рядом с тредом):
                   git fetch --no-tags origin comms
                   git worktree add .comms-mail FETCH_HEAD
                   ls .comms-mail/agent-comms/<slug>/
                   # мигрированный тред — сообщения в messages/*.md; legacy — единый _thread.md
               Роль автора PR — строка `role: <id>` в описании PR (нужна для waiting-on).
               Нет строки `thread:` — это находка (критерий 3): скажи в вердикте, ревьюй по остальным.

            2. ПРОГОНЯЙ проверки, а не оценивай по диффу (зависимости установлены,
               окружение = CI-джоба `checks`): `pnpm typecheck`, `pnpm test`, `pnpm exec biome check <файлы>`. Прогон не удался — в вердикте
               ФАКТИЧЕСКАЯ ошибка (команда и её вывод), а не «среда не позволила».

               ОДНО ИСКЛЮЧЕНИЕ, И ОНО ИЗМЕРЕНО ЗА ТЕБЯ ШАГОМ ПЕРЕД ТОБОЙ (решение
               john 2026-08-03, тред 049 прежнего дома): полный `pnpm test` НЕ гоняется,
               когда те же тесты на ТОМ ЖЕ коде уже прошли. Факт установлен, не
               спрашивай GitHub сам:

                   checks на голове PR: ${{ steps.checks_on_head.outputs.green == '1' && 'ЗЕЛЁНЫЙ' || 'НЕТ' }}
                   голова:              ${{ steps.checks_on_head.outputs.head_sha }}
                   прогон checks:       ${{ steps.checks_on_head.outputs.run_id }} ${{ steps.checks_on_head.outputs.run_url }}
                   почему НЕТ:          ${{ steps.checks_on_head.outputs.why }}

               • ЗЕЛЁНЫЙ — полный `pnpm test` не запускай. В вердикте
                 назови это ОДНОЙ СТРОКОЙ С ID ПРОГОНА: «полный прогон тестов не
                 повторял — `checks` на голове <sha> зелёный, прогон <id>».
                 Молчаливый пропуск запрещён: он неотличим от «я прогнал, всё
                 прошло», и это ровно тот класс, на котором нас уже ловило
                 (зелёная джоба ≠ вердикт). Не приписывай себе чужой прогон:
                 формулировка «тесты прошли» без ссылки на id — находка о тебе.
               • НЕТ — гоняй `pnpm test` сам, как раньше, и назови в
                 вердикте причину из строки «почему НЕТ» выше.

               ЧТО ИСКЛЮЧЕНИЕ НЕ ОТМЕНЯЕТ, и это не оговорка:
               — `pnpm typecheck` и `biome check` гоняются В ЛЮБОМ СЛУЧАЕ
                 (срез — только про вес полного прогона тестов);
               — ТОЧЕЧНЫЙ прогон остаётся твоим главным инструментом: увидел
                 подозрение — гоняй конкретный тест/пакет (`pnpm -F <пакет> test`,
                 `pnpm exec vitest run <файл>`) и приводи вывод. Зелёный `checks`
                 говорит «существующие тесты прошли» и не говорит НИЧЕГО о том,
                 проверяет ли новый тест то, что обещано (критерий 2), и о коде,
                 который никто не покрыл;
               — ЧИСЛА ТЕСТОВ (критерий 1) зелёным `checks` не заменяются: он
                 знает исход, а не количество. Если PR/тред заявляет числа —
                 сторона ГОЛОВЫ читается из лога того же прогона
                 (`gh run view <id> --log | grep -iE 'tests? +[0-9]+ +passed'`),
                 а сторона БАЗЫ как и была: отдельный чекаут и прогон. Срез сюда
                 не дотягивается — база это другой код.

            3. Сформируй вердикт по разделу «Формат вердикта» `REVIEWER.md` (первая
               строка `verdict: approve` либо `verdict: needs-fixes`, ВТОРАЯ строка —
               `pr: <номер PR из шапки этого промпта>`) и запиши его ЦЕЛИКОМ в файл
               `$GITHUB_WORKSPACE/verdict.md` — им доставим в оба адреса, чтобы текст
               был идентичен.

               ПУТЬ АБСОЛЮТНЫЙ, и это не придирка: шаги джобы после тебя читают РОВНО
               `$GITHUB_WORKSPACE/verdict.md`, а ты по ходу ревью заходишь в `.code` и
               `.comms-mail` — `verdict.md`, написанный относительным путём из чужого
               каталога, для них не существует, и вердикт теряет две доставки из трёх
               при живом суждении (так было на #68 14:13Z прежнего дома, тред 016 там же).

               Вторая строка — ЯКОРЬ (тред 029 прежнего дома): вердикт уезжает в тред, а тред PR-у
               не равен, и без номера круги ревью не группируются по PR ничем.
               Порядок строк обязателен: первую читает шаг статуса, предварять её
               нечем, поэтому якорь идёт вторым, а не первым.

               ТРЕТЬЯ строка — `waiting-on: <ровно одна роль>`: КОМУ ХОД после этого
               вердикта. Её читает шаг доставки, сверяет с конфигом (`cli role exists`)
               и ставит в письмо. Суждение здесь твоё, правило — то же, что было:

               - `verdict: needs-fixes` → автор PR (`role:` из описания): ход его,
                 правки его;
               - `verdict: approve` → **`curator`**, а не автор и не john. Merge и есть
                 следующий ход контура после approve, и право на него — у curator
                 (тред 026 прежнего дома, перенос сюда — тред `014-merge-model`). Пока approve
                 адресовался автору, у готового к merge PR не было события вовсе: #58
                 прежнего дома провисел два часа после вердикта, потому что тред ждал
                 того, кого контур не поднимает;
               - исключение — PR, который сам curator мёржить не вправе (доки власти
                 ЭТОГО репозитория: `docs/roles/**`, `PROTOCOL.md`, `REVIEWER.md`,
                 `agent-protocol.json`, `.github/workflows/**`): такой ждёт АВТОРА,
                 merge за john, и скажи это словами в теле вердикта.

               `john` в это поле не принимается вовсе, и список — тоже: РОВНО ОДНА роль
               (норма 024 этой почты). Строки нет или роль не существует — шаг возьмёт
               правило сам (approve → `curator`, needs-fixes → `role:` из описания PR) и
               НАПИШЕТ В ПИСЬМЕ, что адресат выведен, а не объявлен. То есть пропуск
               строки круг не ломает — он только делает адресата машинным.

               Чужое незакрытое ожидание в поле не сворачивается — оно живёт задачами с
               владельцами, а не тактом разговора; если тред ждал кого-то ещё по другому
               вопросу, назови это словами в теле вердикта.

            4. НА ЭТОМ ТВОЯ ЧАСТЬ КОНЧАЕТСЯ. Письмо в тред, коммент в PR и формальный
               review-статус делают ШАГИ ДЖОБЫ после тебя, из того же `verdict.md`, —
               все три доставки. Сам НЕ пиши в тред (`new-message`), НЕ комментируй PR
               (`gh pr comment`) и НЕ выставляй статус (`gh pr review`): дубль любой из
               них — это два текста на один вердикт, и читающий не знает, какой
               действующий.

               ПОЧЕМУ ТАК, И ЭТО НЕ УДОБСТВО (тред 088, решение john по треду 082).
               Доставка, висящая на агенте, теряет результат круга целиком, когда агент
               умирает ПОСЛЕ суждения: 2026-09-02 в соседнем контуре вердикт был написан
               и не прочитан никем — уехал только формальный статус. Шаг джобы переживает
               смерть модели по построению, а `verdict.md` на диске — это всё, что от
               круга требуется, чтобы он состоялся. Заодно исчезает и вторая половина
               болезни: письмо шага знает про парк, стоящий на треде, а ты о нём знать не
               обязан.

               ЕДИНСТВЕННОЕ, ЧТО ОТ ТЕБЯ НУЖНО ПОСЛЕ ЗАПИСИ, — убедиться, что файл лёг:
               `test -s "$GITHUB_WORKSPACE/verdict.md" && head -3 "$GITHUB_WORKSPACE/verdict.md"`.
               Пусто — суждения нет, и молчаливого «доставлено» здесь не будет: шаги
               скажут о его отсутствии и в PR, и в тред.
          # Лимит ходов: по умолчанию 250 (метка/коммент его не задают); при
          # workflow_dispatch берётся из input `max_turns` — так проверяется
          # поведение на исчерпании бюджета (тред 014), не трогая обычные триггеры.
          # 100 хватало, пока ревью было чтением диффа; честный круг по критериям
          # REVIEWER.md — это ДВА полных прогона тестов на обеих границах (сотни
          # тестов, процессные файлы по 30–70с), typecheck, сверка бампов схемы и
          # grep'ы: в прежнем доме круг такого размера упёрся в 100 и умер без
          # вердикта (PR #29 прежнего дома, тред 016 там же).
          # МОДЕЛЬ РЕВЬЮЕРА НАЗВАНА, А НЕ УНАСЛЕДОВАНА (тред 035). Параметра здесь
          # не было — ревьюер жил ДЕФОЛТОМ `claude-code-action`, то есть ручкой на
          # стороне вендора: смена дефолта молча переносит все ревью репозитория на
          # другую модель, дороже или слабее, без диффа и без строки, по которой это
          # читается. Записан ФАКТ, снятый с прогона, а не желание: лог прогона
          # 33159422402 (28.08, PR #80) несёт `"model": "claude-sonnet-5"` — тот же
          # дефолт, что john снял 24.08. Смена модели ревьюера — отдельное решение
          # john с замером, а не правка мимоходом.
          #
          # ВХОДА `model` У ДЕЙСТВИЯ НЕТ: `action.yml` v1 такого input'а не объявляет
          # (проверено по файлу действия), и единственный путь параметра — этот же
          # passthrough `claude_args`, тем же `--model`, что у CLI.
          #
          # ВСПОМОГАТЕЛЬНЫЙ `claude-haiku-4-5` НЕ ТРОГАЕТСЯ: он в `modelUsage` того же
          # прогона рядом с основной моделью, им управляет само действие, и параметра
          # для него здесь нет.
          claude_args: |
            --model claude-sonnet-5
            --max-turns ${{ github.event.inputs.max_turns || '250' }}
            --allowedTools "Read,Grep,Glob,Edit,Write,Bash,mcp__github_inline_comment__create_inline_comment"

      # САМОПРОПУСК ДЕЙСТВИЯ УСТАНАВЛИВАЕТСЯ ФАКТОМ, А НЕ ЧИТАЕТСЯ ГЛАЗАМИ В ЛОГЕ
      # (тред 046). `claude-code-action` пропускает себя, если файл ЭТОГО воркфлоу
      # в прогоне отличается от версии на дефолтной ветке (в логе — «Skipping
      # action due to workflow validation»), и это штатный гард, на котором стоит
      # норма правила №14. Но прогон при этом заканчивается КРАСНЫМ, потому что
      # `verdict.md` не создан, — а с появлением смотрителя `Notifier Watch` (тред
      # 040) красный уведомитель означает «доставка потеряна, чините» и поднимает
      # сессию `dev-core` письмом в тред 042. Первый же живой случай был ложной
      # тревогой: прогон 30643932101 по #106 (голова `2b0bf8e`), ветка отстала от
      # main на #126, правивший этот файл; контуру чинить нечего — лечит это
      # автор PR, подтянув main в ветку.
      #
      # Условие гарда воспроизводится здесь ОДНОЙ КОМАНДОЙ и на тех же данных:
      # файл в чекауте прогона (для `pull_request` это merge-ref события — ровно
      # то, из чего GitHub взял воркфлоу) против файла на дефолтной ветке СЕЙЧАС.
      # Для `issue_comment`/`workflow_dispatch` воркфлоу и так берётся с дефолтной
      # ветки, и сравнение даёт равенство — шаг там ничего не меняет.
      #
      # НО УСЛОВИЕ ГАРДА — ЕЩЁ НЕ ФАКТ САМОПРОПУСКА (находка 2 curator, тред 046).
      # Расхождение файла — это то, при чём гард СРАБАТЫВАЕТ, а не доказательство,
      # что он сработал: сойтись оно может и на прогоне, где действие отработало,
      # а вердикта нет по другой причине (дефект H2, обрыв по ходам, отказ
      # модели). Выдать такой прогон за самопропуск дорого в обе стороны — шаг
      # статуса ниже промолчит зелёным вместо `exit 1`, а сообщение об отсутствии
      # вердикта назовёт неверную причину и посоветует бесполезное лечение
      # («подтяни main»), тогда как ломается совсем другое.
      # Вторая половина факта — ОТРАБОТАЛО ЛИ ДЕЙСТВИЕ, и она уже лежит рядом:
      # непустой `execution_file` есть ровно тогда, когда действие дало выход
      # (на самопропуске оно не даёт и пути — на этом же построен `if` шага
      # артефакта в конце файла).
      - name: Самопропуск действия — установить факт
        id: guard
        if: ${{ !cancelled() }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXECUTION_FILE: ${{ steps.reviewer.outputs.execution_file }}
        run: |
          set -euo pipefail
          WF=.github/workflows/claude-review.yml
          # СЕТЬ ПОСЛЕ ДЕЙСТВИЯ ХОДИТ ПО URL С ТОКЕНОМ ДЖОБЫ, а не через конфиг
          # чекаута, и это не перестраховка: первая редакция шага (#133) звала
          # `git fetch origin` и падала `Authentication failed`, exit 128 — оба
          # живых прогона, 30647692648 (#134) и 30648959020 (#130). Причина та же,
          # что у шага доставки ниже: `claude-code-action` вписывает в
          # `remote.origin.url` свой app-токен и ОТЗЫВАЕТ его последним своим
          # шагом, а наши шаги стартуют после отзыва и наследуют мёртвый креденшл
          # в URL. Цена ошибки — обратная задуманной: шаг, который заводился, чтобы
          # ложных тревог у смотрителя не было, сам красил КАЖДЫЙ прогон ревью и
          # звонил в тред 042 при живом доставленном вердикте.
          # URL передаётся АРГУМЕНТОМ и в конфиг не садится (осевший креденшл и был
          # исходной болезнью); `git remote set-url` здесь намеренно не трогаем —
          # починка главного чекаута принадлежит шагу доставки, а этот шаг
          # диагностический и чужого состояния не меняет.
          REMOTE="https://x-access-token:${GH_TOKEN}@${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}"
          # Фетч БЕЗ `--depth`: чекаут джобы полный (`fetch-depth: 0`), а мелкий
          # фетч посадил бы на него `.git/shallow` — цена больше пользы. Версия
          # берётся свежая, а не `origin/<default>` из чекаута: гард действия
          # сверялся с дефолтной веткой на своём шаге, то есть уже после старта.
          BASE=""
          if git fetch --no-tags "$REMOTE" "$DEFAULT_BRANCH"; then
            BASE=FETCH_HEAD
          elif git rev-parse --verify -q "origin/${DEFAULT_BRANCH}^{commit}" >/dev/null; then
            echo "::warning::fetch '${DEFAULT_BRANCH}' не удался — сравниваю с 'origin/${DEFAULT_BRANCH}' из чекаута джобы (снимок на её старте)."
            BASE="origin/${DEFAULT_BRANCH}"
          fi
          # ЭТОТ ШАГ НЕ КРАСИТ ПРОГОН НИКОГДА, и это его конструкция, а не
          # снисходительность: он лишь УСТАНАВЛИВАЕТ ФАКТ для двух шагов после
          # себя. Не установили — говорим вслух и отдаём `self_skip=0`, то есть
          # поведение до #133: нет вердикта → красный статус → письмо смотрителю.
          # Диагностика, способная уронить прогон, который она описывает, — ровно
          # та болезнь, которую здесь лечат.
          if [ -z "$BASE" ]; then
            echo "::warning::версию '${WF}' на '${DEFAULT_BRANCH}' получить не удалось — факт самопропуска не установлен, считаем self_skip=0."
            echo "self_skip=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --quiet "$BASE" HEAD -- "$WF"; then
            echo "self_skip=0" >> "$GITHUB_OUTPUT"
            echo "Файл воркфлоу совпадает с '${DEFAULT_BRANCH}' — гард действия не срабатывал."
          elif [ -n "${EXECUTION_FILE:-}" ]; then
            # Половины разошлись: файл отличается, но действие ОТРАБОТАЛО. Значит
            # гард не срабатывал, что бы ни говорило сравнение, и списывать
            # отсутствие вердикта на самопропуск нельзя — молчим `self_skip=0`,
            # то есть отсутствие вердикта снова красное и по имени.
            echo "self_skip=0" >> "$GITHUB_OUTPUT"
            echo "::warning::'${WF}' отличается от версии на '${DEFAULT_BRANCH}', но действие ОТРАБОТАЛО (execution_file: '${EXECUTION_FILE}') — это НЕ самопропуск; если вердикта нет, причина другая (H2, обрыв по ходам, отказ модели)."
          else
            echo "self_skip=1" >> "$GITHUB_OUTPUT"
            echo "::warning::'${WF}' в прогоне отличается от версии на '${DEFAULT_BRANCH}', и действие не дало выхода (execution_file пуст) — оно пропустило само себя, ревью не состоялось (правило №14)."
          fi

      # ДОСТАВКА ВЕРДИКТА — ШАГОМ ДЖОБЫ, А НЕ АГЕНТОМ (тред 088, постановка curator
      # 2026-09-02 по слову john в треде 082).
      #
      # ЧТО ЛЕЧИТСЯ. Доставка висела на агенте: он сам писал письмо в тред и сам
      # комментировал PR. Значит смерть модели ПОСЛЕ суждения съедала результат круга
      # целиком — 2026-09-02 в соседнем контуре вердикт был написан и не прочитан
      # никем, уехал только формальный статус. Шаг джобы переживает смерть модели по
      # построению: от круга требуется ровно `verdict.md` на диске.
      #
      # И ВТОРАЯ ПОЛОВИНА ТОЙ ЖЕ БОЛЕЗНИ — ПАРК. Письмо в тред уходит через дверь
      # `judgeParkSeen`, и тред, запаркованный ПО НОРМЕ («повесил метку → передал ход →
      # запарковался на `run:<N>`»), отвергал письмо круга: прогон 33661622377 по #204,
      # дословно «thread '067-park-lift-narrowing' is PARKED behind the round running on
      # PR #204 … and this message says nothing about it». Дверь была права; звонящий не
      # умел сказать о парке. Теперь стоящий парк ЧИТАЕТСЯ сухим прогоном той же команды
      # и по нему выбирается флаг (`park_flags` в `.github/scripts/review-delivery.sh`):
      # свой круг — снять, чужой парк — встать рядом. Слепое `--park-lifted run:<PR>`
      # чинило бы один случай из четырёх, а в остальных теряло письмо так же.
      #
      # ПОРЯДОК ДОСТАВОК ЗДЕСЬ — КОММЕНТ, ПОТОМ ТРЕД, и это то же решение, что в шаге
      # страховки ниже (тред 016, п.2): `gh` работает своим `GITHUB_TOKEN` и мёртвым
      # быть не может, а push в `comms` — может. Ставить живой канал в зависимость от
      # мёртвого значит терять оба.
      - name: Доставка вердикта — комментом в PR и письмом в тред
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -uo pipefail
          source "${GITHUB_WORKSPACE}/.code/.github/scripts/comms-push.sh"
          source "${GITHUB_WORKSPACE}/.code/.github/scripts/review-delivery.sh"

          # ВЕРДИКТ МОГ ЛЕЧЬ НЕ В КОРЕНЬ. Промпт требует корень рабочей директории, и
          # шаг статуса читает ровно его, но круг 14:13Z (#68) доставил вердикт изнутри
          # действия ПРИ ОТСУТСТВИИ файла в корне — значит модель умеет написать его
          # мимо (в `.code`, в `.comms-mail`, в подкаталог). Прежде это читалось как
          # «вердикта не было» и гасило доставки при живом суждении. Найденный вне корня
          # — берём и говорим ГДЕ (это же данные для диагноза H2).
          if [ ! -f verdict.md ]; then
            STRAY=$(find . -maxdepth 3 -name verdict.md -not -path './node_modules/*' -print -quit || true)
            if [ -n "${STRAY:-}" ]; then
              echo "::warning::verdict.md лежит не в корне, а в '${STRAY}' — копирую в корень (шаги статуса и доставки читают корень)."
              cp "$STRAY" verdict.md
            fi
          fi
          # Суждения нет — доставлять нечего; об отсутствии скажет итоговый шаг.
          if [ ! -f verdict.md ]; then
            echo "verdict.md нет — доставлять нечего, итог подведёт шаг ниже."
            exit 0
          fi

          VERDICT=$(verdict_field verdict.md verdict)
          case "$VERDICT" in
            approve|needs-fixes) ;;
            *)
              echo "::warning::первая строка verdict.md не вердикт ('${VERDICT}') — доставляю текст как есть, без шапки --verdict/--pr (её половина была бы отказом двери)."
              VERDICT=""
              ;;
          esac

          PR_BODY=$(gh pr view "$PR" --json body -q .body)
          HEAD_SHA=$(gh pr view "$PR" --json headRefOid -q .headRefOid)
          # Те же терпимые к оформлению regex'ы, что в merge-notify.yml: строки в
          # бэктиках уже один раз ослепили парсер (PR #16), и второй формат для одного
          # и того же поля здесь заводить нельзя.
          THREAD=$(printf '%s' "$PR_BODY" | grep -oiE '^[[:space:]`*]*thread`?:[[:space:]]*`?[0-9]{3}-[a-z0-9-]+' | head -1 | sed -E 's/^[^0-9]*//; s/[`*].*//') || true
          AUTHOR=$(printf '%s' "$PR_BODY" | grep -oiE '^[[:space:]`*]*role`?:[[:space:]]*`?[a-z][a-z0-9-]*' | head -1 | sed -E 's/^[^a-z]*role`?:[[:space:]]*`?//i') || true

          # АДРЕСАТ ХОДА: объявленный агентом (третья строка `verdict.md`) сверяется с
          # конфигом; нет его — берётся детерминированное правило, и письмо об этом
          # ГОВОРИТ. Роль сверяется ЧЕРЕЗ ПАКЕТ и по ЯВНОМУ `origin/main`, а не `HEAD`:
          # `.code` — каталог, в который по ходу ревью заходит сама модель, и на #127
          # она сделала там `git checkout pr-127`, отчего конфиг прочитался из ветки, а
          # существующая роль была объявлена несуществующей.
          role_ok() { # <роль>
            [ -n "${1:-}" ] || return 1
            (cd .code && pnpm -F agent-protocol --silent cli role exists --repo . --ref origin/main --role "$1" >/dev/null 2>&1)
          }
          DECLARED=$(verdict_field verdict.md waiting-on)
          DECLARED_OK=0; role_ok "$DECLARED" && DECLARED_OK=1
          AUTHOR_OK=0; role_ok "$AUTHOR" && AUTHOR_OK=1
          read -r WAIT WAIT_SOURCE <<< "$(review_waiting_on "$DECLARED" "$DECLARED_OK" "$VERDICT" "$AUTHOR" "$AUTHOR_OK")"

          # ТЕЛО — ФАЙЛОМ ВНЕ чекаута почты: доставка делает `reset --hard` при
          # отклонённом push и снесла бы файл, лежащий внутри. Оно ОДНО на коммент и
          # письмо — текст вердикта обязан быть идентичным в обоих адресах.
          BODY_TMP="$(mktemp)"
          cp verdict.md "$BODY_TMP"
          {
            printf '\n---\n\n'
            printf 'Доставлено шагами прогона [`%s`](%s) по PR #%s, голова `%s` (вердикт написан агентом ревьюера, доставка — джобой: тред 088).\n' \
              "$RUN_ID" "$RUN_URL" "$PR" "$HEAD_SHA"
            case "$WAIT_SOURCE" in
              declared) printf 'Ход передан роли `%s` — так объявил сам вердикт.\n' "$WAIT" ;;
              derived)  printf '⚠️ Ход передан роли `%s` — адресат ВЫВЕДЕН правилом (approve → `curator`, needs-fixes → `role:` из описания PR), а не объявлен вердиктом: строки `waiting-on:` в нём не было либо названной роли нет в конфиге.\n' "$WAIT" ;;
              *)        printf '⚠️ Ход НЕ ПЕРЕДАН никому: вердикт не объявил адресата, и вывести его не из чего (нет строки `role:` в описании PR либо такой роли нет в конфиге). Объявите ожидание вручную.\n' ;;
            esac
          } >> "$BODY_TMP"

          WAIT_ARGS=""
          [ "$WAIT_SOURCE" != "none" ] && WAIT_ARGS="--waiting-on ${WAIT}"
          VERDICT_ARGS=""
          # ПАРА `--verdict`/`--pr` — либо оба флага, либо ни одного: половина пары есть
          # ОТКАЗ записи (код 2), а потерять вердикт целиком хуже, чем потерять лифт.
          [ -n "$VERDICT" ] && VERDICT_ARGS="--verdict ${VERDICT} --pr ${PR}"

          # ДОСТАВКА 1 — КОММЕНТ В PR (живой канал первым).
          if gh pr comment "$PR" --body-file "$BODY_TMP"; then
            delivery_mark comment ok
            echo "Вердикт доставлен комментом в PR #${PR}."
          else
            delivery_mark comment failed
            echo "::error::коммент в PR #${PR} НЕ доставлен."
          fi

          # ДОСТАВКА 2 — ТРЕД. Некуда писать — это САМО ПО СЕБЕ находка ревьюера; в PR
          # текст уже висит, здесь остаётся назвать пробел.
          if [ -z "${THREAD:-}" ]; then
            delivery_mark thread failed
            echo "::warning::В описании PR #${PR} нет строки 'thread: NNN-slug' — вердикт в тред доставить некуда."
            exit 0
          fi
          # shellcheck disable=SC2086 # WAIT_ARGS/VERDICT_ARGS — наборы аргументов
          if deliver_to_thread "$THREAD" reviewer-pr "$BODY_TMP" \
              "docs(agent-comms): вердикт reviewer-pr по PR #${PR}" "$PR" \
              ${WAIT_ARGS} ${VERDICT_ARGS}; then
            delivery_mark thread ok
          else
            delivery_mark thread failed
          fi

      # ТРЕТЬЯ ДОСТАВКА одного вердикта — формальный review-статус GitHub (тред
      # 016, решение john). Повод: галка джобы и содержимое вердикта — разные
      # вещи, и человеческий глаз дважды за день прочитал зелёную джобу как «всё
      # ок» при `needs-fixes` внутри. Статус — не четвёртый текст, а ЯРЛЫК на тот
      # же: он выводится из первой строки `verdict.md`, того самого файла, которым
      # ушли первые две копии (в тред и комментом), — поэтому три доставки не
      # могут разойтись по смыслу.
      #
      # Шаг ДЕТЕРМИНИРОВАННЫЙ, а не пункт промпта: перевод «слово → статус»
      # суждения не требует, а поручение его модели добавляло бы способ выставить
      # статус, не совпадающий с текстом, — ровно ту болезнь, которую лечим.
      #
      # ПОВТОРНЫЙ КРУГ отдельного кода не требует: оба review приходят от одного
      # автора (`GITHUB_TOKEN` = github-actions[bot]), а approve поверх своего же
      # request-changes снимает его штатной механикой GitHub.
      #
      # REQUEST_CHANGES НЕ запирает merge насмерть (требование 4 постановки):
      # в защите main `required_approving_review_count: 0` и `enforce_admins:
      # false` — merge остаётся у john, а снять вердикт, снятый в треде
      # подтверждением curator (прецеденты #10, #14, #20), можно как кнопкой
      # dismiss, так и вторым кругом `@claude` — он перепишет статус сам. Ничего
      # для этого не строим: обе дороги уже есть.
      - name: Вердикт формальным review-статусом
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
          SELF_SKIP: ${{ steps.guard.outputs.self_skip }}
        run: |
          set -euo pipefail
          # Нет файла — вердикта НЕ БЫЛО: прогон не дошёл до него или действие
          # пропустило само себя (гард claude-code-action на PR, правящем этот
          # файл). Красный статус здесь честнее зелёного: запрошенное человеком
          # ревью не состоялось, и это должно быть видно, а не выглядеть успехом.
          # Написанный мимо корня здесь уже учтён: предыдущий шаг ищет его и
          # копирует в корень, поэтому «нет файла» на этой строке значит «нигде».
          #
          # РОВНО ОДИН КЛАСС ИСКЛЮЧЁН — САМОПРОПУСК (тред 046). Он не поломка, а
          # сработавший гард, и адресат о нём уже извещён предыдущим шагом
          # (коммент в PR + сообщение в тред, с причиной и лечением). Красный
          # здесь стоил бы сессии: со времени треда 040 за уведомителями следит
          # `Notifier Watch`, и красный прогон `Claude PR Review` он читает как
          # «доставка потеряна» — письмо в тред 042 и поднятая пара `dev-core`,
          # которой чинить нечего (первый живой случай — прогон 30643932101 по
          # #106, ветка отстала от main). Все остальные пути «вердикта нет»
          # (дефект H2, обрыв по ходам, отказ модели) остаются красными.
          if [ ! -f verdict.md ] && [ "${SELF_SKIP:-0}" = "1" ]; then
            echo "::warning::verdict.md нет, потому что действие пропустило само себя (воркфлоу ветки ≠ дефолтная) — ревью не состоялось, статус не выставлен, ложной тревоги смотрителю не поднимаем"
            exit 0
          fi
          if [ ! -f verdict.md ]; then
            source "${GITHUB_WORKSPACE}/.code/.github/scripts/review-delivery.sh"
            delivery_mark status failed
            echo "::error::verdict.md нет — вердикт не сформирован, формальный статус не выставлен"
            exit 1
          fi
          line=$(head -n1 verdict.md | tr -d '\r')
          case "$line" in
            'verdict: approve') event=--approve ;;
            'verdict: needs-fixes') event=--request-changes ;;
            *)
              source "${GITHUB_WORKSPACE}/.code/.github/scripts/review-delivery.sh"
              delivery_mark status failed
              echo "::error::первая строка verdict.md не вердикт: '$line' (ожидалось 'verdict: approve' либо 'verdict: needs-fixes')"
              exit 1
              ;;
          esac
          # ЯКОРЬ `pr:` — телеметрия (счёт кругов ревью, тред 029), и права мешать
          # доставке у неё нет: нет якоря — предупреждение в лог, статус выставляется
          # как обычно, круг просто не посчитается. Телеметрия, способная съесть
          # доставку вердикта, хуже отсутствия телеметрии (условие приёмки curator).
          if ! sed -n '2p' verdict.md | tr -d '\r' | grep -qE "^pr: #?${PR}$"; then
            echo "::warning::вторая строка verdict.md не якорь 'pr: ${PR}' — круг ревью по этому PR не посчитается (тред 029)"
          fi
          # Тело review КОРОТКОЕ и со ссылкой: полный текст уже висит комментом в
          # этом же PR, и вторая его копия на одной странице читалась бы как
          # второй вердикт.
          # УЧЁТ ПОИМЁННЫЙ (тред 088, требование B): исход ЭТОЙ доставки записывается
          # фактом, и итоговый шаг ниже подводит итог по трём записям, а не по наличию
          # `verdict.md` на диске. Раньше падение одного лишь статуса было либо невидимо,
          # либо печаталось как «не сработала ни одна из трёх».
          source "${GITHUB_WORKSPACE}/.code/.github/scripts/review-delivery.sh"
          if gh pr review "$PR" "$event" --body "$line — полный текст комментом в этом PR и сообщением в треде постановки (доставка 3 из 3, .github/workflows/claude-review.yml)."; then
            delivery_mark status ok
          else
            delivery_mark status failed
            echo "::error::формальный review-статус НЕ выставлен"
            exit 1
          fi

      # ИТОГ ДОСТАВОК — ПО ФАКТУ, А НЕ ПО НАЛИЧИЮ ФАЙЛА НА ДИСКЕ (тред 088,
      # требование B постановки).
      #
      # ЧТО БЫЛО НЕ ТАК. Шаг судил по `[ -f verdict.md ]` и выходил `0`, как только файл
      # нашёлся, — то есть ПРОВАЛ ДОСТАВКИ ПРИ ЖИВОМ СУЖДЕНИИ был невидим целиком. А
      # когда он говорил, он говорил неправду в обратную сторону: 2026-09-02 в соседнем
      # контуре вердикт уехал письмом и комментом, упал только формальный статус — и под
      # самим вердиктом было напечатано «не сработала ни одна из трёх доставок».
      # Теперь каждая из трёх учтена поимённо (`delivery_mark`), а эта формулировка
      # печатается, только если это правда (`delivery_summary`).
      #
      # ШАГ ПОСЛЕДНИЙ ИЗ ТРЁХ и потому подводит итог: статус выставляется выше, и его
      # исход тоже уже записан.
      #
      # ОТСУТСТВИЕ ВЕРДИКТА ДОСТАВЛЯЕТСЯ ТАК ЖЕ, КАК ВЕРДИКТ (решение john, тред 029).
      # Прогон ревьюера умеет закончиться `success`, не создав `verdict.md`: 2026-07-28
      # трижды за сутки (PR #47/#55/#57). Цена молчания — не потерянный текст, а
      # НЕОТЛИЧИМОСТЬ: со стороны почты «ревью не состоялось» и «ревью ещё идёт»
      # выглядят одинаково, и PR зависает, пока кто-нибудь не откроет лог глазами.
      # Ретрая здесь намеренно НЕТ (решение john, тред 029).
      #
      # ПОРЯДОК ДОСТАВКИ ЗДЕСЬ ОБРАТНЫЙ норме 014: сначала КОММЕНТ В PR, потом тред.
      # Норма 014 («сначала тред») защищает от обрыва прогона. Но у ЭТОГО шага отказ
      # другой: мёртвый канал. Ставить живой канал (`gh pr comment` через `GITHUB_TOKEN`)
      # в зависимость от мёртвого (push в `comms`) значит терять сообщение целиком, хотя
      # рабочая доставка была в шаге от него; так и произошло четыре раза 2026-07-29.
      - name: Итог доставок — что доехало и что нет
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          SELF_SKIP: ${{ steps.guard.outputs.self_skip }}
          # ТРАНСКРИПТ ДЕЙСТВИЯ — ЭТОМУ ШАГУ, а не только гарду и артефакту: причина, по
          # которой круг кончился без вердикта, лежит машинными полями его последней
          # записи, и шаг идёт РАНЬШЕ загрузки артефакта, то есть файл ещё на диске.
          EXECUTION_FILE: ${{ steps.reviewer.outputs.execution_file }}
        run: |
          set -uo pipefail
          source "${GITHUB_WORKSPACE}/.code/.github/scripts/comms-push.sh"
          source "${GITHUB_WORKSPACE}/.code/.github/scripts/review-delivery.sh"

          THREAD_STATE="$(delivery_state thread)"
          COMMENT_STATE="$(delivery_state comment)"
          STATUS_STATE="$(delivery_state status)"
          VERDICT_PRESENT=0; [ -f verdict.md ] && VERDICT_PRESENT=1

          SUMMARY="$(delivery_summary "$THREAD_STATE" "$COMMENT_STATE" "$STATUS_STATE")"
          echo "Доставки вердикта: ${SUMMARY}"
          # КОД ВЫХОДА ЭТОГО ШАГА — ПРЕДИКАТОМ ИЗ СКРИПТА, а не безусловной единицей в
          # хвосте: правило «краснеть или нет» гонялось бы иначе только живым кругом
          # ревью, и ровно так из него выпал самопропуск (замер curator, тред 088).
          # Решается ЗДЕСЬ, до доставок, потому что доставки его не меняют: их
          # собственный отказ красит шаг сам, ниже.
          FINAL_CODE="$(delivery_exit_code "${SELF_SKIP:-0}" "$VERDICT_PRESENT" \
            "$THREAD_STATE" "$COMMENT_STATE" "$STATUS_STATE")"

          # Всё доехало — говорить нечего, и молчание здесь честное.
          if [ "$THREAD_STATE" = "ok" ] && [ "$COMMENT_STATE" = "ok" ] && [ "$STATUS_STATE" = "ok" ]; then
            exit "$FINAL_CODE"
          fi

          PR_BODY=$(gh pr view "$PR" --json body -q .body)
          HEAD_SHA=$(gh pr view "$PR" --json headRefOid -q .headRefOid)
          THREAD=$(printf '%s' "$PR_BODY" | grep -oiE '^[[:space:]`*]*thread`?:[[:space:]]*`?[0-9]{3}-[a-z0-9-]+' | head -1 | sed -E 's/^[^0-9]*//; s/[`*].*//') || true
          ROLE=$(printf '%s' "$PR_BODY" | grep -oiE '^[[:space:]`*]*role`?:[[:space:]]*`?[a-z][a-z0-9-]*' | head -1 | sed -E 's/^[^a-z]*role`?:[[:space:]]*`?//i') || true

          BODY_TMP="$(mktemp)"
          if [ -f verdict.md ]; then
            # ВЕРДИКТ ЕСТЬ, А ДОСТАВКА НЕ УДАЛАСЬ — дыра, у которой до треда 088 не было
            # имени. Суждение живо, и главное здесь — сказать, ГДЕ ЕГО ВЗЯТЬ.
            {
              printf '⚠️ **Вердикт вынесен, но доставлен не полностью.**\n\n'
              printf '%s\n\n' "$SUMMARY"
              printf 'PR #%s, голова `%s`, прогон [`%s`](%s). Суждение НЕ потеряно: текст вердикта лежит в прогоне (лог шага доставки и артефакт транскрипта `reviewer-execution-%s-%s`), и первая его строка — `%s`.\n\n' \
                "$PR" "$HEAD_SHA" "$RUN_ID" "$RUN_URL" "$PR" "$RUN_ID" "$(head -n1 verdict.md | tr -d '\r')"
              printf 'Недоехавшую доставку повторить нечем автоматически — перезапуск круга (снять и повесить метку `review` заново) вынесет НОВЫЙ вердикт и потратит ещё один прогон; если текст уже виден в этом PR, дешевле донести его руками.\n'
            } > "$BODY_TMP"
            COMMIT_MSG="chore(comms): вердикт по PR #${PR} доставлен не полностью"
          else
            {
              printf '**Ревью не состоялось: вердикт не сформирован.**\n\n'
              printf 'Прогон [`%s`](%s) по PR #%s (голова `%s`) завершился, не создав `verdict.md`, — поэтому %s\n\n' \
                "$RUN_ID" "$RUN_URL" "$PR" "$HEAD_SHA" "$SUMMARY"
              printf 'Это НЕ суждение о PR, а его отсутствие: молчание ревьюера здесь ничего не значит.\n\n'
              # ПРИЧИНА НАЗЫВАЕТСЯ, КОГДА ОНА ИЗВЕСТНА, И ЛЕКАРСТВО ВМЕСТЕ С НЕЙ (тред
              # 046). На самопропуске совет «перезапусти метку» ВРЕДЕН: на той же голове
              # гард сработает снова, и автор платит вторым кругом ни за что.
              #
              # И ЭТО ЖЕ ВЕРНО ПРИ 429 (тред 118). Лимит аккаунта — вторая причина, при
              # которой общий совет активно вреден: пока лимит стои́т, второй круг сгорит
              # так же. Причина берётся МАШИННЫМИ полями последней записи транскрипта
              # (`review_failure_cause`), а время ресета — ДОСЛОВНОЙ строкой `result`,
              # которая в дату не разбирается: её формат никто не обещал, и парсер стал бы
              # новым источником вранья в письме, существующем ради правды о причине.
              # Причины не видно (файла нет, пуст, не разбирается) — печатается СЕГОДНЯШНИЙ
              # общий текст без изменений: молчание честнее догадки.
              GENERIC_RETRY='Ревью перезапускается вручную — коммент `@claude` в PR либо снять и повесить метку `review` заново. Автоповтора нет намеренно (решение john, тред 029): сначала класс считается, потом решается, платить ли за вторую попытку.'
              CAUSE=""
              [ -n "${EXECUTION_FILE:-}" ] && CAUSE="$(review_failure_cause "$EXECUTION_FILE")"
              if [ "${SELF_SKIP:-0}" = "1" ]; then
                printf 'Причина известна и это НЕ поломка: файл `.github/workflows/claude-review.yml` в этом прогоне отличается от версии на дефолтной ветке, и `claude-code-action` пропустил сам себя (гард против промпт-инъекции правкой воркфлоу, норма правила №14).\n\n'
                printf 'Перезапуск метки/коммента на ТОЙ ЖЕ голове ничего не изменит — гард сработает снова. Лечение одно: подтянуть `main` в ветку (`git merge origin/main`) и повесить метку `review` заново; если воркфлоу правит сам этот PR — ревью человеческое, автоматика включится со следующего PR после merge.\n'
              elif [ "$CAUSE" = "limit" ]; then
                printf 'Причина известна МАШИННО и это НЕ про содержание PR: сессия ревьюера упёрлась в ЛИМИТ АККАУНТА посреди круга — последняя запись транскрипта прогона несёт `api_error_status: 429`, `terminal_reason: api_error`.\n\n'
                printf '⛔ **Перезапуск ДО ресета сожжёт второй круг впустую:** пока лимит стои́т, новая сессия упрётся в него так же, и заплачено будет за ничто.\n\n'
                CAUSE_RESULT="$(review_failure_result "$EXECUTION_FILE")"
                if [ -n "$CAUSE_RESULT" ]; then
                  printf 'Время ресета названо самой сессией. Строка `result` той же записи ДОСЛОВНО (в дату не разбирается намеренно — формат её никто не обещал):\n\n'
                  printf '```\n%s\n```\n\n' "$CAUSE_RESULT"
                else
                  printf 'Строки `result` в записи нет — время ресета смотреть в транскрипте прогона (артефакт `reviewer-execution-%s-%s`).\n\n' "$PR" "$RUN_ID"
                fi
                printf 'ПОСЛЕ ресета — %s\n' "$GENERIC_RETRY"
              elif [ -n "$CAUSE" ]; then
                printf 'Причина названа машинным полем последней записи транскрипта прогона: `%s`. Это про круг, а не про содержание PR.\n\n' "$CAUSE"
                printf '%s\n' "$GENERIC_RETRY"
              else
                printf '%s\n' "$GENERIC_RETRY"
              fi
            } > "$BODY_TMP"
            COMMIT_MSG="chore(comms): ревью PR #${PR} не состоялось — вердикт не сформирован"
          fi

          # Роль сверяется С КОНФИГОМ И ЧЕРЕЗ ПАКЕТ (как в merge-notify): опечатка иначе
          # завалила бы `new-message`, и сообщение потерялось бы целиком. Лучше сказать
          # без передачи хода, чем не сказать. REF — ЯВНЫЙ `origin/main`, не `HEAD`:
          # в `.code` по ходу ревью чекаутится сама модель (#127).
          WAIT_ARGS=""
          if [ -n "${ROLE:-}" ]; then
            if (cd .code && pnpm -F agent-protocol --silent cli role exists --repo . --ref origin/main --role "$ROLE" >/dev/null 2>&1); then
              WAIT_ARGS="--waiting-on ${ROLE}"
            else
              echo "::warning::В PR #${PR} указана роль '${ROLE}', которой нет в конфиге протокола — ход не передан."
              printf '\n⚠️ Ход не передан: в описании PR указана роль `%s`, которой нет в конфиге протокола — объявите ожидание вручную.\n' "$ROLE" >> "$BODY_TMP"
            fi
          else
            printf '\n⚠️ Ход не передан: в описании PR не было строки `role: <id>` — объявите ожидание вручную.\n' >> "$BODY_TMP"
          fi

          # ДОСТАВКА 1 — КОММЕНТ В PR (живой канал первым, см. шапку шага).
          gh pr comment "$PR" --body-file "$BODY_TMP" \
            || { echo "::error::об исходе доставок не сообщено даже комментом в PR."; exit 1; }
          echo "Об исходе доставок сообщено комментом в PR #${PR}."

          # ДОСТАВКА 2 — ТРЕД. ПАРЫ `--verdict`/`--pr` здесь нет и на ветви «вердикта
          # нет», и это выбор (тред 042): исхода не сформировано, объявлять нечего, а
          # шапка с вердиктом открывала бы ход по суждению, которого никто не выносил.
          # На ветви «вердикт есть, доставка упала» её тоже нет: письмо-то не вердикт, а
          # сообщение о его судьбе, и вторая шапка на один круг спорила бы с первой.
          if [ -z "${THREAD:-}" ]; then
            echo "::warning::В описании PR #${PR} нет строки 'thread: NNN-slug' — в тред сообщить некуда (коммент в PR доставлен)."
            exit 1
          fi
          # shellcheck disable=SC2086 # WAIT_ARGS — набор аргументов, не строка
          deliver_to_thread "$THREAD" reviewer-pr "$BODY_TMP" "$COMMIT_MSG" "$PR" ${WAIT_ARGS} \
            || { echo "::error::об исходе доставок в тред ${THREAD} НЕ сообщено (коммент в PR доставлен)."; exit 1; }
          # Шаг ГРОМКИЙ по построению — доехало не всё, и зелёная джоба здесь читалась бы
          # как успешный круг, — КРОМЕ одного класса: самопропуска действия, где сообщение
          # только что уехало обоими каналами, ревью не состоялось по сработавшему гарду, и
          # красный поднял бы смотрителя на пустое место (тред 046). Судит это
          # `delivery_exit_code`, и его четыре случая покрыты юнитом.
          if [ "$FINAL_CODE" = "0" ]; then
            echo "Самопропуск действия: сообщение о несостоявшемся ревью доставлено комментом и письмом, поломки нет — джоба остаётся зелёной (тред 046)."
          fi
          exit "$FINAL_CODE"

      # ТРАНСКРИПТ СЕССИИ РЕВЬЮЕРА — АРТЕФАКТОМ (тред 016, 2026-07-29). Прогон
      # ревьюера сейчас НЕ ОСТАВЛЯЕТ О СЕБЕ НИЧЕГО: в логе джобы девять минут работы
      # представлены только эхом промпта, ни одного tool-call, и артефактов у
      # прогонов ноль. Поэтому дефект H2 — «действие завершилось `success`, не создав
      # `verdict.md`» — сегодня недиагностируем ПО ПОСТРОЕНИЮ: видно, что суждения
      # нет, и не видно, на чём оно потерялось. Каждый слепой круг стоит ~$2.4, а
      # класс уже четвёрка за сутки.
      #
      # Шаг ПОСЛЕДНИЙ и `continue-on-error` — телеметрия не имеет права мешать
      # доставке (то же условие, что у якоря `pr:` в шаге статуса): её отказ не
      # должен ни валить джобу, ни задерживать вердикт. `if-no-files-found: warn` —
      # на случай, когда действие пропустило само себя и выхода не дало вовсе.
      #
      # ПУСТОЙ `execution_file` — НЕ ЗАПУСКАЕМ ВОВСЕ (тред 046): `warn` покрывает
      # «путь есть, файла по нему нет», а на самопропуске действие не даёт и пути,
      # и `upload-artifact` падает `Input required and not supplied: path` —
      # красной аннотацией в прогоне, за которым теперь следит смотритель. Ошибка
      # телеметрии, читающаяся как отказ доставки, — тот же класс, что лечит
      # шаг статуса выше.
      - name: Транскрипт ревьюера — артефактом (для диагноза H2)
        if: ${{ !cancelled() && steps.reviewer.outputs.execution_file != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@v5
        with:
          name: reviewer-execution-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}-${{ github.run_id }}
          path: ${{ steps.reviewer.outputs.execution_file }}
          if-no-files-found: warn
          retention-days: 14
