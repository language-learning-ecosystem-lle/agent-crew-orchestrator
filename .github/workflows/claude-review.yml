name: Claude PR Review

# Ревьюер роли reviewer-pr. Карточка роли и КРИТЕРИИ — REVIEWER.md в корне
# (единственный список); ROLES.md упразднён (тред 012) и здесь не читается.
# Триггеры намеренно РУЧНЫЕ — не на каждый synchronize: расход квоты под контролем.
#   • метка `review` на PR
#   • коммент `@claude` в PR
#   • workflow_dispatch с номером PR
on:
  pull_request:
    types: [labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: Номер PR для ревью
        required: true
        type: string
      max_turns:
        description: Лимит ходов ревьюера (для проверки поведения на исчерпании бюджета, тред 014)
        required: false
        default: "250"
        type: string

jobs:
  review:
    # CONCURRENCY НА УРОВНЕ JOB, не workflow (тред 014). При workflow-level группа
    # вычисляется ДО job-`if`, и бот-коммент самого ревьюера (issue_comment),
    # отсеиваемый условием ниже, всё равно успевал погасить идущий прогон по метке
    # — ревьюер убивал сам себя между публикацией вердикта в PR и записью в тред
    # (run 29883515576, cancelled). Отсечённый по `if` job в concurrency-группу НЕ
    # входит, поэтому перенос на уровень job это закрывает.
    concurrency:
      group: claude-review-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
      cancel-in-progress: true
    # Комменты ботов игнорируем: ревьюер не реагирует ни на себя, ни на другую
    # автоматику — второй слой защиты от того же самозацикливания.
    if: |
      (github.event_name == 'pull_request' && github.event.label.name == 'review') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null && github.event.comment.user.type != 'Bot' && contains(github.event.comment.body, '@claude')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write # запись вердикта в ветку comms
      pull-requests: write # review-коммент в PR
      issues: write # триггер issue_comment
      id-token: write
      actions: read
      # `checks: read` — не про сами джобы ревьюера, а про то, что ревьюер обязан
      # ПРОГОНЯТЬ, а не оценивать: GraphQL-поле `statusCheckRollup` (`gh pr view`,
      # `cli merge-gate`) GitHub отдаёт только токену с этим scope, а у installation-
      # токена джобы есть РОВНО перечисленное здесь — неперечисленное обнуляется, а не
      # наследуется. Без строки весь вызов падает `Resource not accessible by
      # integration`, и это уже случалось: вердикт по #61 не смог воспроизвести
      # заявленный живой прогон merge-gate именно из-за неё.
      #
      # ЭТОЙ СТРОКИ ОДНОЙ НЕ ХВАТАЕТ, и это выяснилось фактом (вердикт по #61,
      # 2026-07-29, тред 026): после её посадки тот же вызов из среды ревьюера падал
      # тем же отказом. `permissions:` управляет токеном ДЖОБЫ, а внутри действия
      # `gh` ходит НЕ им: `claude-code-action` меняет OIDC-токен на собственный
      # app-токен и им же перезаписывает `GH_TOKEN` в окружении модели
      # (`src/entrypoints/run.ts`: `process.env.GH_TOKEN = githubToken`) — поэтому
      # и `env: GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}` на шаге действия ничего бы не
      # изменил, его затирают. Scope у app-токена запрашивается отдельно —
      # `additional_permissions` на самом шаге (ниже); строка здесь остаётся
      # обязательной половиной: обмен не выдаёт того, чего нет у джобы.
      checks: read
    steps:
      # Полная история: ревьюеру нужен merge-base с main для честного диффа,
      # ветка comms дотягивается отдельным fetch из промпта.
      # Bash разрешён целиком (claude_args ниже): гранулярный allowlist из
      # префиксов не переживает ни составные команды, ни подстановки — первый
      # прогон дал 24 отказа прав и ноль публикаций при успешном статусе джобы.
      # Раннер одноразовый, а метку `review` вешает человек с правами на репо.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Зависимости PR-чекаута — чтобы ревьюер ПРОГНАЛ проверки, а не рассуждал о
      # диффе (тред 007). Шаги те же и в том же порядке, что в ci.yml: расхождение
      # окружений ревьюера и CI и есть закрываемая дыра.
      # (setup-node с `cache: pnpm` требует, чтобы pnpm был поднят раньше.)
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # ВТОРОЙ ЧЕКАУТ main + УСТАНОВКА — пакет `agent-protocol` для ЗАПИСИ вердикта
      # в тред через `cli new-message` (тред 014). Тот же приём `.code`, что у
      # merge-notify: писать надо АКТУАЛЬНОЙ версией протокола, а не той, что в
      # PR-ветке (её и ревьюируем). `pnpm install` здесь ОБЯЗАТЕЛЕН: без него на
      # свежем чекауте `tsx: not found`, и запись уходит в путь ошибки — ровно та
      # дыра, что reviewer-pr поймал в `/wake` (PR #30). merge-notify/comms-derived
      # ставят зависимости после второго чекаута всегда; здесь тем более.
      - uses: actions/checkout@v5
        with:
          ref: main
          path: .code
      - run: pnpm install --frozen-lockfile
        working-directory: .code

      - uses: anthropics/claude-code-action@v1
        id: reviewer
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # SCOPE ДЛЯ ТОКЕНА, КОТОРЫМ РАБОТАЕТ САМА МОДЕЛЬ (вторая половина к
          # `checks: read` в `permissions:` выше). Действие меняет OIDC-токен джобы на
          # свой app-токен, и обмен запрашивает РОВНО contents/pull_requests/issues,
          # если не сказано иначе; `additional_permissions` — то самое «иначе».
          # Без него `gh pr view --json statusCheckRollup` (и `cli merge-gate`,
          # который на нём стоит) отказывает ревьюеру `Resource not accessible by
          # integration` — наблюдалось дважды подряд, на #61 до и после посадки
          # `checks: read` в джобу.
          #
          # Форму выбирали из двух. `github_token: ${{ secrets.GITHUB_TOKEN }}`
          # тоже дало бы scope (он ОТМЕНЯЕТ обмен и берёт токен джобы как есть) — и
          # вместе с обменом отменил бы гард самого действия «workflow ветки
          # отличается от дефолтной — пропускаю себя», на котором стоит норма
          # правила №14 (воркфлоу-PR своего ревью не получает). Права ревьюера не
          # стоят снятия защиты от промпт-инъекции через правку воркфлоу в PR.
          #
          # ПРОВЕРЯЕТСЯ ЭТО ТОЛЬКО ПОСЛЕ MERGE — по той же причине: на PR, который
          # правит этот файл, действие пропускает себя, то есть обмен здесь не
          # состоится вовсе. Если у установки приложения нет `checks`, обмен
          # откажет и джоба упадёт громко на первом же круге ревью после merge —
          # тогда откат этих строк возвращает прежнее поведение целиком.
          #
          # ЧТО ИЗ ЭТОГО СБЫЛОСЬ, ИЗМЕРЕНО ФАКТОМ (тред 026, 4.4; прогон 30617709963,
          # артефакт `reviewer-execution-112-30617709963`): обмен НЕ отказал и джоба НЕ
          # упала — `checks: read` до app-токена доехал. В том же прогоне рукой ревьюера:
          #   • `GET /commits/{sha}/check-runs` → 200, `total_count: 3` (репозиторий
          #     ПРИВАТНЫЙ, значит скоуп `checks` у токена есть, иначе был бы 403);
          #   • `GET /commits/{sha}/status` → 403 (это `statuses`, отдельный скоуп);
          #   • `gh pr view --json statusCheckRollup` → GraphQL-отказ РОВНО на подполе
          #     `...statusCheckRollup.contexts.nodes.N.checkSuite.workflowRun` — это
          #     ресурс Actions, а не Checks.
          # Отсюда `actions: read` ниже: у ДЖОБЫ он есть (`permissions:` выше), но
          # app-токен наследует не права джобы, а РОВНО запрошенное здесь — обмен шлёт
          # этот блок как есть (`claude-code-action/src/github/token.ts`,
          # `parseAdditionalPermissions` → тело обмена). Одного `checks: read` не хватало
          # не потому, что его не выдали, а потому, что `gh` в этом запросе трогает ещё и
          # Actions.
          additional_permissions: |
            checks: read
            actions: read
          prompt: |
            REPO: ${{ github.repository }}
            PR: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}

            Ты — роль `reviewer-pr` протокола agent-comms. Код НЕ меняешь, PR НЕ мёрджишь.
            Карточка роли и КРИТЕРИИ — `REVIEWER.md` в корне репо (единственный список).
            `ROLES.md` упразднён — НЕ читай его.

            ТВОЙ ХОД И ЕСТЬ ТВОЯ СЕССИЯ: завершил ход — процесс вышел, и разбудить
            его нечем. Поэтому ЖДАТЬ МОЖНО ТОЛЬКО В ПЕРЕДНЕМ ПЛАНЕ: длинный прогон
            (`pnpm turbo test`, `pnpm turbo typecheck`) запускается и ДОЖИДАЕТСЯ той
            же командой, а фоновый запуск с намерением «вернусь, когда закончится» —
            это выход без результата. Так теряется круг ревью целиком: действие
            заканчивается `success`, `verdict.md` не создан, и гаснут разом все три
            доставки (дефект H2, воспроизведён дважды на одной голове `e55b806`,
            тред 023).

            ЛОВУШКА НАЗВАНА ИМЕНАМИ ТВОИХ ЖЕ ИНСТРУМЕНТОВ, а не абстракцией:
            `Bash` с `run_in_background` здесь НЕ ИСПОЛЬЗУЕТСЯ. Ждущего инструмента
            в твоём `--allowedTools` НЕТ — ни `Monitor`, ни `TaskOutput`: список
            целиком это `Read, Grep, Glob, Edit, Write, Bash` и инлайн-коммент
            GitHub. Значит вернуться к фоновому прогону тебе НЕЧЕМ: попытка встать
            на него блокирующим ожиданием — отказ прав, и «ожиданием» остаётся
            парковка, то есть выход без вердикта. Так умер круг по PR #116 (голова
            `6eecb593`, прогон 30626953657): замер базы ушёл в фон, `Monitor`
            отказал, 65 ходов и $2.91 не дали ни строки суждения (тред 044).

            ВЫПОЛНИМАЯ ЗАМЕНА, без которой «не уходи в фон» — требование
            невыполнимое: длинный замер РАЗБИВАЕТСЯ НА ШАГИ под потолок одного
            вызова `Bash` (`timeout: 600000`, десять минут — максимум, и задавать
            его надо явно: по умолчанию вызов обрывается заметно раньше). Замер
            базы делается так: `git worktree add` + `pnpm install --frozen-lockfile`
            ОДНИМ вызовом, `pnpm turbo test` (или `vitest run`) — СЛЕДУЮЩИМ; не
            влезает и это — дели дальше, по пакетам или по проектам vitest. Каждый
            шаг завершается сам и возвращает тебе вывод; фон не нужен ни на одном.

            Не помещаешься в ходы или прогон не успевает даже по шагам — вердикт
            всё равно пишется по тому, что успел, а непрогнанное называется словами:
            частичный вердикт доставлен, а полный, которого никто не получил, — нет.

            ПОРЯДОК ДОСТАВКИ ВАЖЕН: вердикт пишется СНАЧАЛА В ТРЕД, ПОТОМ комментом
            в PR. Тред для протокола первичен: если прогон оборвётся (лимит ходов,
            сбой) ПОСЛЕ записи в тред — вердикт уцелел; обратный порядок его терял
            (тред 014). Поэтому запись в тред — среди первых действий после того,
            как вердикт сформирован, а не последним шагом.

            1. Отревьюй PR строго по `REVIEWER.md`: дифф (`gh pr diff`), описание и
               обсуждение (`gh pr view --comments`), плюс ЛЮБЫЕ файлы базы, нужные
               для контекста — ревью по одному диффу критериями 2, 3 и 9 не делается.

               Постановка — тред из строки `thread: NNN-slug` в описании PR. Подтяни
               почту и прочитай тред ЦЕЛИКОМ, включая ОСТАЛЬНЫЕ файлы папки (крупные
               постановки — отдельными документами рядом с тредом):
                   git fetch --no-tags origin comms
                   git worktree add .comms-mail FETCH_HEAD
                   ls .comms-mail/agent-comms/<slug>/
                   # мигрированный тред — сообщения в messages/*.md; legacy — единый _thread.md
               Роль автора PR — строка `role: <id>` в описании PR (нужна для waiting-on).
               Нет строки `thread:` — это находка (критерий 3): скажи в вердикте, ревьюй по остальным.

            2. ПРОГОНЯЙ проверки, а не оценивай по диффу (зависимости установлены,
               окружение = CI-джоба `checks`): `pnpm turbo typecheck`, `pnpm turbo
               test`, `pnpm exec biome check <файлы>`. Прогон не удался — в вердикте
               ФАКТИЧЕСКАЯ ошибка (команда и её вывод), а не «среда не позволила».

            3. Сформируй вердикт по разделу «Формат вердикта» `REVIEWER.md` (первая
               строка `verdict: approve` либо `verdict: needs-fixes`, ВТОРАЯ строка —
               `pr: <номер PR из шапки этого промпта>`) и запиши его ЦЕЛИКОМ в файл
               `$GITHUB_WORKSPACE/verdict.md` — им доставим в оба адреса, чтобы текст
               был идентичен.

               ПУТЬ АБСОЛЮТНЫЙ, и это не придирка: шаги джобы после тебя читают РОВНО
               `$GITHUB_WORKSPACE/verdict.md`, а ты по ходу ревью заходишь в `.code` и
               `.comms-mail` — `verdict.md`, написанный относительным путём из чужого
               каталога, для них не существует, и вердикт теряет две доставки из трёх
               при живом суждении (так было на #68 14:13Z, тред 016).

               Вторая строка — ЯКОРЬ (тред 029): вердикт уезжает в тред, а тред PR-у
               не равен, и без номера круги ревью не группируются по PR ничем.
               Порядок строк обязателен: первую читает шаг статуса, предварять её
               нечем, поэтому якорь идёт вторым, а не первым.

            4. ПЕРВЫМ ДЕЛОМ — вердикт В ТРЕД, ветка `comms`, append-only. INDEX
               РУКАМИ НЕ ПРАВЬ — его пересоберёт генератор из источника.

               `WAIT` — РОВНО ОДНА роль: кто ходит следующим (схема v13, тред 024;
               список дверь команды отвергает, а не сворачивает, и `john` в это
               поле не принимает вовсе). Кто именно — решает сам вердикт:

               - `verdict: needs-fixes` → автор PR (`role:` из описания): ход его,
                 правки его.
               - `verdict: approve` → **`curator`**, а не автор и не john. Merge и
                 есть следующий ход контура после approve, и право на него — у
                 curator (тред 026). Пока approve адресовался автору, у готового к
                 merge PR не было события вовсе: #58 провисел два часа после
                 вердикта, потому что тред ждал того, кого контур не поднимает.
                 Исключение — PR, который сам curator мёржить не вправе (доки
                 власти: `docs/roles/**`, `PROTOCOL.md`, `REVIEWER.md`,
                 `agent-protocol.json`): такой ждёт автора, а merge за john, и
                 скажи это в вердикте.

               Чужое незакрытое ожидание в поле не сворачивается — оно живёт
               задачами с владельцами, а не тактом разговора; если тред ждал
               кого-то ещё по другому вопросу, назови это словами в теле вердикта.

               Форма зависит от того, мигрирован ли тред. ОБЕ ветви ИСПОЛНЯЕМЫ, и
               после записи — проверка, что в тред реально что-то легло, иначе
               падение: тихий no-op здесь — наша же болезнь.
                   SLUG=<slug из thread:>; WAIT="<одна роль>"
                   TF=".comms-mail/agent-comms/$SLUG/_thread.md"
                   if [ -d ".comms-mail/agent-comms/$SLUG/messages" ]; then
                     # мигрированный — файл-сообщение ПАКЕТОМ из чекаута main (.code):
                     (cd .code && pnpm -F agent-protocol --silent cli new-message \
                        --root "$GITHUB_WORKSPACE/.comms-mail/agent-comms" --repo . --ref origin/main \
                        --thread "$SLUG" --from reviewer-pr --expects answer --waiting-on "$WAIT" \
                        --worker gh-action \
                        --body-file "$GITHUB_WORKSPACE/verdict.md" --write --no-push) \
                       || { echo "::error::new-message не записал вердикт"; exit 1; }
                   else
                     # legacy (нет messages/) — ИСПОЛНЯЕМО дописать секцию в конец _thread.md:
                     LAST=$(grep -oE '^## msg-[0-9]+' "$TF" | grep -oE '[0-9]+' | sort -n | tail -1)
                     NEXT=$(printf '%03d' $(( 10#${LAST:-0} + 1 )))
                     { printf '\n## msg-%s · from: reviewer-pr · %s · expects: answer\n\n' "$NEXT" "$(date -u +%F)"
                       cat "$GITHUB_WORKSPACE/verdict.md"
                       printf '\nwaiting-on → %s\n' "$WAIT"
                     } >> "$TF"
                   fi
                   # Проверка: запись реально произошла (git видит изменение). Пусто
                   # — вердикт не лёг, падаем громко, а не «доставлено» вхолостую:
                   git -C .comms-mail status --porcelain | grep -q . \
                     || { echo "::error::в тред ничего не записалось"; exit 1; }
                   git -C .comms-mail add -A
                   git -C .comms-mail commit -m "docs(agent-comms): вердикт reviewer-pr по PR #<PR>"
                   git -C .comms-mail push origin HEAD:comms
               Push отклонён (параллельная запись) — освежи ПОЧТУ и повтори запись
               поверх свежего (для мигрированного new-message создаст файл заново;
               для legacy пересчитай NNN), push снова:
                   git -C .comms-mail fetch --no-tags origin comms
                   git -C .comms-mail reset --hard FETCH_HEAD
               Именно `FETCH_HEAD`: почта тянется БЕЗ рефспека, `origin/comms` в
               этом чекауте не создаётся, и `reset --hard origin/comms` упал бы
               «unknown revision». Чужие сообщения не теряем.

            5. ПОТОМ — тот же вердикт комментом в PR: `gh pr comment <PR> --body-file verdict.md`.

            Готово, когда ОБА адресата получили вердикт: тред и коммент в PR. Не
            удалось одно из двух — скажи об этом в том, что удалось: молча
            недоставленный вердикт хуже частичного.

            ТРЕТЬЯ доставка — формальный review-статус GitHub — НЕ твоя: её делает
            ШАГ джобы после тебя, из того же `verdict.md`. Сам `gh pr review` НЕ
            вызывай: два review за круг от одного автора — это два статуса на один
            вердикт, и читающий не знает, какой действующий. Твоё дело здесь одно и
            уже названо в пункте 3 — `verdict.md` лежит в КОРНЕ рабочей директории
            и начинается строкой `verdict: ...`; шаг читает ровно её.
          # Лимит ходов: по умолчанию 250 (метка/коммент его не задают); при
          # workflow_dispatch берётся из input `max_turns` — так проверяется
          # поведение на исчерпании бюджета (тред 014), не трогая обычные триггеры.
          # 100 хватало, пока ревью было чтением диффа; честный круг по критериям
          # REVIEWER.md — это ДВА полных прогона тестов на обеих границах (сотни
          # тестов, процессные файлы по 30–70с), typecheck, сверка бампов схемы и
          # grep'ы: на пакете размера v9 круг упёрся в 100 и умер без вердикта
          # (PR #29, тред 016). Тот же класс, что калибровка сессий 60→300 (#14).
          claude_args: |
            --max-turns ${{ github.event.inputs.max_turns || '250' }}
            --allowedTools "Read,Grep,Glob,Edit,Write,Bash,mcp__github_inline_comment__create_inline_comment"

      # САМОПРОПУСК ДЕЙСТВИЯ УСТАНАВЛИВАЕТСЯ ФАКТОМ, А НЕ ЧИТАЕТСЯ ГЛАЗАМИ В ЛОГЕ
      # (тред 046). `claude-code-action` пропускает себя, если файл ЭТОГО воркфлоу
      # в прогоне отличается от версии на дефолтной ветке (в логе — «Skipping
      # action due to workflow validation»), и это штатный гард, на котором стоит
      # норма правила №14. Но прогон при этом заканчивается КРАСНЫМ, потому что
      # `verdict.md` не создан, — а с появлением смотрителя `Notifier Watch` (тред
      # 040) красный уведомитель означает «доставка потеряна, чините» и поднимает
      # сессию `dev-core` письмом в тред 042. Первый же живой случай был ложной
      # тревогой: прогон 30643932101 по #106 (голова `2b0bf8e`), ветка отстала от
      # main на #126, правивший этот файл; контуру чинить нечего — лечит это
      # автор PR, подтянув main в ветку.
      #
      # Условие гарда воспроизводится здесь ОДНОЙ КОМАНДОЙ и на тех же данных:
      # файл в чекауте прогона (для `pull_request` это merge-ref события — ровно
      # то, из чего GitHub взял воркфлоу) против файла на дефолтной ветке СЕЙЧАС.
      # Для `issue_comment`/`workflow_dispatch` воркфлоу и так берётся с дефолтной
      # ветки, и сравнение даёт равенство — шаг там ничего не меняет.
      #
      # НО УСЛОВИЕ ГАРДА — ЕЩЁ НЕ ФАКТ САМОПРОПУСКА (находка 2 curator, тред 046).
      # Расхождение файла — это то, при чём гард СРАБАТЫВАЕТ, а не доказательство,
      # что он сработал: сойтись оно может и на прогоне, где действие отработало,
      # а вердикта нет по другой причине (дефект H2, обрыв по ходам, отказ
      # модели). Выдать такой прогон за самопропуск дорого в обе стороны — шаг
      # статуса ниже промолчит зелёным вместо `exit 1`, а сообщение об отсутствии
      # вердикта назовёт неверную причину и посоветует бесполезное лечение
      # («подтяни main»), тогда как ломается совсем другое.
      # Вторая половина факта — ОТРАБОТАЛО ЛИ ДЕЙСТВИЕ, и она уже лежит рядом:
      # непустой `execution_file` есть ровно тогда, когда действие дало выход
      # (на самопропуске оно не даёт и пути — на этом же построен `if` шага
      # артефакта в конце файла).
      - name: Самопропуск действия — установить факт
        id: guard
        if: ${{ !cancelled() }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXECUTION_FILE: ${{ steps.reviewer.outputs.execution_file }}
        run: |
          set -euo pipefail
          WF=.github/workflows/claude-review.yml
          # СЕТЬ ПОСЛЕ ДЕЙСТВИЯ ХОДИТ ПО URL С ТОКЕНОМ ДЖОБЫ, а не через конфиг
          # чекаута, и это не перестраховка: первая редакция шага (#133) звала
          # `git fetch origin` и падала `Authentication failed`, exit 128 — оба
          # живых прогона, 30647692648 (#134) и 30648959020 (#130). Причина та же,
          # что у шага доставки ниже: `claude-code-action` вписывает в
          # `remote.origin.url` свой app-токен и ОТЗЫВАЕТ его последним своим
          # шагом, а наши шаги стартуют после отзыва и наследуют мёртвый креденшл
          # в URL. Цена ошибки — обратная задуманной: шаг, который заводился, чтобы
          # ложных тревог у смотрителя не было, сам красил КАЖДЫЙ прогон ревью и
          # звонил в тред 042 при живом доставленном вердикте.
          # URL передаётся АРГУМЕНТОМ и в конфиг не садится (осевший креденшл и был
          # исходной болезнью); `git remote set-url` здесь намеренно не трогаем —
          # починка главного чекаута принадлежит шагу доставки, а этот шаг
          # диагностический и чужого состояния не меняет.
          REMOTE="https://x-access-token:${GH_TOKEN}@${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}"
          # Фетч БЕЗ `--depth`: чекаут джобы полный (`fetch-depth: 0`), а мелкий
          # фетч посадил бы на него `.git/shallow` — цена больше пользы. Версия
          # берётся свежая, а не `origin/<default>` из чекаута: гард действия
          # сверялся с дефолтной веткой на своём шаге, то есть уже после старта.
          BASE=""
          if git fetch --no-tags "$REMOTE" "$DEFAULT_BRANCH"; then
            BASE=FETCH_HEAD
          elif git rev-parse --verify -q "origin/${DEFAULT_BRANCH}^{commit}" >/dev/null; then
            echo "::warning::fetch '${DEFAULT_BRANCH}' не удался — сравниваю с 'origin/${DEFAULT_BRANCH}' из чекаута джобы (снимок на её старте)."
            BASE="origin/${DEFAULT_BRANCH}"
          fi
          # ЭТОТ ШАГ НЕ КРАСИТ ПРОГОН НИКОГДА, и это его конструкция, а не
          # снисходительность: он лишь УСТАНАВЛИВАЕТ ФАКТ для двух шагов после
          # себя. Не установили — говорим вслух и отдаём `self_skip=0`, то есть
          # поведение до #133: нет вердикта → красный статус → письмо смотрителю.
          # Диагностика, способная уронить прогон, который она описывает, — ровно
          # та болезнь, которую здесь лечат.
          if [ -z "$BASE" ]; then
            echo "::warning::версию '${WF}' на '${DEFAULT_BRANCH}' получить не удалось — факт самопропуска не установлен, считаем self_skip=0."
            echo "self_skip=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --quiet "$BASE" HEAD -- "$WF"; then
            echo "self_skip=0" >> "$GITHUB_OUTPUT"
            echo "Файл воркфлоу совпадает с '${DEFAULT_BRANCH}' — гард действия не срабатывал."
          elif [ -n "${EXECUTION_FILE:-}" ]; then
            # Половины разошлись: файл отличается, но действие ОТРАБОТАЛО. Значит
            # гард не срабатывал, что бы ни говорило сравнение, и списывать
            # отсутствие вердикта на самопропуск нельзя — молчим `self_skip=0`,
            # то есть отсутствие вердикта снова красное и по имени.
            echo "self_skip=0" >> "$GITHUB_OUTPUT"
            echo "::warning::'${WF}' отличается от версии на '${DEFAULT_BRANCH}', но действие ОТРАБОТАЛО (execution_file: '${EXECUTION_FILE}') — это НЕ самопропуск; если вердикта нет, причина другая (H2, обрыв по ходам, отказ модели)."
          else
            echo "self_skip=1" >> "$GITHUB_OUTPUT"
            echo "::warning::'${WF}' в прогоне отличается от версии на '${DEFAULT_BRANCH}', и действие не дало выхода (execution_file пуст) — оно пропустило само себя, ревью не состоялось (правило №14)."
          fi

      # ОТСУТСТВИЕ ВЕРДИКТА ДОСТАВЛЯЕТСЯ ТАК ЖЕ, КАК ВЕРДИКТ (решение john, тред
      # 029). Прогон ревьюера умеет закончиться `success`, не создав `verdict.md`:
      # 2026-07-28 это случилось трижды за сутки (PR #47/#55/#57; на #57 —
      # `"subtype": "success"`, `"num_turns": 30`, то есть модель СЧИТАЛА себя
      # закончившей, инструкцию не выполнив). Все три доставки вердикта висят на
      # одном файле, поэтому его отсутствие гасило разом все три.
      #
      # Цена молчания — не потерянный текст, а НЕОТЛИЧИМОСТЬ: со стороны почты
      # «ревью не состоялось» и «ревью ещё идёт» выглядят одинаково, и PR зависает,
      # пока кто-нибудь не откроет лог джобы глазами. Единственным сигналом была
      # красная джоба — а она к тому дню уже стала шумом: на двух открытых PR висел
      # красный `review` при живом вердикте в комментах.
      #
      # Сообщение НЕ вердикт и вердиктом не притворяется: это заявление об
      # отсутствии суждения, с id прогона и головой PR, чтобы читающий тред знал,
      # что именно перезапускать. Ретрая здесь намеренно НЕТ (решение john): автопов-
      # тор — удвоение расхода на каждый сбой, и платить за него решают по цифрам,
      # когда класс станет видимым и посчитается.
      #
      # Шаг ДЕТЕРМИНИРОВАННЫЙ (bash, без модели), по той же причине, что и шаг
      # статуса ниже: сообщать о том, что модель не справилась, поручая это модели,
      # значит строить тот же отказ вторым слоем.
      #
      # ДВЕ ПОЧИНКИ 2026-07-29 (тред 016). За сутки шаг сработал четыре раза —
      # 14:13Z #68, 15:59Z #64, 17:00Z #74, 17:04Z #64 — и НИ РАЗУ не доставил:
      # все четыре `Authentication failed`, exit 128. На двух последних (прогоны
      # 30472575530 и 30472571070) падение случилось через две секунды после старта
      # шага, то есть на ПЕРВОЙ сетевой команде git — на fetch почты, ещё до записи.
      #
      # (1) АУТЕНТИФИКАЦИЯ. Провал был ровно на границе «внутри действия / после
      # действия»: изнутри push в почту проходил всегда, из шага после действия — ни
      # разу. Причина найдена в логе прогона 30472575530: `claude-code-action`
      # ПЕРЕПИСЫВАЕТ `remote.origin.url`, вставляя в него свой app-токен
      # (`✓ Updated remote URL with authentication token`, 16:51:10Z), а последним
      # своим шагом этот токен ОТЗЫВАЕТ (`Revoke app token`, 17:00:04Z, `DELETE
      # /installation/token`). Наши шаги стартуют ПОСЛЕ отзыва и наследуют мёртвый
      # креденшл в URL — своего `GITHUB_TOKEN` у них в `env` объявлен, но до гита он
      # не доходит: git берёт userinfo из URL. `.comms-mail` — worktree этого же
      # чекаута и делит с ним `remote.origin.url`, поэтому ложился и fetch почты.
      # Починка — вернуть КАНОНИЧЕСКИЙ url: тогда снова действует `extraheader`,
      # который поставил `actions/checkout` из `GITHUB_TOKEN` джобы (живёт всю
      # джобу, отзыву app-токена не подвержен). Токен в URL не вписываем намеренно:
      # креденшл в конфиге переживает шаг, а заголовок чекаута — уже есть.
      # ДОПОЛНЕНО 2026-07-30 (тред 023, решение john): этой починки хватило ровно на
      # ГЛАВНЫЙ чекаут. Каталог почты шаг переиспользовал чужой — `.comms-mail`
      # создаёт агент изнутри действия, — и туда канонический url не дотягивается:
      # на ветке С ремонтом #87 фетч почты снова лёг с `could not read Username`
      # (прогон 30500443878). Поэтому шаг завёл СВОЙ каталог `.comms-fallback` и
      # ходит в сеть по URL с `GITHUB_TOKEN`, переданным аргументом команды, — в
      # конфиг он не садится (осевший креденшл и был исходной болезнью). Подробности
      # — комментарием на самом месте.
      #
      # (2) ПОРЯДОК ДОСТАВКИ ЗДЕСЬ ОБРАТНЫЙ норме 014: сначала КОММЕНТ В PR, потом
      # тред. Норма 014 («сначала тред») защищает от обрыва прогона и остаётся в
      # силе для вердикта, который пишет модель. Но у ЭТОГО шага отказ другой:
      # мёртвый канал. Ставить живой канал (`gh pr comment` через `GITHUB_TOKEN`) в
      # зависимость от мёртвого (push в `comms`) — значит терять сообщение целиком,
      # хотя рабочая доставка была в шаге от него; так и произошло четыре раза.
      # Страховка обязана жить на канале, который не может быть мёртв (требование
      # curator, тред 016). Поэтому же сообщение уходит в PR даже когда писать в
      # тред НЕКУДА (нет строки `thread:`) — раньше этот случай был молчанием.
      - name: Отсутствие вердикта — сообщением в PR и тред
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          SELF_SKIP: ${{ steps.guard.outputs.self_skip }}
        run: |
          set -euo pipefail
          # ВЕРДИКТ МОГ ЛЕЧЬ НЕ В КОРЕНЬ. Промпт требует корень рабочей директории,
          # и шаг статуса читает ровно его, но круг 14:13Z (#68) доставил вердикт
          # изнутри действия ПРИ ОТСУТСТВИИ файла в корне — значит модель умеет
          # написать его мимо (в `.code`, в `.comms-mail`, в подкаталог). Прежде это
          # читалось как «вердикта не было» и гасило третью доставку при живом
          # суждении. Найденный вне корня — берём и говорим ГДЕ (это же данные для
          # диагноза H2: почему `verdict.md` не создаётся вовсе).
          if [ ! -f verdict.md ]; then
            STRAY=$(find . -maxdepth 3 -name verdict.md -not -path './node_modules/*' -print -quit || true)
            if [ -n "${STRAY:-}" ]; then
              echo "::warning::verdict.md лежит не в корне, а в '${STRAY}' — копирую в корень (шаг статуса читает корень)."
              cp "$STRAY" verdict.md
            fi
          fi
          # Вердикт есть — доставлять нечего, дальше работает штатный шаг статуса.
          if [ -f verdict.md ]; then
            echo "verdict.md на месте — сообщать об отсутствии нечего."
            exit 0
          fi

          PR_BODY=$(gh pr view "$PR" --json body -q .body)
          HEAD_SHA=$(gh pr view "$PR" --json headRefOid -q .headRefOid)
          # Те же терпимые к оформлению regex'ы, что в merge-notify.yml: строки в
          # бэктиках уже один раз ослепили парсер (PR #16), и второй формат для
          # одного и того же поля здесь заводить нельзя.
          THREAD=$(printf '%s' "$PR_BODY" | grep -oiE '^[[:space:]`*]*thread`?:[[:space:]]*`?[0-9]{3}-[a-z0-9-]+' | head -1 | sed -E 's/^[^0-9]*//; s/[`*].*//') || true
          ROLE=$(printf '%s' "$PR_BODY" | grep -oiE '^[[:space:]`*]*role`?:[[:space:]]*`?[a-z][a-z0-9-]*' | head -1 | sed -E 's/^[^a-z]*role`?:[[:space:]]*`?//i') || true
          # Тело — ФАЙЛОМ ВНЕ чекаута почты: доставка делает reset --hard при
          # отклонённом push и снесла бы файл, лежащий внутри.
          BODY_TMP="$(mktemp)"
          {
            printf '**Ревью не состоялось: вердикт не сформирован.**\n\n'
            printf 'Прогон [`%s`](%s) по PR #%s (голова `%s`) завершился, не создав `verdict.md`, — поэтому не сработала ни одна из трёх доставок: ни сообщение в тред, ни коммент в PR, ни формальный review-статус.\n\n' \
              "$RUN_ID" "$RUN_URL" "$PR" "$HEAD_SHA"
            printf 'Это НЕ суждение о PR, а его отсутствие: молчание ревьюера здесь ничего не значит.\n\n'
            # ПРИЧИНА НАЗЫВАЕТСЯ, КОГДА ОНА ИЗВЕСТНА, И ЛЕКАРСТВО ВМЕСТЕ С НЕЙ
            # (тред 046). На самопропуске совет «перезапусти метку» ВРЕДЕН: на той
            # же голове гард сработает снова, и автор платит вторым кругом ни за
            # что. Лечится это только сдвигом ветки — merge main.
            if [ "${SELF_SKIP:-0}" = "1" ]; then
              printf 'Причина известна и это НЕ поломка: файл `.github/workflows/claude-review.yml` в этом прогоне отличается от версии на дефолтной ветке, и `claude-code-action` пропустил сам себя (гард против промпт-инъекции правкой воркфлоу, норма правила №14).\n\n'
              printf 'Перезапуск метки/коммента на ТОЙ ЖЕ голове ничего не изменит — гард сработает снова. Лечение одно: подтянуть `main` в ветку (`git merge origin/main`) и повесить метку `review` заново; если воркфлоу правит сам этот PR — ревью человеческое, автоматика включится со следующего PR после merge.\n'
            else
              printf 'Ревью перезапускается вручную — коммент `@claude` в PR либо снять и повесить метку `review` заново. Автоповтора нет намеренно (решение john, тред 029): сначала класс считается, потом решается, платить ли за вторую попытку.\n'
            fi
          } > "$BODY_TMP"

          # Роль сверяется С КОНФИГОМ И ЧЕРЕЗ ПАКЕТ (как в merge-notify): опечатка
          # иначе завалила бы `new-message` на двери, и сообщение об отсутствии
          # вердикта потерялось бы целиком. Лучше сказать без передачи хода, чем не
          # сказать: ход можно объявить руками, а несказанное никто не заметит.
          #
          # REF — ЯВНЫЙ `origin/main`, НЕ `HEAD`: `.code` это каталог, в который
          # по ходу ревью заходит САМА МОДЕЛЬ, и она вправе там чекаутиться.
          # На #127 ревьюер сделал `git checkout pr-127` (сравнивал прогон с
          # базой) — и `HEAD` перестал быть main'ом: конфиг прочитался ИЗ
          # ВЕТКИ, а код-валидатор остался тем, что на диске. Конфиг с полем,
          # которого схема того кода ещё не знает, невалиден целиком, `role
          # exists` вернул 2, и существующая роль `dev-core` была объявлена
          # несуществующей — ход не передан на ровном месте. `origin/main` —
          # тот же ref, которым ниже пишет `new-message`, и он не зависит от
          # того, что модель оставила в HEAD.
          WAIT_ARGS=""
          if [ -n "${ROLE:-}" ]; then
            if (cd .code && pnpm -F agent-protocol --silent cli role exists --repo . --ref origin/main --role "$ROLE" >/dev/null 2>&1); then
              WAIT_ARGS="--waiting-on ${ROLE}"
            else
              echo "::warning::В PR #${PR} указана роль '${ROLE}', которой нет в конфиге протокола — ход не передан."
              printf '\n⚠️ Ход не передан: в описании PR указана роль `%s`, которой нет в конфиге протокола — объявите ожидание вручную.\n' "$ROLE" >> "$BODY_TMP"
            fi
          else
            printf '\n⚠️ Ход не передан: в описании PR не было строки `role: <id>` — объявите ожидание вручную.\n' >> "$BODY_TMP"
          fi

          # ДОСТАВКА 1 — КОММЕНТ В PR. Живой канал идёт первым (см. шапку шага, п.2):
          # `gh` работает своим `GITHUB_TOKEN` и от чужого отозванного app-токена не
          # зависит вовсе. Отказ здесь валит шаг сразу — доставлять дальше нечем.
          gh pr comment "$PR" --body-file "$BODY_TMP"
          echo "Об отсутствии вердикта сообщено комментом в PR #${PR}."

          # ДОСТАВКА 2 — ТРЕД. Некуда писать — это САМО ПО СЕБЕ находка ревьюера
          # (критерий 3); в PR о ней уже сказано выше, здесь остаётся лог. Раньше
          # этот случай был молчанием целиком: единственный адрес был мёртв.
          if [ -z "${THREAD:-}" ]; then
            echo "::warning::В описании PR #${PR} нет строки 'thread: NNN-slug' — в тред сообщить некуда (коммент в PR доставлен)."
            exit 0
          fi

          # ПОЧИНКА АУТЕНТИФИКАЦИИ (шапка шага, п.1): вернуть КАНОНИЧЕСКИЙ url вместо
          # переписанного действием — оно вписало в него свой app-токен и отозвало
          # его перед нашим шагом; тогда снова действует `extraheader`, поставленный
          # `actions/checkout` из `GITHUB_TOKEN` джобы. Делается ДО первой сетевой
          # команды git: без этого падал уже fetch почты (exit 128 через две секунды
          # после старта шага, прогоны 30472575530 и 30472571070).
          git remote set-url origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"

          # ЧЕКАУТ ПОЧТЫ У ЭТОГО ШАГА — СВОЙ, и креденшл ему передаётся ЯВНО.
          # Прежде шаг переиспользовал `.comms-mail`, если тот уже существовал, — а
          # создаёт его САМ АГЕНТ, изнутри действия. Починка #87 (канонический url в
          # главном чекауте, чтобы заработал `extraheader` от `actions/checkout`) до
          # такого каталога не дотягивается: чей он worktree и какой конфиг делит —
          # решает чужой прогон, а не мы. Отсюда `could not read Username for
          # 'https://github.com'`, exit 128 — на ветке, которая ремонт #87 УЖЕ
          # СОДЕРЖИТ (прогон 30500443878, 23:54:45Z; воспроизведено дважды, тред 023).
          #
          # Поэтому: (1) свой каталог `.comms-fallback` — что в нём, знаем только мы;
          # (2) сеть ходит по URL с `GITHUB_TOKEN` джобы, а не через конфиг чекаута.
          # URL передаётся АРГУМЕНТОМ каждой команды и в конфиг не садится: именно
          # осевший креденшл (его вписало и отозвало действие) и был исходной
          # болезнью. Токен — секрет джобы, Actions маскирует его в логе.
          MAIL_REMOTE="https://x-access-token:${GH_TOKEN}@${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}"

          git fetch --no-tags "$MAIL_REMOTE" comms
          git worktree add .comms-fallback FETCH_HEAD
          if [ ! -d ".comms-fallback/agent-comms/${THREAD}/messages" ]; then
            echo "::warning::Тред '${THREAD}' не найден или ещё legacy — в тред не сообщено (коммент в PR доставлен)."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git -C .comms-fallback fetch --no-tags "$MAIL_REMOTE" comms
            git -C .comms-fallback reset --hard FETCH_HEAD
            if ! (cd .code && pnpm -F agent-protocol --silent cli new-message \
                  --root "${GITHUB_WORKSPACE}/.comms-fallback/agent-comms" --repo . --ref origin/main \
                  --thread "$THREAD" --from reviewer-pr --expects answer ${WAIT_ARGS} \
                  --worker gh-action \
                  --body-file "$BODY_TMP" --write --no-push); then
              echo "::error::new-message отказал — в тред ${THREAD} НЕ сообщено (коммент в PR доставлен)."
              exit 1
            fi
            git -C .comms-fallback add -A
            # --no-verify НЕ послабление стиля: worktree'ы делят `.git`, а с ним и
            # хуки, установленные `pnpm install` в главном чекауте. Коммит почты
            # звал бы pre-commit главного репозитория — `turbo typecheck` там, где
            # нет ни node_modules, ни кода: `Command "turbo" not found`, exit 1, и
            # страховка умирала ровно на своём последнем шаге (прогон 30521214435,
            # 06:57:59Z — коммент в PR доставлен, тред снова не узнал ничего).
            # Проверять тут нечего: в дереве только файлы почты, а имя коммита
            # фиксировано строкой ниже и conventional по построению.
            git -C .comms-fallback commit --no-verify -m "chore(comms): ревью PR #${PR} не состоялось — вердикт не сформирован"
            if git -C .comms-fallback push "$MAIL_REMOTE" HEAD:comms; then
              echo "Об отсутствии вердикта сообщено в тред ${THREAD}."
              exit 0
            fi
            echo "Push отклонён (попытка ${attempt}) — в comms писали параллельно, пересобираю."
          done
          echo "::error::Не удалось сообщить в тред ${THREAD} за 5 попыток (коммент в PR доставлен)."
          exit 1

      # ТРЕТЬЯ ДОСТАВКА одного вердикта — формальный review-статус GitHub (тред
      # 016, решение john). Повод: галка джобы и содержимое вердикта — разные
      # вещи, и человеческий глаз дважды за день прочитал зелёную джобу как «всё
      # ок» при `needs-fixes` внутри. Статус — не четвёртый текст, а ЯРЛЫК на тот
      # же: он выводится из первой строки `verdict.md`, того самого файла, которым
      # ушли первые две копии (в тред и комментом), — поэтому три доставки не
      # могут разойтись по смыслу.
      #
      # Шаг ДЕТЕРМИНИРОВАННЫЙ, а не пункт промпта: перевод «слово → статус»
      # суждения не требует, а поручение его модели добавляло бы способ выставить
      # статус, не совпадающий с текстом, — ровно ту болезнь, которую лечим.
      #
      # ПОВТОРНЫЙ КРУГ отдельного кода не требует: оба review приходят от одного
      # автора (`GITHUB_TOKEN` = github-actions[bot]), а approve поверх своего же
      # request-changes снимает его штатной механикой GitHub.
      #
      # REQUEST_CHANGES НЕ запирает merge насмерть (требование 4 постановки):
      # в защите main `required_approving_review_count: 0` и `enforce_admins:
      # false` — merge остаётся у john, а снять вердикт, снятый в треде
      # подтверждением curator (прецеденты #10, #14, #20), можно как кнопкой
      # dismiss, так и вторым кругом `@claude` — он перепишет статус сам. Ничего
      # для этого не строим: обе дороги уже есть.
      - name: Вердикт формальным review-статусом
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
          SELF_SKIP: ${{ steps.guard.outputs.self_skip }}
        run: |
          set -euo pipefail
          # Нет файла — вердикта НЕ БЫЛО: прогон не дошёл до него или действие
          # пропустило само себя (гард claude-code-action на PR, правящем этот
          # файл). Красный статус здесь честнее зелёного: запрошенное человеком
          # ревью не состоялось, и это должно быть видно, а не выглядеть успехом.
          # Написанный мимо корня здесь уже учтён: предыдущий шаг ищет его и
          # копирует в корень, поэтому «нет файла» на этой строке значит «нигде».
          #
          # РОВНО ОДИН КЛАСС ИСКЛЮЧЁН — САМОПРОПУСК (тред 046). Он не поломка, а
          # сработавший гард, и адресат о нём уже извещён предыдущим шагом
          # (коммент в PR + сообщение в тред, с причиной и лечением). Красный
          # здесь стоил бы сессии: со времени треда 040 за уведомителями следит
          # `Notifier Watch`, и красный прогон `Claude PR Review` он читает как
          # «доставка потеряна» — письмо в тред 042 и поднятая пара `dev-core`,
          # которой чинить нечего (первый живой случай — прогон 30643932101 по
          # #106, ветка отстала от main). Все остальные пути «вердикта нет»
          # (дефект H2, обрыв по ходам, отказ модели) остаются красными.
          if [ ! -f verdict.md ] && [ "${SELF_SKIP:-0}" = "1" ]; then
            echo "::warning::verdict.md нет, потому что действие пропустило само себя (воркфлоу ветки ≠ дефолтная) — ревью не состоялось, статус не выставлен, ложной тревоги смотрителю не поднимаем"
            exit 0
          fi
          if [ ! -f verdict.md ]; then
            echo "::error::verdict.md нет — вердикт не сформирован, формальный статус не выставлен"
            exit 1
          fi
          line=$(head -n1 verdict.md | tr -d '\r')
          case "$line" in
            'verdict: approve') event=--approve ;;
            'verdict: needs-fixes') event=--request-changes ;;
            *)
              echo "::error::первая строка verdict.md не вердикт: '$line' (ожидалось 'verdict: approve' либо 'verdict: needs-fixes')"
              exit 1
              ;;
          esac
          # ЯКОРЬ `pr:` — телеметрия (счёт кругов ревью, тред 029), и права мешать
          # доставке у неё нет: нет якоря — предупреждение в лог, статус выставляется
          # как обычно, круг просто не посчитается. Телеметрия, способная съесть
          # доставку вердикта, хуже отсутствия телеметрии (условие приёмки curator).
          if ! sed -n '2p' verdict.md | tr -d '\r' | grep -qE "^pr: #?${PR}$"; then
            echo "::warning::вторая строка verdict.md не якорь 'pr: ${PR}' — круг ревью по этому PR не посчитается (тред 029)"
          fi
          # Тело review КОРОТКОЕ и со ссылкой: полный текст уже висит комментом в
          # этом же PR, и вторая его копия на одной странице читалась бы как
          # второй вердикт.
          gh pr review "$PR" "$event" --body "$line — полный текст комментом в этом PR и сообщением в треде постановки (доставка 3 из 3, .github/workflows/claude-review.yml)."

      # ТРАНСКРИПТ СЕССИИ РЕВЬЮЕРА — АРТЕФАКТОМ (тред 016, 2026-07-29). Прогон
      # ревьюера сейчас НЕ ОСТАВЛЯЕТ О СЕБЕ НИЧЕГО: в логе джобы девять минут работы
      # представлены только эхом промпта, ни одного tool-call, и артефактов у
      # прогонов ноль. Поэтому дефект H2 — «действие завершилось `success`, не создав
      # `verdict.md`» — сегодня недиагностируем ПО ПОСТРОЕНИЮ: видно, что суждения
      # нет, и не видно, на чём оно потерялось. Каждый слепой круг стоит ~$2.4, а
      # класс уже четвёрка за сутки.
      #
      # Шаг ПОСЛЕДНИЙ и `continue-on-error` — телеметрия не имеет права мешать
      # доставке (то же условие, что у якоря `pr:` в шаге статуса): её отказ не
      # должен ни валить джобу, ни задерживать вердикт. `if-no-files-found: warn` —
      # на случай, когда действие пропустило само себя и выхода не дало вовсе.
      #
      # ПУСТОЙ `execution_file` — НЕ ЗАПУСКАЕМ ВОВСЕ (тред 046): `warn` покрывает
      # «путь есть, файла по нему нет», а на самопропуске действие не даёт и пути,
      # и `upload-artifact` падает `Input required and not supplied: path` —
      # красной аннотацией в прогоне, за которым теперь следит смотритель. Ошибка
      # телеметрии, читающаяся как отказ доставки, — тот же класс, что лечит
      # шаг статуса выше.
      - name: Транскрипт ревьюера — артефактом (для диагноза H2)
        if: ${{ !cancelled() && steps.reviewer.outputs.execution_file != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@v5
        with:
          name: reviewer-execution-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}-${{ github.run_id }}
          path: ${{ steps.reviewer.outputs.execution_file }}
          if-no-files-found: warn
          retention-days: 14
