name: Claude PR Review

# Ревьюер роли reviewer-pr (agent-comms/ROLES.md, ветка comms).
# Триггеры намеренно РУЧНЫЕ — не на каждый synchronize: расход квоты под контролем.
#   • метка `review` на PR
#   • коммент `@claude` в PR
#   • workflow_dispatch с номером PR
on:
  pull_request:
    types: [labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: Номер PR для ревью
        required: true
        type: string

# Один прогон на PR НА КАЖДЫЙ ТИП ТРИГГЕРА: перевесил метку — предыдущий
# прогон по метке гасится, квота не жжётся дважды.
#
# github.event_name в группе — не украшение. Без него все триггеры делили одну
# группу, а concurrency вычисляется ДО job-level `if`: коммент, отсеиваемый
# условием ниже, всё равно успевал отменить идущий прогон по метке. На этом
# ревьюер убил сам себя — опубликовал вердикт в PR, и его же коммент погасил
# прогон до записи дубля в тред (run 29883515576, статус cancelled).
concurrency:
  group: claude-review-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  review:
    # Комменты ботов игнорируем: ревьюер не должен реагировать ни на себя, ни на
    # другую автоматику — второй слой защиты от того же самозацикливания.
    if: |
      (github.event_name == 'pull_request' && github.event.label.name == 'review') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null && github.event.comment.user.type != 'Bot' && contains(github.event.comment.body, '@claude')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write # запись вердикта в ветку comms
      pull-requests: write # review-коммент в PR
      issues: write # триггер issue_comment
      id-token: write
      actions: read
    steps:
      # Полная история: ревьюеру нужен merge-base с main для честного диффа,
      # а ветка comms дотягивается отдельным fetch из промпта.
      # Bash разрешён целиком (claude_args ниже): гранулярный allowlist из
      # префиксов не переживает ни составные команды, ни подстановки — первый
      # прогон дал 24 отказа прав и ноль публикаций при успешном статусе джобы.
      # Раннер одноразовый, а метку `review` вешает человек с правами на репо.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Зависимости репозитория — чтобы ревьюер мог ПРОГНАТЬ проверки, а не
      # рассуждать о диффе (тред 007). Раньше этих трёх шагов не было вовсе:
      # без `pnpm install` в чекауте нет node_modules, а `turbo` — devDependency,
      # то есть его бинарника не существует независимо от версии Node. Ревьюер
      # объяснял отказ «несовпадением версии Node/pnpm» — это было следствие,
      # причина же в отсутствии установки как таковой.
      #
      # Шаги намеренно те же и в том же порядке, что в ci.yml: расхождение
      # окружений ревьюера и CI и есть та дыра, которую мы закрываем, — иначе
      # «у меня зелено» снова начнёт значить разное в двух джобах.
      # (setup-node с `cache: pnpm` требует, чтобы pnpm был поднят раньше.)
      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}

            Ты — роль `reviewer-pr` протокола agent-comms. Код ты НЕ меняешь и PR не мёрджишь.

            1. Протокол-файлы лежат в ветке `comms`, в этом чекауте их нет. Подтяни и читай так:
                   git fetch --no-tags --depth=1 origin comms
                   git show FETCH_HEAD:agent-comms/ROLES.md
                   git show FETCH_HEAD:agent-comms/INDEX.md
               Свою карточку роли прочитай в ROLES.md.

            2. Прочитай `REVIEWER.md` в корне репо — это единственный список критериев.
               Отревьюй PR строго по нему: дифф (`gh pr diff`), описание и обсуждение
               (`gh pr view --comments`) плюс ЛЮБЫЕ файлы базы, нужные для контекста —
               ревью по одному диффу критериями 2, 3 и 9 не делается.

               Зависимости репозитория УЖЕ УСТАНОВЛЕНЫ (шаг `pnpm install` выше),
               окружение то же, что в CI-джобе `checks`. Поэтому проверки
               ПРОГОНЯЙ, а не оценивай по диффу: `pnpm turbo typecheck`,
               `pnpm turbo test`, `pnpm exec biome check <файлы>`. Если прогон
               всё-таки не удался — напиши в вердикте ФАКТИЧЕСКУЮ ошибку
               (команда и её вывод), а не «среда не позволила»: расплывчатая
               оговорка скрывает и поломку окружения, и непроверенный код.

            3. Постановка пакета — тред, указанный в описании PR строкой `thread: NNN-slug`.
               Прочитай его целиком: `git show FETCH_HEAD:agent-comms/<NNN-slug>/_thread.md`
               И ОСТАЛЬНЫЕ ФАЙЛЫ ПАПКИ РАЗГОВОРА — крупные постановки лежат
               отдельными документами рядом с тредом, а не внутри него, и
               судить о скоупе по одному `_thread.md` значит не видеть половины
               задания. Список файлов: `git ls-tree --name-only FETCH_HEAD
               agent-comms/<NNN-slug>/`.
               Если строки `thread:` в описании нет — это само по себе находка (критерий 3):
               скажи об этом в вердикте и ревьюй по остальным критериям.

            4. Вердикт публикуй review-коммент в PR: `gh pr comment <PR> --body ...`,
               формат — раздел «Формат вердикта» в REVIEWER.md (первая строка
               `verdict: approve` либо `verdict: needs-fixes`).

            5. Дублем — сообщение в тред пакета, ветка `comms`. Это append-only протокол,
               force-push запрещён, чужие сообщения не теряются. Чекаут почты делай
               ВНУТРИ рабочей директории (`.comms-mail`), а НЕ в /tmp: файловые
               инструменты работают только в пределах рабочей директории, и worktree
               в /tmp читать и править нечем.
                   git fetch --no-tags origin comms
                   git worktree add .comms-mail FETCH_HEAD
                   # дописать в КОНЕЦ .comms-mail/agent-comms/<NNN-slug>/_thread.md секцию
                   #   ## msg-NNN · from: reviewer-pr · <сегодня> · expects: answer
                   # (NNN = следующий по порядку номер в этом треде)
                   # и обновить строку треда в .comms-mail/agent-comms/INDEX.md:
                   #   waiting-on → автор PR, updated → сегодня
                   git -C .comms-mail add -A
                   git -C .comms-mail commit -m "docs(agent-comms): вердикт reviewer-pr по PR #<PR>"
                   git -C .comms-mail push origin HEAD:comms
               Push отклонён (кто-то писал параллельно) — заново fetch, пересними свои
               правки поверх свежего origin/comms, пересчитай номер сообщения, push повторно.

            Обработка завершена только когда ОБА адресата получили вердикт: коммент в PR и
            сообщение в треде с обновлённым INDEX. Если что-то из двух не удалось —
            скажи об этом в том, что удалось: молча недоставленный вердикт хуже частичного.
          claude_args: |
            --max-turns 60
            --allowedTools "Read,Grep,Glob,Edit,Write,Bash,mcp__github_inline_comment__create_inline_comment"
