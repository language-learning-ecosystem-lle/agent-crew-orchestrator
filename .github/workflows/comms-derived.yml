name: Comms Derived

# ⚠️ КАНОНИЧЕСКИЙ ИСТОЧНИК, НО ИСПОЛНЯЕТСЯ ИЗ ВЕТКИ `comms`, НЕ ОТСЮДА.
# Для события `push` GitHub Actions берёт workflow из версии файла В ВЕТКЕ,
# КУДА ПУШАТ (comms), а не из дефолтной. (Это отличает push от pull_request/
# issue_comment, которые исполняются из дефолтной ветки — потому merge-notify и
# claude-review живут в main и работают.) Правка ЗДЕСЬ не вступает в силу, пока
# идентичная копия не положена в ветку `comms`. Синхронность копии с этим
# каноном стережёт шаг «comms-derived синхронен с каноном» джобы `checks` в
# `.github/workflows/checks.yml` — расхождение красит PR, ТРОГАЮЩИЙ этот файл,
# и push в main. До 2026-08-18 здесь стояло имя `ci.yml`: файл объявлял гард,
# которого в этом репозитории не было вовсе (формулировка приехала копией из
# репозитория-родителя LLE) — тред 007. Первая версия лежала только в main и не
# запустилась ни разу (тред 012, msg-047).

# Собирает производные почты (`_thread.md` мигрированных тредов + `INDEX.md`) из
# источника (`messages/*` + `_meta.md`) на каждый push в ветку `comms`. Это
# заменяет ручной прогон `rebuild-index.sh` ролями: реестр перестаёт быть
# писателем-руками (класс «двух писателей» из треда 006) и становится
# производным одного автоматического генератора.
#
# МЯГКИЙ ПЕРЕХОД (решение curator, тред 012 msg-035): генератор ИДЕМПОТЕНТЕН —
# коммитит только при расхождении. Пока роль ещё прогоняет `rebuild-index` сама,
# её коммит уже содержит актуальный INDEX, генератор видит совпадение и молчит.
# Двух писателей нет ни в один момент; момент, когда роли перестают прогонять
# rebuild вручную, объявляется явно и от этого workflow не зависит.
# РАЗМОРОЖЕН 2026-08-18 (решение john, тред 082-hetzner-migration). Довод заморозки
# («воркфлоу читают почту и роли ОБСЛУЖИВАЕМОГО проекта, которых в этом репозитории
# нет») перестал быть правдой merge'ем #3, а не устарел постепенно: с него у этого
# репозитория есть СВОЯ почта в ветке `comms`, свой `agent-protocol.json` с ролями и
# свой резидентный демон на ящике — он обслуживает сам себя, и это его собственные
# производные и его собственные события merge, а не чужие.
# Заморожен остаётся один `claude-review.yml`: он тратит `CLAUDE_CODE_OAUTH_TOKEN`,
# и его разморозка — отдельное решение john о расходе. Пока он спит, merge здесь —
# кнопка john: гарду 1 (approve на текущей голове) закрываться нечем.

on:
  push:
    branches: [comms]
    # ПУЛЬС МАШИНЫ НЕ ЗАПУСКАЕТ ГЕНЕРАТОР (постановка john, тред 019 → 049, замер
    # в репозитории LLE: 63% прогонов и 65% минут этого воркфлоу были ровно им).
    # `_instances/<box>.json` — дайджест состояния ящика (R13): оркестратор
    # переписывает свой файл несколько раз за цикл каждой сессии, а производные
    # (`INDEX.md`, `_thread.md`) от него не зависят ни одним байтом — каталог
    # лежит вне `THREAD_DIR` (`^\d{3}-`) и обходчику тредов не виден.
    # Фильтр путями, а не по автору: дайджест пишет демон учёткой ОПЕРАТОРА, той
    # же, которой роли пушат почту — автор эти два класса не различает.
    # `paths-ignore` срабатывает, только когда ВСЕ файлы push'а под фильтром.
    paths-ignore:
      - "agent-comms/_instances/**"
  workflow_dispatch:
# Без cancel: два push подряд обязаны обработаться ОБА по очереди. Отмена
# идущего генератора вторым push потеряла бы производные первого.
concurrency:
  group: comms-derived
  cancel-in-progress: false

jobs:
  derive:
    # Гард от петли: собственный коммит генератора («chore(comms): rebuild
    # derived») сам себя не триггерит. Коммит ниже (единственное место коммита в
    # этом файле) однострочен, поэтому его СООБЩЕНИЕ НАЧИНАЕТСЯ с этого
    # заголовка — и `startsWith` ловит его целиком.
    #
    # ПЕТЛЮ ЗДЕСЬ ДЕРЖИТ НЕ ЭТО УСЛОВИЕ, А СЛОЙ ПОД НИМ, и это измерено (тред 007,
    # 2026-08-18): push, сделанный дефолтным `GITHUB_TOKEN`, не порождает прогона
    # ВООБЩЕ — встроенная защита GitHub от самотриггера. Запрос
    # `actions/runs?head_sha=<коммит генератора>` даёт `total_count: 0` и на
    # `a9d0a2a` (старое выражение), и на `3d399b9` (новое); тот же запрос на
    # соседнем коммите роли `4ed97da` даёт 1. То есть прежний комментарий («без
    # этого условия он триггерил бы себя без конца») описывал механизм, которого в
    # этой конфигурации нет, — и записан здесь именно как исправление.
    # Условие остаётся ВТОРЫМ ПОЯСОМ и становится несущим ровно в тот день, когда
    # генератор начнёт пушить не токеном джобы (PAT, deploy key, GitHub App):
    # такой push прогоны порождает, и снимать пояс перед этим днём — менять
    # немую дверь на бесконечную петлю.
    #
    # РЕШЕНИЕ ПРИНИМАЕТСЯ ПО ЗАГОЛОВКУ, А НЕ ПО ТЕЛУ (тред 007). Здесь стоял
    # `contains(github.event.head_commit.message, 'rebuild derived')`, а
    # `head_commit.message` — это заголовок ВМЕСТЕ с телом: любой коммит, чьё тело
    # ОБЪЯСНЯЕТ работу генератора, глушил генератор на своём push, и выглядело это
    # зелёным `skipped`. Замер на одной голове `f2b5ec7`: прогон 32164383850
    # (`push`, слова в теле) — `skipped`, прогон 32164435358 (`workflow_dispatch`,
    # та же голова) — `success`. Дефект тем вероятнее, чем ближе работа к самому
    # механизму, то есть срабатывал ровно в тредах про производные.
    if: "!startsWith(github.event.head_commit.message, 'chore(comms): rebuild derived')"
    # Пул ящика (этап 2, тред 049; решение john «переносится ВСЁ, включая
    # уведомители»). Последний из переносимых без решения и без рук: у
    # `claude-review` открыта развилка про радиус поражения, `e2e` упирается в
    # состояние ящика (Xvfb, бандлед Chromium).
    #
    # ЦЕНА ЗДЕСЬ — НЕ МИНУТЫ, А ЧИСЛО ПРОГОНОВ, и это единственный кандидат, у
    # которого так. После #175 — ≈93 мин на 36,5 ч, но это всё ещё самый ЧАСТЫЙ
    # воркфлоу репозитория: прогон на каждый push роли в `comms`. На пуле три
    # воркера, и в пиковый час их занимает `checks` (медиана 9 мин), поэтому
    # переезд меняет облачные минуты на очередь ящика ровно там, где очередь и
    # дорога. Мерится пунктом 5 постановки (задержка старта `checks` в пиковый
    # час до и после), откатывается одной строкой `runs-on`.
    #
    # ЧЕГО ЗДЕСЬ НЕТ, вопреки тому, что я же и написал раньше: «параллельные
    # писатели в одну ветку на одном ящике». Чекауты у джоб разные, общего
    # git-каталога нет, а конкуренция за `comms` — УДАЛЁННАЯ (отклонённый
    # non-fast-forward push), и её величина от места исполнения не зависит.
    # Число писателей переездом не растёт; ретрай ниже (его потолок объявлен
    # дверью, `COMMS_PUSH_ATTEMPTS`) остаётся страховкой ровно от того же, от
    # чего был.
    #
    # ЗАДЕРЖКА ЗДЕСЬ НЕ СТОИТ ХОДА (в отличие от `merge-notify`): производные —
    # `INDEX.md`, `TASKS.md`, `_thread.md` — читаются людьми, а вход роли
    # считается ИЗ ТРЕДОВ, не из реестра (боль 5, тред 008). Опоздавший
    # генератор задерживает картину, а не передачу хода.
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: write # запись производных в ветку comms
    steps:
      # Ветка comms (почта) — в корень workspace.
      - uses: actions/checkout@v5
        with:
          ref: comms
          fetch-depth: 0

      # Код (пакет + конфиг протокола) живёт в main, НЕ в comms: генератор
      # обязан исполнять протокол актуальной версией, а не той старой копией
      # дерева, что лежит в ветке почты.
      - uses: actions/checkout@v5
        with:
          ref: main
          path: .code
      # `dest` ОБЯЗАТЕЛЕН вместе с переездом на пул — полное обоснование в
      # ci.yml: по умолчанию pnpm ставится в `~/setup-pnpm`, общий `$HOME` трёх
      # воркеров ящика, и джоба выдёргивает бинарь И СТОР из-под соседа, который
      # уже работает. Класс измерен и дважды валил прогоны (тред 049, #153).
      # Здесь соседом будет живой `checks`, а этот генератор — самый частый
      # прогон репозитория, то есть окно столкновения открывалось бы чаще всего
      # именно отсюда. `cache: pnpm` у setup-node ниже — actions/cache, который
      # РАСПАКОВЫВАЕТ архив поверх стора: без `dest` он распаковывал бы его в
      # общий каталог, то есть чинить надо обе строки, а не одну.
      - uses: pnpm/action-setup@v5
        with:
          dest: ${{ runner.tool_cache }}/setup-pnpm
      - uses: actions/setup-node@v5
        with:
          node-version-file: .code/.nvmrc
          cache: pnpm
          cache-dependency-path: .code/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: .code

      - name: Пересобрать производные и запушить при расхождении
        env:
          MAIL: ${{ github.workspace }}/agent-comms
          CODE: ${{ github.workspace }}/.code
        run: |
          set -euo pipefail

          # `derive --write` пересобирает _thread.md мигрированных + INDEX.
          # Конфиг протокола читается из main через git в .code (репо кода).
          run_derive() {
            (cd "$CODE" && pnpm -F agent-protocol --silent cli derive \
              --root "$MAIL" --repo "$CODE" --ref origin/main --write)
          }
          run_derive

          # Идемпотентность: расхождения нет — писать нечего, выходим тихо.
          #
          # ПРОВЕРКА ОБЯЗАНА ВИДЕТЬ НЕОТСЛЕЖИВАЕМОЕ (тред 005). Здесь стоял
          # `git diff --quiet`, который сравнивает индекс с рабочим деревом и
          # новых файлов не видит ВОВСЕ. На почте, где производных ещё нет,
          # `derive --write` создаёт `INDEX.md`, `TASKS.md` и `_thread.md`
          # ВПЕРВЫЕ — они неотслеживаемые, дифф пуст, ранний выход срабатывает,
          # джоба зеленеет и не производит ничего. Замерено в этом репозитории:
          # пять `success` подряд (10:41…11:53Z 2026-08-18) при полном отсутствии
          # `INDEX.md` в ветке; воспроизведено на клоне — 8 файлов собрано,
          # `git diff --quiet` молчит, `git status --porcelain` называет все восемь.
          # В LLE дефект спал, потому что там эти файлы уже отслеживаются —
          # то есть просыпается он ровно на пустой почте нового репозитория.
          #
          # `--porcelain` со скобкой `-- agent-comms` — не украшение: рядом в
          # workspace лежит неотслеживаемый чекаут `.code`, и без pathspec он
          # один делал бы проверку вечно «грязной».
          #
          # Прежний комментарий объяснял это место «мягким переходом» — мол,
          # пока роль сама прогоняет rebuild, здесь всегда пусто. Само решение о
          # мягком переходе в силе (шапка файла), но МОЛЧАЛ генератор не поэтому,
          # и объяснение, оправдывающее дефект, хуже отсутствующего.
          if [ -z "$(git status --porcelain -- agent-comms)" ]; then
            echo "производные уже актуальны — коммитить нечего."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Дверь push'а — общая на всех писателей контура (тред 042): она же
          # объявляет потолок попыток, она же различает гонку и отказ сервера и
          # выжидает паузу там, где ждать и есть лекарство. Пятый писатель
          # переводится на неё ПОСЛЕДНИМ и отдельно от четверых: он исполняется
          # из ветки `comms`, поэтому его копия там обязана совпадать с этим
          # каноном байт-в-байт, а копия подключает дверь `source`'ом из
          # чекаута main — до её merge'а файла там не было вовсе.
          #
          # Пересборка производных ПОВЕРХ свежего origin/comms остаётся ровно
          # там, где была, и лечит ровно гонку: источник (messages/) чужой роли
          # уже в ветке, переносить старые производные нельзя. Отказу сервера
          # она безразлична — на неподвижной голове это no-op, дающий тот же
          # дифф, и цену повтора платит пауза внутри двери, а не этот цикл.
          source "${GITHUB_WORKSPACE}/.code/.github/scripts/comms-push.sh"
          for attempt in $(seq 1 "$COMMS_PUSH_ATTEMPTS"); do
            git add agent-comms
            git commit -m "chore(comms): rebuild derived"
            if comms_push "$attempt"; then
              echo "производные пересобраны и запушены (попытка ${attempt})."
              exit 0
            fi
            git reset --soft HEAD~1
            git fetch --no-tags origin comms
            git reset --hard origin/comms
            run_derive
            # Тот же вопрос, что и у раннего выхода, — и тот же ответ: после
            # `reset --hard origin/comms` собранные файлы снова не отслеживаются
            # (в голове ветки их нет), так что `git diff` и здесь звал бы «чисто»
            # на непустой работе. Выход тише раннего, цена та же (тред 005, п.2).
            [ -z "$(git status --porcelain -- agent-comms)" ] && { echo "после чужого push расхождений нет."; exit 0; }
          done

          # Провал ОБЯЗАН быть заметным (требование заметности из 014): молча
          # разошедшиеся производные — тот же класс, что потерянный дубль
          # вердикта. Красный job виден без ручной сверки.
          echo "::error::не удалось запушить производные за ${COMMS_PUSH_ATTEMPTS} попыток."
          exit 1

