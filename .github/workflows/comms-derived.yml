name: Comms Derived

# ⚠️ КАНОНИЧЕСКИЙ ИСТОЧНИК, НО ИСПОЛНЯЕТСЯ ИЗ ВЕТКИ `comms`, НЕ ОТСЮДА.
# Для события `push` GitHub Actions берёт workflow из версии файла В ВЕТКЕ,
# КУДА ПУШАТ (comms), а не из дефолтной. (Это отличает push от pull_request/
# issue_comment, которые исполняются из дефолтной ветки — потому merge-notify и
# claude-review живут в main и работают.) Правка ЗДЕСЬ не вступает в силу, пока
# идентичная копия не положена в ветку `comms`. Синхронность копии с этим
# каноном стережёт шаг «comms-derived синхронен с каноном» в ci.yml — расхождение
# красит CI на main. Первая версия лежала только в main и не запустилась ни разу
# (тред 012, msg-047).

# Собирает производные почты (`_thread.md` мигрированных тредов + `INDEX.md`) из
# источника (`messages/*` + `_meta.md`) на каждый push в ветку `comms`. Это
# заменяет ручной прогон `rebuild-index.sh` ролями: реестр перестаёт быть
# писателем-руками (класс «двух писателей» из треда 006) и становится
# производным одного автоматического генератора.
#
# МЯГКИЙ ПЕРЕХОД (решение curator, тред 012 msg-035): генератор ИДЕМПОТЕНТЕН —
# коммитит только при расхождении. Пока роль ещё прогоняет `rebuild-index` сама,
# её коммит уже содержит актуальный INDEX, генератор видит совпадение и молчит.
# Двух писателей нет ни в один момент; момент, когда роли перестают прогонять
# rebuild вручную, объявляется явно и от этого workflow не зависит.
on:
  push:
    branches: [comms]
    # ПУЛЬС МАШИНЫ НЕ ЗАПУСКАЕТ ГЕНЕРАТОР (постановка john, тред 019 → 049).
    # `_instances/<box>.json` — дайджест состояния ящика (R13): оркестратор
    # переписывает свой файл на каждую смену состояния, то есть несколько раз за
    # цикл каждой сессии. Производные (`INDEX.md`, `TASKS.md`, `_thread.md`)
    # от него не зависят НИ ОДНИМ байтом — каталог `_instances/` лежит вне
    # `THREAD_DIR` (`^\d{3}-`), и обходчик тредов его не видит по построению
    # (`src/orchestrator/instances.ts`). Каждый такой push поднимал полный
    # прогон: два чекаута + `pnpm install` + генератор — и молча пересобирал
    # то, что не менялось.
    #
    # ЦЕНА ИЗМЕРЕНА, А НЕ ОЦЕНЕНА (окно 2026-08-01T17:03Z → 2026-08-03T05:35Z,
    # 36,5 ч, 1000 прогонов репозитория): у `Comms Derived` 335 прогонов и
    # 264 мин, из них **211 прогонов и 171 мин — ровно этот пульс** (63% по
    # числу, 65% по минутам). Плюс каждый из них поднимал `Notifier Watch`
    # (`workflow_run: completed`), который на них пропускается по `if`, но
    # прогоном числится. Это самая дорогая строка машинного шума в репозитории.
    #
    # ПОЧЕМУ ПУТЯМИ, А НЕ ПО АВТОРУ. Условие по автору здесь не работает: дайджест
    # пишет демон учёткой ОПЕРАТОРА — той же, которой роли пушат почту. Автор эти
    # два класса не различает, путь различает точно.
    #
    # `paths-ignore` срабатывает, только когда ВСЕ файлы push'а под фильтром:
    # push, где рядом с дайджестом лежит сообщение, прогон поднимет как раньше.
    paths-ignore:
      - "agent-comms/_instances/**"

# Без cancel: два push подряд обязаны обработаться ОБА по очереди. Отмена
# идущего генератора вторым push потеряла бы производные первого.
concurrency:
  group: comms-derived
  cancel-in-progress: false

jobs:
  derive:
    # Гард от петли: собственный коммит генератора («rebuild derived») сам
    # порождает push в comms — без этого условия он триггерил бы себя без конца.
    if: "!contains(github.event.head_commit.message, 'rebuild derived')"
    runs-on: ubuntu-latest
    permissions:
      contents: write # запись производных в ветку comms
    steps:
      # Ветка comms (почта) — в корень workspace.
      - uses: actions/checkout@v5
        with:
          ref: comms
          fetch-depth: 0

      # Код (пакет + конфиг протокола) живёт в main, НЕ в comms: генератор
      # обязан исполнять протокол актуальной версией, а не той старой копией
      # дерева, что лежит в ветке почты.
      - uses: actions/checkout@v5
        with:
          ref: main
          path: .code
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .code/.nvmrc
          cache: pnpm
          cache-dependency-path: .code/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: .code

      - name: Пересобрать производные и запушить при расхождении
        env:
          MAIL: ${{ github.workspace }}/agent-comms
          CODE: ${{ github.workspace }}/.code
        run: |
          set -euo pipefail

          # `derive --write` пересобирает _thread.md мигрированных + INDEX.
          # Конфиг протокола читается из main через git в .code (репо кода).
          run_derive() {
            (cd "$CODE" && pnpm -F agent-protocol --silent cli derive \
              --root "$MAIL" --repo "$CODE" --ref origin/main --write)
          }
          run_derive

          # Идемпотентность: расхождения нет — писать нечего, выходим тихо.
          # Это и есть мягкий переход: пока роль сама прогоняет rebuild, здесь
          # всегда пусто.
          if git diff --quiet; then
            echo "производные уже актуальны — коммитить нечего."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # До пяти попыток: в comms пишут параллельно живые роли. При гонке за
          # push пересобираем производные ПОВЕРХ свежего origin/comms, а не
          # переносим старые — источник (messages/) чужой роли уже там.
          for attempt in 1 2 3 4 5; do
            git add agent-comms
            git commit -m "chore(comms): rebuild derived"
            if git push origin HEAD:comms; then
              echo "производные пересобраны и запушены (попытка ${attempt})."
              exit 0
            fi
            echo "push отклонён (попытка ${attempt}) — пересобираю поверх свежего origin/comms."
            git reset --soft HEAD~1
            git fetch --no-tags origin comms
            git reset --hard origin/comms
            run_derive
            git diff --quiet && { echo "после чужого push расхождений нет."; exit 0; }
          done

          # Провал ОБЯЗАН быть заметным (требование заметности из 014): молча
          # разошедшиеся производные — тот же класс, что потерянный дубль
          # вердикта. Красный job виден без ручной сверки.
          echo "::error::не удалось запушить производные за 5 попыток."
          exit 1
