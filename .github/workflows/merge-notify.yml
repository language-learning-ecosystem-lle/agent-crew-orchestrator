name: Merge Notify

# Закрывает системную дыру протокола agent-comms (решение John 2026-07-22,
# тред 002-reviewer-setup): merge — клик в GitHub UI, он НЕ попадает в почту.
# waiting-on оставался на john, вахта исполнителя молчала, транзакция висела.
# Два прецедента за один день (PR #2 и #4) чинились руками куратора.
#
# Намеренно БЕЗ LLM — чистый bash: задача механическая, а стоимость и
# недетерминизм модели здесь ничем не оправданы.
on:
  pull_request:
    types: [closed]

jobs:
  notify:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write # запись в ветку comms
    steps:
      # Ветка comms живёт отдельно от кода: чекаутим ЕЁ, а не merge-коммит.
      - uses: actions/checkout@v5
        with:
          ref: comms
          fetch-depth: 0

      - name: Дописать merge в тред пакета
        env:
          # Через env, а не через ${{ }} в теле скрипта: заголовок PR —
          # пользовательский текст, и подстановка его в bash склеивала бы
          # команду с чем угодно, что в нём написано.
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          MERGED_BY: ${{ github.event.pull_request.merged_by.login }}
        run: |
          set -euo pipefail

          # Строка `thread: NNN-slug` в описании PR — единственная связь пакета
          # с тредом (требование CLAUDE.md). Нет её — уведомлять некуда, и это
          # не ошибка сборки: тихо выходим.
          THREAD=$(printf '%s' "$PR_BODY" | grep -oiE '^[[:space:]]*thread:[[:space:]]*[0-9]{3}-[a-z0-9-]+' | head -1 | sed -E 's/.*:[[:space:]]*//') || true
          if [ -z "${THREAD:-}" ]; then
            echo "В описании PR #${PR_NUMBER} нет строки 'thread: NNN-slug' — уведомлять некуда."
            exit 0
          fi

          THREAD_FILE="agent-comms/${THREAD}/_thread.md"
          if [ ! -f "$THREAD_FILE" ]; then
            echo "::warning::Тред '${THREAD}' указан в PR #${PR_NUMBER}, но ${THREAD_FILE} не существует."
            exit 0
          fi

          # Роль автора — строкой `role: <id>` в описании PR, рядом с `thread:`.
          #
          # Раньше здесь стояло жёсткое `dev-core` с оговоркой «на сегодня
          # активная dev-роль ровно одна; при активации dev-speech станет
          # неверно». dev-speech активирован 2026-07-22, то есть оговорка
          # наступила: первый же его смерженный PR передал бы ход dev-core, да
          # ещё на чужом треде. Выводить роль из автора PR по-прежнему нельзя —
          # все PR приходят из одной учётки GitHub.
          #
          # Роль СВЕРЯЕТСЯ С РЕЕСТРОМ (agent-comms/roles.json): опечатка в
          # описании PR иначе дала бы объявление, которое генератор реестра
          # молча отбросит как неизвестный токен, — то есть тишину вместо
          # передачи хода.
          # Причина отказа НАЗЫВАЕТСЯ В ТРЕДЕ, а не только в логе джобы:
          # «строки не было» и «роль опечатана» чинятся по-разному, а лог
          # читающий тред не видит. Одинаковый текст на оба случая отправлял бы
          # искать отсутствующую строку там, где на деле опечатан id.
          ROLE=$(printf '%s' "$PR_BODY" | grep -oiE '^[[:space:]]*role:[[:space:]]*[a-z][a-z0-9-]*' | head -1 | sed -E 's/.*:[[:space:]]*//') || true
          ROLE_PROBLEM=""
          if [ -z "${ROLE:-}" ]; then
            ROLE_PROBLEM='в описании PR не было строки `role: <id>`'
          elif ! jq -e --arg r "$ROLE" '.roles[] | select(.id == $r)' agent-comms/roles.json >/dev/null; then
            echo "::warning::В PR #${PR_NUMBER} указана роль '${ROLE}', которой нет в agent-comms/roles.json."
            ROLE_PROBLEM="в описании PR указана роль \`${ROLE}\`, которой нет в реестре ролей"
            ROLE=""
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # До пяти попыток: в comms пишут параллельно живые роли. Протокол
          # append-only — свои правки каждый раз пересобираем ПОВЕРХ свежего
          # origin/comms, а не переносим старый текст (иначе чужая секция,
          # пришедшая между попытками, была бы затёрта).
          for attempt in 1 2 3 4 5; do
            git fetch --no-tags origin comms
            git reset --hard origin/comms

            # Номер сообщения считается по ФАКТИЧЕСКОМУ содержимому треда в
            # момент записи — параллельная запись сдвигает нумерацию.
            LAST=$(grep -oE '^## msg-[0-9]+' "$THREAD_FILE" | grep -oE '[0-9]+' | sort -n | tail -1)
            NEXT=$(printf '%03d' $(( 10#${LAST:-0} + 1 )))

            # Передача хода объявляется В ТРЕДЕ, канонической строкой
            # `waiting-on → …` — INDEX генерируется из неё (тред 006).
            #
            # Роли НЕ УГАДЫВАЕМ. Нет строки `role:` — сообщение о merge всё
            # равно пишется (факт события ценен сам по себе), но ход не
            # передаётся и об этом сказано прямо в теле: молчаливая передача
            # хода наугад дороже, чем явное «объявите вручную». Прошлая версия
            # угадывала всегда и была бы неправа в первом же PR роли dev-speech.
            {
              printf '\n## msg-%s · from: github · %s · expects: none\n\n' "$NEXT" "$(date -u +%Y-%m-%d)"
              printf 'PR #%s (%s) **merged** by %s.\n' "$PR_NUMBER" "$PR_TITLE" "${MERGED_BY:-неизвестно}"
              if [ -n "${ROLE:-}" ]; then
                printf '\nwaiting-on → %s.\n' "$ROLE"
              else
                printf '\n⚠️ Ход не передан: %s — объявите ожидание вручную.\n' "$ROLE_PROBLEM"
              fi
            } >> "$THREAD_FILE"

            # INDEX руками больше не правится НИКЕМ — он производное от тредов.
            # Раньше здесь стоял python-патч строки таблицы, и после треда 006
            # это стало вторым писателем того же поля: бот ставил своё значение,
            # а следующий прогон генератора возвращал объявленное в треде. Кто
            # прав, зависело от того, кто отработал последним, — то есть ровно
            # тот класс рассинхрона, ради которого INDEX и сделали генерируемым.
            bash agent-comms/bin/rebuild-index.sh

            git add agent-comms
            git commit -m "chore(comms): PR #${PR_NUMBER} merged — уведомление в тред ${THREAD}"
            if git push origin HEAD:comms; then
              echo "Уведомление о merge PR #${PR_NUMBER} записано в ${THREAD} (msg-${NEXT})."
              exit 0
            fi
            echo "Push отклонён (попытка ${attempt}) — в comms писали параллельно, пересобираю."
          done

          echo "::error::Не удалось записать уведомление о merge PR #${PR_NUMBER} в ${THREAD} за 5 попыток."
          exit 1
