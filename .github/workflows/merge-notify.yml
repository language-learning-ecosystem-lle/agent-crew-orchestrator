name: Merge Notify

# Закрывает системную дыру протокола agent-comms (решение John 2026-07-22,
# тред 002-reviewer-setup): merge — клик в GitHub UI, он НЕ попадает в почту.
# waiting-on оставался на john, вахта исполнителя молчала, транзакция висела.
# Два прецедента за один день (PR #2 и #4) чинились руками куратора.
#
# Намеренно БЕЗ LLM — чистый bash: задача механическая, а стоимость и
# недетерминизм модели здесь ничем не оправданы.
on:
  pull_request:
    types: [closed]

jobs:
  notify:
    if: github.event.pull_request.merged == true
    # Пул ящика (этап 2, тред 049; решение john «переносится ВСЁ, включая
    # уведомители»). Оговорка та же, что у ci-outcome.yml: в пиковый час
    # доставка встаёт в очередь за `checks`, а это уведомитель, ПЕРЕДАЮЩИЙ ХОД —
    # задержка здесь стоит не минут, а простоя роли. Мерится пунктом 5
    # постановки; откат — одна строка.
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: write # запись в ветку comms
    steps:
      # Ветка comms живёт отдельно от кода: чекаутим ЕЁ, а не merge-коммит.
      - uses: actions/checkout@v5
        with:
          ref: comms
          fetch-depth: 0

      # Второй чекаут — код: конфиг протокола и пакет живут в main. Ветка comms
      # тоже содержит копию дерева, но СТАРУЮ: запускать пакет оттуда значило бы
      # исполнять протокол версией, отставшей на неизвестное число merge'ей.
      - uses: actions/checkout@v5
        with:
          ref: main
          path: .code
      # `dest` ОБЯЗАТЕЛЕН вместе с переездом на пул — см. ci.yml: по умолчанию
      # pnpm ставится в `~/setup-pnpm`, общий `$HOME` трёх воркеров ящика, и
      # джоба выдёргивает бинарь и стор из-под соседа. Вход `dest` есть и в v4
      # (`action.yml` тега: `required: false`, `default: ~/setup-pnpm`), но пин
      # подтянут до v5 заодно: единственный файл, отстававший от остальных шести,
      # — расхождение пинов ничем не оправдано, а чинить класс на старом теге
      # значит оставить его единственным местом с другим поведением.
      - uses: pnpm/action-setup@v5
        with:
          dest: ${{ runner.tool_cache }}/setup-pnpm
      - uses: actions/setup-node@v5
        with:
          node-version-file: .code/.nvmrc
          cache: pnpm
          cache-dependency-path: .code/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: .code

      - name: Дописать merge в тред пакета
        env:
          # Через env, а не через ${{ }} в теле скрипта: заголовок PR —
          # пользовательский текст, и подстановка его в bash склеивала бы
          # команду с чем угодно, что в нём написано.
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          MERGED_BY: ${{ github.event.pull_request.merged_by.login }}
          # ЦЕЛЬ merge — не декорация (инцидент 2026-07-27, тред 016). PR #33 был
          # смержен в ЖИВУЮ базовую ветку стека, а не в main: GitHub переадресует
          # базу только при УДАЛЕНИИ базовой ветки. Уведомление сказало «PR #33
          # merged» — и человек, и роль прочли это как «в main», а половина R13
          # осталась лежать на боковой ветке. Уведомитель не соврал: цель merge
          # просто не входила в то, что он произносит. Теперь входит.
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          # Строка `thread: NNN-slug` в описании PR — единственная связь пакета
          # с тредом (требование CLAUDE.md). Нет её — уведомлять некуда, и это
          # не ошибка сборки: тихо выходим.
          #
          # Обрамление `**`/бэктиками ТЕРПИМ: в #16 строки были в бэктиках,
          # прежний regex их не видел, и уведомление молчало с кодом 0 —
          # формат, проверяемый только глазами, разошёлся. Ключ и значение
          # вычищаются от оформления до сравнения.
          THREAD=$(printf '%s' "$PR_BODY" | grep -oiE '^[[:space:]`*]*thread`?:[[:space:]]*`?[0-9]{3}-[a-z0-9-]+' | head -1 | sed -E 's/^[^0-9]*//; s/[`*].*//') || true
          if [ -z "${THREAD:-}" ]; then
            echo "В описании PR #${PR_NUMBER} нет строки 'thread: NNN-slug' — уведомлять некуда."
            exit 0
          fi

          THREAD_FILE="agent-comms/${THREAD}/_thread.md"
          if [ ! -f "$THREAD_FILE" ]; then
            echo "::warning::Тред '${THREAD}' указан в PR #${PR_NUMBER}, но ${THREAD_FILE} не существует."
            exit 0
          fi

          # Роль автора — строкой `role: <id>` в описании PR, рядом с `thread:`.
          #
          # Раньше здесь стояло жёсткое `dev-core` с оговоркой «на сегодня
          # активная dev-роль ровно одна; при активации dev-speech станет
          # неверно». dev-speech активирован 2026-07-22, то есть оговорка
          # наступила: первый же его смерженный PR передал бы ход dev-core, да
          # ещё на чужом треде. Выводить роль из автора PR по-прежнему нельзя —
          # все PR приходят из одной учётки GitHub.
          #
          # Роль СВЕРЯЕТСЯ С КОНФИГОМ ПРОТОКОЛА, и сверяется ЧЕРЕЗ ПАКЕТ, а не
          # чтением файла: опечатка иначе дала бы объявление, которое генератор
          # реестра молча отбросит как неизвестный токен, — то есть тишину
          # вместо передачи хода. Второй парсер формата здесь заводить нельзя:
          # ровно от этого класса («у поля два читателя, и однажды они
          # разойдутся») уходит весь пакет. Отсюда и цена — минута установки
          # против секунд bash'а; она названа и принята (тред 012, msg-022).
          # Причина отказа НАЗЫВАЕТСЯ В ТРЕДЕ, а не только в логе джобы:
          # «строки не было» и «роль опечатана» чинятся по-разному, а лог
          # читающий тред не видит. Одинаковый текст на оба случая отправлял бы
          # искать отсутствующую строку там, где на деле опечатан id.
          ROLE=$(printf '%s' "$PR_BODY" | grep -oiE '^[[:space:]`*]*role`?:[[:space:]]*`?[a-z][a-z0-9-]*' | head -1 | sed -E 's/^[^a-z]*role`?:[[:space:]]*`?//i') || true
          ROLE_PROBLEM=""
          if [ -z "${ROLE:-}" ]; then
            ROLE_PROBLEM='в описании PR не было строки `role: <id>`'
          # `origin/main`, а не `HEAD` — тот же ref, которым ниже пишет
          # `new-message`: роль сверяется с ДЕЙСТВУЮЩИМ конфигом дефолтной
          # ветки, а не с тем, что оказалось головой чекаута `.code`
          # (в claude-review.yml это уже стоило переданного хода — там же причина).
          elif ! (cd .code && pnpm -F agent-protocol --silent cli role exists --repo . --ref origin/main --role "$ROLE" >/dev/null 2>&1); then
            echo "::warning::В PR #${PR_NUMBER} указана роль '${ROLE}', которой нет в конфиге протокола."
            ROLE_PROBLEM="в описании PR указана роль \`${ROLE}\`, которой нет в конфиге протокола"
            ROLE=""
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Тело уведомления одно для обеих форм записи (см. ниже). Строится
          # один раз: факт merge + либо передача хода, либо явное «не передан».
          BODY_TMP="$(mktemp)"
          {
            printf 'PR #%s (%s) **merged** by %s → `%s`.\n' \
              "$PR_NUMBER" "$PR_TITLE" "${MERGED_BY:-неизвестно}" "${BASE_REF:-?}"
            # Случай «база — не дефолтная ветка» выделен ОТДЕЛЬНО, а не оставлен
            # на внимательность читателя: именно он и был прочитан неверно, а
            # разница между «доехало до main» и «доехало до ветки» решает, есть
            # ли работа на месте или её надо восстанавливать.
            if [ -n "${BASE_REF:-}" ] && [ -n "${DEFAULT_BRANCH:-}" ] && [ "$BASE_REF" != "$DEFAULT_BRANCH" ]; then
              printf '\n⚠️ База merge — `%s`, а НЕ `%s`: содержимое PR в дефолтную ветку не попало.\n' \
                "$BASE_REF" "$DEFAULT_BRANCH"
            fi
            if [ -z "${ROLE:-}" ]; then
              printf '\n⚠️ Ход не передан: %s — объявите ожидание вручную.\n' "$ROLE_PROBLEM"
            fi
          } > "$BODY_TMP"

          # До пяти попыток: в comms пишут параллельно живые роли. Протокол
          # append-only — свои правки каждый раз пересобираем ПОВЕРХ свежего
          # origin/comms, а не переносим старый текст (иначе чужая секция,
          # пришедшая между попытками, была бы затёрта).
          for attempt in 1 2 3 4 5; do
            git fetch --no-tags origin comms
            git reset --hard origin/comms

            # АДАПТИВНАЯ ЗАПИСЬ (тред 012, msg-063). Форма зависит от того,
            # мигрирован ли тред:
            #
            # - МИГРИРОВАН (есть messages/): пишем ФАЙЛ-сообщение через пакет и
            #   INDEX НЕ трогаем — производные (_thread.md + INDEX) соберёт
            #   генератор. Дописать здесь _thread.md было бы фатально: генератор
            #   пересоберёт его из messages/ БЕЗ нашей секции, и уведомление
            #   исчезнет молча. Ровно та потеря, которую этот переход и
            #   предотвращает.
            # - LEGACY (нет messages/): дописываем _thread.md; INDEX собирает
            #   генератор (comms-derived) на push, как и для мигрированных
            #   (rebuild-index.sh убран, PR #33 — он читал упразднённый ROLES.md).
            #   Эта ветка и вся адаптивность живут, пока есть НЕмигрированные
            #   open-треды (сейчас 009/010). УСЛОВИЕ СНЯТИЯ: все open-треды
            #   мигрированы — тогда legacy-ветка убирается, остаётся только
            #   new-message (критерий продублирован в PROTOCOL.md, тред 015).
            #
            # Обе ветки ПИШУТ и никогда не выходят без записи: merge-notify —
            # единственный писатель по событию, и молчаливая потеря факта здесь
            # недопустима (пункт 2 curator).
            if [ -d "agent-comms/${THREAD}/messages" ]; then
              WAIT_ARGS=""
              [ -n "${ROLE:-}" ] && WAIT_ARGS="--waiting-on ${ROLE}"
              # ВТОРАЯ ПОЛОВИНА СОБЫТИЙНОЙ ПАРКОВКИ (тред 023, решение john —
              # вариант A; читающая половина приехала в #131). Тред, запаркованный
              # на `parked-on: pr:N`, ждёт не человека, а КНОПКУ — и снимается
              # ровно этим полем: `merged-pr` называет номер, который сел в main.
              # Без него парковка на событие висела бы до человеческой руки, то
              # есть ровно тем ожиданием, ради устранения которого заведена.
              #
              # Поле пишется в КАЖДОЕ уведомление о merge, а не только в те, где
              # кто-то ждёт: писатель не знает, какие треды на него запаркованы
              # (парковка живёт в ЧУЖИХ тредах — 042 паркуется на PR треда 023),
              # а читатель ищет число сам. Условие «писать, если ждут» требовало
              # бы обхода всей почты на каждый merge и разошлось бы с ней молча.
              #
              # Только эта ветка: в legacy-тредах (009/010) парковки нет по
              # построению — их сообщения дописываются текстом, полей заголовка
              # у них нет, и заводить второй писатель формата ради двух тредов,
              # которые условие снятия адаптивности и так упразднит, нельзя.
              if ! (cd .code && pnpm -F agent-protocol --silent cli new-message \
                    --root "${GITHUB_WORKSPACE}/agent-comms" --repo . --ref origin/main \
                    --thread "$THREAD" --from github --expects none ${WAIT_ARGS} \
                    --worker gh-action --merged-pr "$PR_NUMBER" \
                    --body-file "$BODY_TMP" --write --no-push); then
                echo "::error::new-message отказал для мигрированного треда ${THREAD} — уведомление НЕ записано."
                exit 1
              fi
            else
              # Номер считается по ФАКТИЧЕСКОМУ содержимому треда — параллельная
              # запись сдвигает нумерацию.
              LAST=$(grep -oE '^## msg-[0-9]+' "$THREAD_FILE" | grep -oE '[0-9]+' | sort -n | tail -1)
              NEXT=$(printf '%03d' $(( 10#${LAST:-0} + 1 )))
              {
                printf '\n## msg-%s · from: github · %s · expects: none\n\n' "$NEXT" "$(date -u +%Y-%m-%d)"
                cat "$BODY_TMP"
                if [ -n "${ROLE:-}" ]; then
                  printf '\nwaiting-on → %s.\n' "$ROLE"
                fi
              } >> "$THREAD_FILE"
              # INDEX НЕ трогаем — производное; его пересоберёт генератор
              # comms-derived на этот же push, ровно как для мигрированных тредов
              # (loadThreads/derive читают и legacy `_thread.md`). Прежний
              # `rebuild-index.sh` убран: он брал список ролей из `ROLES.md`,
              # который упразднён, и на legacy-тредах падал бы «не смог прочитать
              # роли — INDEX не трогаю» — тихий отказ уведомления о merge ровно
              # там, куда оно и пойдёт (009/010) при возврате john к фронтам.
            fi

            git add agent-comms
            git commit -m "chore(comms): PR #${PR_NUMBER} merged — уведомление в тред ${THREAD}"
            if git push origin HEAD:comms; then
              echo "Уведомление о merge PR #${PR_NUMBER} записано в ${THREAD}."
              exit 0
            fi
            echo "Push отклонён (попытка ${attempt}) — в comms писали параллельно, пересобираю."
          done

          echo "::error::Не удалось записать уведомление о merge PR #${PR_NUMBER} в ${THREAD} за 5 попыток."
          exit 1
