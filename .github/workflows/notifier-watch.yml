name: Notifier Watch

# ЗА УВЕДОМИТЕЛЕМ ТЕПЕРЬ СЛЕДЯТ (постановка curator, тред 040, пункт C-3.2).
# Двадцать отказов `CI Outcome` подряд провисели незамеченными и нашлись только
# потому, что в них пришли за живым подтверждением: в шапке уведомителя было
# написано «за красным уведомителем следят глазами в Actions», а глазами не
# следил никто. Норма «ожидание чужого прогона — не действие» (016) поставила на
# этот канал ВСЁ — сессии больше не поллят прогоны, — и молчащий уведомитель
# стал молчащим арбитром.
#
# КУДА ВЫХОДИТ СИГНАЛ. Из контура — в почту: отказ перестаёт быть строкой в
# Actions, которую никто не читает, и становится письмом с ходом на роли, то
# есть попадает туда, куда контур смотрит по построению (тред поднимает пару
# сам). Второй разрешённый выход — транспорт протокола (Telegram) — здесь не
# взят: у джобы нет его секретов, а заводить их — расход и внешний сервис, то
# есть решение john, а не форма, оставленная исполнителю.
#
# ПОСЛЕДНЕЕ ЗВЕНО НАЗВАНО, А НЕ ЗАКРЫТО. `workflow_run` не рекурсивен по
# построению: отказ САМОГО смотрителя ему же не приедет. Лестницу смотрителей
# строить незачем (curator сказал это прямо) — вместо неё смотритель нарочно
# тонкий: чекаут, установка, одно сообщение. Ни поиска PR, ни вывода роли, ни
# разбора легаси-тредов — вся сложность оставлена тем, за кем он следит, и
# поэтому его собственная поверхность отказа кратно меньше их.
#
# ЦИКЛА НЕТ: push этой джобы сделан GITHUB_TOKEN'ом, а события от него новых
# прогонов не поднимают — иначе отказ `Comms Derived` (он на push в comms)
# крутил бы смотрителя по кругу.

# ⚠️ ЗАМОРОЖЕН: ЭТАЛОН ПРОИСХОЖДЕНИЯ, НЕ ПОДДЕРЖИВАЕТСЯ (решение john 2026-08-17,
# тред 080-extraction-prep). Почтовые воркфлоу приехали сюда вместе с историей
# пакета — они читают почту и роли ОБСЛУЖИВАЕМОГО проекта (ветка `comms`,
# `agent-protocol.json`), которых в этом репозитории нет. Живые копии живут в
# репозитории проекта; здесь файл сохранён как происхождение кода, чтобы история
# пакета не обрывалась. Триггеры сняты до `workflow_dispatch`: автоматически он
# не запускается никогда, вручную — только если кто-то знает, что делает.

on:
  workflow_dispatch:
jobs:
  alarm:
    # ТОЛЬКО настоящий отказ. `skipped`/`neutral` — это штатная тишина (джоба с
    # ложным `if`), и звонить на неё значило бы приучить читателя к ложным
    # тревогам.
    #
    # САМОПРОПУСК `claude-code-action` СЮДА НЕ ПОПАДАЕТ, но не потому, что он
    # `skipped`, как было написано здесь сначала: на самопропуске действие
    # заканчивается УСПЕХОМ, а джоба падает ниже, на отсутствии `verdict.md`, —
    # то есть класс приходил сюда как `failure` и звонил (прогон 30643932101 по
    # #106, тред 046). Отсечён он ТАМ ЖЕ, ГДЕ РОЖДАЕТСЯ — шагом статуса в
    # `claude-review.yml`, который на этом одном классе не краснеет: смотритель
    # намеренно ничего не знает про внутренности тех, за кем следит, и первое же
    # исключение по имени воркфлоу здесь начало бы ту самую лестницу.
    #
    # `cancelled` НЕ в списке, и это замер, а не вкус (curator, тред 040): у
    # `Comms Derived` стоит `concurrency: cancel-in-progress: false`, при котором
    # GitHub держит в группе ровно один ОЖИДАЮЩИЙ прогон — следующий push в
    # `comms` отменяет предыдущего ожидающего, и производные пересобирает более
    # свежий. Это штатная работа очереди и происходит постоянно: 12 `cancelled`
    # из 100 прогонов за 1 ч 42 мин, каждый — звонок с ходом на роль, то есть
    # поднятая сессия. Второй источник того же класса — `claude-review.yml`
    # (`cancel-in-progress: true`): снятая и повешенная заново метка `review`
    # отменяет прогон, который ещё в воздухе.
    # Разделять список по имени воркфлоу не стали: он знал бы про ЧУЖИЕ конфиги
    # concurrency, а они меняются без него. `cancelled` на GitHub двузначен по
    # построению — «вытеснен очередью» и «отменён руками» неразличимы полем, а в
    # обоих случаях адресат либо ничего не потерял (работу делает более свежий
    # прогон), либо уже знает (отменял он сам).
    if: contains(fromJSON('["failure","timed_out","startup_failure","action_required","stale"]'), github.event.workflow_run.conclusion)
    # HOSTED ПО ТИПУ РЕПОЗИТОРИЯ (тред 006) — обоснование в `checks.yml`.
    # Здесь переезд ЗАКРЫВАЕТ названную ранее дыру, а не только меняет железо:
    # на пуле это был СМОТРИТЕЛЬ, живущий на ящике, чьи отказы он отчасти и
    # сторожит, — при мёртвом пуле его собственное молчание было невидимо, и
    # прикрывал этот класс только внешний сторож (`docs/box-setup.md` §7,
    # healthchecks.io). На hosted смотритель и наблюдаемый разъезжаются по
    # разному железу, и внешний сторож перестаёт быть единственным поясом.
    # По минутам переезд не стоит ничего: 469 прогонов за 36,5 ч — 22 минуты,
    # `if` выше отсекает штатную тишину ДО чекаута.
    runs-on: ubuntu-latest
    permissions:
      contents: write # запись в ветку comms
      actions: read # разбор прогона по джобам (обнулённый scope отвечает тем же 403, что запрет)
    steps:
      - uses: actions/checkout@v5
        with:
          ref: comms
          fetch-depth: 0

      # Второй чекаут — код: конфиг протокола и пакет живут в main (копия дерева
      # в comms отстаёт на неизвестное число merge'ей).
      - uses: actions/checkout@v5
        with:
          ref: main
          path: .code
      # `dest` на hosted инертен (свежая машина на джобу, общего `$HOME` нет) и
      # оставлен как страховка от возврата на пул — каноническое объяснение
      # класса в `comms-derived.yml`.
      - uses: pnpm/action-setup@v5
        with:
          dest: ${{ runner.tool_cache }}/setup-pnpm
      - uses: actions/setup-node@v5
        with:
          node-version-file: .code/.nvmrc
          cache: pnpm
          cache-dependency-path: .code/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: .code

      - name: Позвонить в тред-приёмник
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          WF_NAME: ${{ github.event.workflow_run.name }}
          WF_EVENT: ${{ github.event.workflow_run.event }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          # Стоячий тред-приёмник и роль, которой уходит ход: воркфлоу контура —
          # зона dev-core. Оба назначены, а не выведены: у отказа уведомителя
          # нет описания PR, из которого что-то выводится.
          THREAD: 042-notifier-down
          ROLE: dev-core
        run: |
          set -euo pipefail

          echo "1/2 · разбор по джобам прогона ${RUN_ID}, попытка ${RUN_ATTEMPT}"
          JOBS=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/attempts/${RUN_ATTEMPT}/jobs" --paginate \
                   --jq '.jobs[] | "- `\(.name)` — **\(.conclusion // "?")**"') || JOBS="- (разбор по джобам не прочитан)"

          # Тело — ФАЙЛОМ ВНЕ чекаута почты: доставка делает reset --hard при
          # отклонённом push и снесла бы файл, лежащий внутри.
          BODY_TMP="$(mktemp)"
          {
            printf '🔕 **Уведомитель `%s` отказал: `%s`.**\n\n' "$WF_NAME" "$CONCLUSION"
            printf 'событие `%s` · ветка `%s` · голова `%s` · попытка %s · прогон [`%s`](%s)\n\n' \
              "$WF_EVENT" "${HEAD_BRANCH:-?}" "$HEAD_SHA" "$RUN_ATTEMPT" "$RUN_ID" "$RUN_URL"
            printf '%s\n' "$JOBS"
            printf '\nЧто именно не доехало — в логе прогона: у отказавшей доставки адресат остался без события, и восстанавливать его надо руками.\n'
          } > "$BODY_TMP"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Дверь push'а — общая на всех писателей контура (тред 042): она же
          # объявляет потолок попыток и она же различает гонку и отказ сервера.
          # Своя запись каждый раз пересобирается ПОВЕРХ свежего origin/comms —
          # протокол append-only, старый текст не переносится.
          source "${GITHUB_WORKSPACE}/.code/.github/scripts/comms-push.sh"
          echo "2/2 · запись в тред ${THREAD} (${WF_NAME}, исход ${CONCLUSION})"
          for attempt in $(seq 1 "$COMMS_PUSH_ATTEMPTS"); do
            git fetch --no-tags origin comms
            git reset --hard origin/comms
            if ! (cd .code && pnpm -F agent-protocol --silent cli new-message \
                  --root "${GITHUB_WORKSPACE}/agent-comms" --repo . --ref origin/main \
                  --thread "$THREAD" --from github --expects none --waiting-on "$ROLE" \
                  --worker gh-action \
                  --body-file "$BODY_TMP" --write --no-push); then
              echo "::error::new-message отказал — отказ уведомителя ${WF_NAME} (${RUN_ID}) НЕ записан в ${THREAD}."
              exit 1
            fi
            git add agent-comms
            git commit -m "chore(comms): уведомитель ${WF_NAME} отказал (${CONCLUSION}) — звонок в тред ${THREAD}"
            if comms_push "$attempt"; then
              echo "Отказ уведомителя ${WF_NAME} (${RUN_ID}) доставлен в тред ${THREAD}."
              exit 0
            fi
          done

          echo "::error::Не удалось доставить отказ уведомителя ${WF_NAME} (${RUN_ID}) в ${THREAD} за ${COMMS_PUSH_ATTEMPTS} попыток."
          exit 1
