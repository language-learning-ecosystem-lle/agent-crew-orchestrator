name: Notifier Watch

# ЗА УВЕДОМИТЕЛЕМ ТЕПЕРЬ СЛЕДЯТ (постановка curator, тред 040, пункт C-3.2).
# Двадцать отказов `CI Outcome` подряд провисели незамеченными и нашлись только
# потому, что в них пришли за живым подтверждением: в шапке уведомителя было
# написано «за красным уведомителем следят глазами в Actions», а глазами не
# следил никто. Норма «ожидание чужого прогона — не действие» (016) поставила на
# этот канал ВСЁ — сессии больше не поллят прогоны, — и молчащий уведомитель
# стал молчащим арбитром.
#
# КУДА ВЫХОДИТ СИГНАЛ. Из контура — в почту: отказ перестаёт быть строкой в
# Actions, которую никто не читает, и становится письмом с ходом на роли, то
# есть попадает туда, куда контур смотрит по построению (тред поднимает пару
# сам). Второй разрешённый выход — транспорт протокола (Telegram) — здесь не
# взят: у джобы нет его секретов, а заводить их — расход и внешний сервис, то
# есть решение john, а не форма, оставленная исполнителю.
#
# ПОСЛЕДНЕЕ ЗВЕНО НАЗВАНО, А НЕ ЗАКРЫТО. `workflow_run` не рекурсивен по
# построению: отказ САМОГО смотрителя ему же не приедет. Лестницу смотрителей
# строить незачем (curator сказал это прямо) — вместо неё смотритель нарочно
# тонкий: чекаут, установка, одно сообщение. Ни поиска PR, ни вывода роли, ни
# разбора легаси-тредов — вся сложность оставлена тем, за кем он следит, и
# поэтому его собственная поверхность отказа кратно меньше их.
#
# ЦИКЛ ЕСТЬ, И ОН ЗАМЕРЕН — абзац выше говорил обратное и был неправдой,
# исправляется он здесь по факту, а не по рассуждению (тред 073, 2026-09-02).
# «GITHUB_TOKEN новых прогонов не поднимает» верно про прогоны СМОТРИТЕЛЯ (себя
# он и правда не будит), но петля идёт не через него: письмо смотрителя есть
# push в `comms` → push в `comms` поднимает `Comms Derived` (его триггер — push,
# а не `workflow_run`, и `GITHUB_TOKEN` его не глушит) → пока `Comms Derived`
# красный, он снова отказ → снова письмо. Усиление 1:1, не затухает: девять
# писем в `077-notifier-down` за тринадцать минут (прогоны
# 33656370292…33657542629), звонок 16:52:25Z → пересборка 16:52:31Z → звонок
# 16:52:59Z. Канал тревоги проложен через тот ресурс, чью поломку он сообщает.
#
# ПОЭТОМУ ПОВТОР ГЛУШИТСЯ, И ГЛУШИТСЯ ГРОМКО. Правило и вся его история —
# `.github/scripts/notifier-mute.sh` (окно, ключ, названный хвост); здесь оно
# только вызывается. Класс общий, а не про `Comms Derived`: у трёх остальных
# наблюдаемых петли сегодня нет, но исключение по имени воркфлоу здесь начало бы
# ту самую лестницу смотрителей, которую абзац «последнее звено» запрещает.

# РАЗМОРОЖЕН 2026-09-02 (решение john, тред 073-notifiers-frozen-in-own-contour).
# Довод заморозки 17.08 — «почтовые воркфлоу читают почту и роли ОБСЛУЖИВАЕМОГО
# проекта, которых в этом репозитории нет» — перестал быть правдой: у репозитория
# есть своя ветка `comms`, свои роли и свой резидентный демон, он обслуживает сам
# себя. Тем же доводом 18.08 разморозили `merge-notify.yml`, а здесь его не
# применили, и цена уплачена: с 2026-08-30T20:14Z из GitHub в почту не доехало НИ
# ОДНОГО письма — шесть merge подряд в тишину, и нашёл это john глазами по
# красным прогонам. Звонить об этом — работа ровно этой джобы.
#
# СПИСОК СВЕРЕН С ЗДЕШНИМИ ИМЕНАМИ (по строкам `name:` файлов `.github/workflows`,
# 2026-09-02): все четверо существуют в этом репозитории и правки не потребовали.
# `checks` в списке нет намеренно — он не уведомитель, за его исходом смотрит
# `ci-outcome.yml`; поставить его сюда значило бы звонить дважды об одном красном.
# Себя смотритель не сторожит по построению (`workflow_run` не рекурсивен) — это
# названо в абзаце «последнее звено» выше и заморозкой не менялось.

on:
  workflow_run:
    workflows: [CI Outcome, Merge Notify, Comms Derived, Claude PR Review]
    types: [completed]
jobs:
  alarm:
    # ТОЛЬКО настоящий отказ. `skipped`/`neutral` — это штатная тишина (джоба с
    # ложным `if`), и звонить на неё значило бы приучить читателя к ложным
    # тревогам.
    #
    # САМОПРОПУСК `claude-code-action` СЮДА НЕ ПОПАДАЕТ, но не потому, что он
    # `skipped`, как было написано здесь сначала: на самопропуске действие
    # заканчивается УСПЕХОМ, а джоба падает ниже, на отсутствии `verdict.md`, —
    # то есть класс приходил сюда как `failure` и звонил (прогон 30643932101 по
    # #106, тред 046). Отсечён он ТАМ ЖЕ, ГДЕ РОЖДАЕТСЯ — шагом статуса в
    # `claude-review.yml`, который на этом одном классе не краснеет: смотритель
    # намеренно ничего не знает про внутренности тех, за кем следит, и первое же
    # исключение по имени воркфлоу здесь начало бы ту самую лестницу.
    #
    # `cancelled` НЕ в списке, и это замер, а не вкус (curator, тред 040): у
    # `Comms Derived` стоит `concurrency: cancel-in-progress: false`, при котором
    # GitHub держит в группе ровно один ОЖИДАЮЩИЙ прогон — следующий push в
    # `comms` отменяет предыдущего ожидающего, и производные пересобирает более
    # свежий. Это штатная работа очереди и происходит постоянно: 12 `cancelled`
    # из 100 прогонов за 1 ч 42 мин, каждый — звонок с ходом на роль, то есть
    # поднятая сессия. Второй источник того же класса — `claude-review.yml`
    # (`cancel-in-progress: true`): снятая и повешенная заново метка `review`
    # отменяет прогон, который ещё в воздухе.
    # Разделять список по имени воркфлоу не стали: он знал бы про ЧУЖИЕ конфиги
    # concurrency, а они меняются без него. `cancelled` на GitHub двузначен по
    # построению — «вытеснен очередью» и «отменён руками» неразличимы полем, а в
    # обоих случаях адресат либо ничего не потерял (работу делает более свежий
    # прогон), либо уже знает (отменял он сам).
    if: contains(fromJSON('["failure","timed_out","startup_failure","action_required","stale"]'), github.event.workflow_run.conclusion)
    # HOSTED ПО ТИПУ РЕПОЗИТОРИЯ (тред 006) — обоснование в `checks.yml`.
    # Здесь переезд ЗАКРЫВАЕТ названную ранее дыру, а не только меняет железо:
    # на пуле это был СМОТРИТЕЛЬ, живущий на ящике, чьи отказы он отчасти и
    # сторожит, — при мёртвом пуле его собственное молчание было невидимо, и
    # прикрывал этот класс только внешний сторож (`docs/box-setup.md` §7,
    # healthchecks.io). На hosted смотритель и наблюдаемый разъезжаются по
    # разному железу, и внешний сторож перестаёт быть единственным поясом.
    # По минутам переезд не стоит ничего: 469 прогонов за 36,5 ч — 22 минуты,
    # `if` выше отсекает штатную тишину ДО чекаута.
    runs-on: ubuntu-latest
    permissions:
      contents: write # запись в ветку comms
      actions: read # разбор прогона по джобам (обнулённый scope отвечает тем же 403, что запрет)
    steps:
      - uses: actions/checkout@v5
        with:
          ref: comms
          fetch-depth: 0

      # Второй чекаут — код: конфиг протокола и пакет живут в main (копия дерева
      # в comms отстаёт на неизвестное число merge'ей).
      - uses: actions/checkout@v5
        with:
          ref: main
          path: .code
      # `dest` на hosted инертен (свежая машина на джобу, общего `$HOME` нет) и
      # оставлен как страховка от возврата на пул — каноническое объяснение
      # класса в `comms-derived.yml`.
      - uses: pnpm/action-setup@v5
        with:
          dest: ${{ runner.tool_cache }}/setup-pnpm
      - uses: actions/setup-node@v5
        with:
          node-version-file: .code/.nvmrc
          cache: pnpm
          cache-dependency-path: .code/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: .code

      - name: Позвонить в тред-приёмник
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          WF_NAME: ${{ github.event.workflow_run.name }}
          WF_EVENT: ${{ github.event.workflow_run.event }}
          # Идентификатор ВОРКФЛОУ (не прогона) — по нему считается, сколько
          # отказов этого уведомителя заглушено с прошлого письма. Имя для этого
          # не годится: у API ключ — id или имя файла, а имя воркфлоу правится
          # его же шапкой.
          WF_ID: ${{ github.event.workflow_run.workflow_id }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          # СТОЯЧИЙ АДРЕС — СЛАГ, А НЕ ЛИТЕРАЛ ТРЕДА (тред 080, решение john
          # 2026-09-03). Раньше здесь стояло `THREAD: 077-notifier-down`, и это
          # был адрес без конца: тред, который нельзя закрыть, потому что
          # закрытие делает канал недоставляемым. Замер треда 080 показал, что
          # оно хуже: письмо в закрытый или паркованный тред дверь ПРИНИМАЕТ (от
          # машинного писателя — всегда), прогон зелёный, а `waitingOnOf` на
          # закрытом треде отвечает «никого» ДО разбора объявлений — звонок
          # доезжает и никого не будит, и красноты об этом нет нигде.
          # Теперь адрес называется слагом, а исполняет его обычный тред с
          # концом: `--ensure-thread` берёт тот приёмник этого слага, что открыт
          # и не паркован (старший по номеру), а нет такого — ОТКРЫВАЕТ
          # следующий (`<следующий свободный NNN>-notifier-down`) с заголовком и
          # участниками отсюда, мету и письмо одним коммитом.
          # `077-notifier-down` при этом остаётся тем, чем был: пока он открыт,
          # письма едут в него — переезд адреса начнётся с его закрытия, и
          # закрытие теперь нормальный исход, а не авария.
          # Слаг НЕ несёт номера: `--ensure-thread 077-notifier-down` дверь
          # отказывает по имени (номер — это то, что флаг выдаёт сам).
          THREAD_SLUG: notifier-down
          THREAD_TITLE: "Стоячий адрес: отказ уведомителя"
          # Участники нового приёмника берутся ОТСЮДА, а не выводятся, и каждый
          # сверяется дверью с конфигом: неизвестный завалил бы доставку внутри
          # аварии. Тот же состав, что у 077, заведённого рукой.
          THREAD_PARTICIPANTS: github,dev-core,curator
          ROLE: dev-core
        run: |
          set -euo pipefail

          # ПРАВИЛО ГЛУШЕНИЯ СПРАШИВАЕТСЯ ПЕРВЫМ, до разбора по джобам: цена
          # заглушённого прогона — один `git fetch`, а не чтение чужого API.
          # Почта перечитывается с origin ИМЕННО ЗДЕСЬ: чекаут сделан в начале
          # джобы, а решать «письмо уже лежит» надо по свежей ленте, иначе два
          # прогона подряд оба сочтут себя первыми. Гонку двух ОДНОВРЕМЕННЫХ
          # прогонов это не снимает (они читают одну и ту же ленту) — тогда
          # писем будет два вместо одного, что и есть правильная сторона ошибки.
          source "${GITHUB_WORKSPACE}/.code/.github/scripts/notifier-mute.sh"
          git fetch --no-tags origin comms
          git reset --hard origin/comms
          NOW_ISO="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # ЛЕНТА, ПО КОТОРОЙ ГЛУШАТ, — ЛЕНТА ТЕКУЩЕГО ПРИЁМНИКА (тред 080).
          # Адрес стоячий, приёмники сменяются, и читать здесь каталог по имени
          # значило бы глушить звонок серией из ЗАКРЫТОГО треда — письмо-то
          # поедет в новый и пустой. Правило выбора и цена того, чего оно не
          # видит (парк), названы в самом `notifier-mute.sh`.
          MUTE_SOURCE="$(notifier_mute_source "${GITHUB_WORKSPACE}/agent-comms" "$THREAD_SLUG")"
          if [ -z "$MUTE_SOURCE" ]; then
            # Открытого приёмника у адреса нет — глушить нечем и не о чем:
            # письмо поедет и откроет его. Молчание здесь было бы тишиной в
            # аварии, то есть исходным дефектом треда 073.
            VERDICT=deliver
            LAST_AT=-
            AGE=-
            echo "У адреса '${THREAD_SLUG}' открытого приёмника нет — письмо откроет следующий."
          else
            MUTE_IN="$(basename "${MUTE_SOURCE%/messages}")"
            echo "Приёмник адреса '${THREAD_SLUG}' сейчас: ${MUTE_IN}"
            read -r VERDICT LAST_AT AGE <<<"$(notifier_mute_decide "$MUTE_SOURCE" "$WF_NAME" "$NOW_ISO")"
          fi

          if [ "$VERDICT" = mute ]; then
            # ЗАГЛУШЕНО — НЕ ОТКАЗ: прогон зелёный. Красный здесь означал бы, что
            # смотритель сломался, и звал бы человека ровно туда, где всё
            # работает по правилу.
            MUTED_SAY="Отказ уведомителя ${WF_NAME} (прогон ${RUN_ID}) ЗАГЛУШЁН: письмо о нём уже лежит в ${MUTE_IN} (${LAST_AT}, ${AGE} с назад, окно ${NOTIFIER_MUTE_WINDOW_SEC} с). Следующее доехавшее письмо назовёт его числом."
            echo "::notice::${MUTED_SAY}"
            printf '🔇 %s\n\nПрогон отказавшего: %s\n' "$MUTED_SAY" "$RUN_URL" >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          echo "1/2 · разбор по джобам прогона ${RUN_ID}, попытка ${RUN_ATTEMPT}"
          JOBS=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/attempts/${RUN_ATTEMPT}/jobs" --paginate \
                   --jq '.jobs[] | "- `\(.name)` — **\(.conclusion // "?")**"') || JOBS="- (разбор по джобам не прочитан)"

          # ГРОМКОСТЬ ГЛУШЕНИЯ — ЗДЕСЬ. Сколько отказов этого уведомителя не
          # доехало письмом с прошлого раза, спрашивается у GitHub (прогоны
          # ЭТОГО воркфлоу, завершившиеся отказом позже прошлого письма), а не
          # хранится где-то состоянием: хранить его пришлось бы в той самой
          # почте, запись в которую и есть источник петли. Отказ этого чтения —
          # не отказ доставки: письмо едет, а строка честно говорит, что число
          # не прочитано, И ЧЕГО ИМЕННО НЕ ХВАТИЛО.
          #
          # ЗАПРОС И РАЗБОР — ДВЕ КОМАНДЫ, А НЕ ОДНА (тред 119). Пока фильтр
          # стоял внутри `gh --jq`, обе стороны отказывали одним кодом 1, и
          # ветвь называла виноватым GitHub — в том числе тогда, когда сломан
          # был сам фильтр (а он был сломан при любых данных). Теперь ответ
          # кладётся файлом, фильтр гоняется предикатом из `notifier-mute.sh`
          # тем же бинарём `jq`, что и юнит, и каждая сторона называется своим
          # именем. Читателя ветвь посылает в лог ЭТОГО прогона смотрителя, где
          # и напечатана настоящая ошибка, а не в Actions наблюдаемого.
          #
          # ТЕЛО ВЫРЕЗАЕТСЯ ТЕСТОМ ПО МАРКЕРАМ НИЖЕ и гоняется на подложных
          # данных (`notifier-mute.test.sh`, раздел «три исхода»): формулировки
          # обязаны остаться в этом файле — `.github/scripts/**` не покрыт
          # `powerDocuments`, и переезд текста туда снял бы воркфлоу с кнопки
          # john, — а проверять их надо прогоном, а не глазом. Правишь маркеры
          # или имена переменных — правь и тест: он отказывает по имени.
          # >>> notifier-mute: громкость >>>
          MUTED_LINE=''
          if [ "$LAST_AT" != - ]; then
            RUNS_JSON="$(mktemp)"
            MUTED_UNREAD=''
            MUTED_IDS=''
            if ! gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/${WF_ID}/runs?per_page=100&status=completed" > "$RUNS_JSON"; then
              MUTED_UNREAD='список прогонов не получен — запрос к GitHub не выполнен'
            elif ! MUTED_IDS="$(notifier_mute_muted_ids "$RUNS_JSON" "$LAST_AT" "$RUN_ID")"; then
              MUTED_UNREAD='список прогонов получен, но не разобран — отказал отбор отказных прогонов'
            fi
            if [ -n "$MUTED_UNREAD" ]; then
              MUTED_LINE="🔇 Сколько отказов этого уведомителя заглушено с прошлого письма (\`${LAST_AT}\`) — НЕ ПРОЧИТАНО: ${MUTED_UNREAD}. Само письмо это не задержало. Настоящая ошибка напечатана в логе ЭТОГО прогона смотрителя — ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}, шаг «Позвонить в тред-приёмник»; в прогонах \`${WF_NAME}\` её нет."
            else
              # shellcheck disable=SC2086
              set -- $MUTED_IDS
              if [ "$#" -gt 0 ]; then
                MUTED_LINE="🔇 **Заглушено с прошлого письма (\`${LAST_AT}\`) отказов того же уведомителя: $#** — прогоны $(printf '%s, ' "$@" | sed 's/, $//'). Правило — окно ${NOTIFIER_MUTE_WINDOW_SEC} с по имени уведомителя (\`.github/scripts/notifier-mute.sh\`)."
              else
                MUTED_LINE="🔇 С прошлого письма (\`${LAST_AT}\`) других отказов этого уведомителя не было — заглушать было нечего."
              fi
            fi
            rm -f "$RUNS_JSON"
          fi
          # <<< notifier-mute: громкость <<<

          # Тело — ФАЙЛОМ ВНЕ чекаута почты: доставка делает reset --hard при
          # отклонённом push и снесла бы файл, лежащий внутри.
          BODY_TMP="$(mktemp)"
          {
            printf '🔕 **Уведомитель `%s` отказал: `%s`.**\n\n' "$WF_NAME" "$CONCLUSION"
            printf 'событие `%s` · ветка `%s` · голова `%s` · попытка %s · прогон [`%s`](%s)\n\n' \
              "$WF_EVENT" "${HEAD_BRANCH:-?}" "$HEAD_SHA" "$RUN_ATTEMPT" "$RUN_ID" "$RUN_URL"
            printf '%s\n' "$JOBS"
            printf '\nЧто именно не доехало — в логе прогона: у отказавшей доставки адресат остался без события, и восстанавливать его надо руками.\n'
            if [ -n "$MUTED_LINE" ]; then
              printf '\n%s\n' "$MUTED_LINE"
            fi
            # Ключ глушения — строкой в теле: по нему следующий прогон найдёт это
            # письмо, и он же объясняет читателю треда, почему второго письма о
            # том же уведомителе в ближайшее окно не будет.
            printf '\n%s · окно %s с — повторный отказ этого уведомителя в окне письма не родит, а будет назван числом в следующем доехавшем письме (тред 073).\n' \
              "$(notifier_mute_marker "$WF_NAME")" "$NOTIFIER_MUTE_WINDOW_SEC"
          } > "$BODY_TMP"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Дверь push'а — общая на всех писателей контура (тред 042): она же
          # объявляет потолок попыток и она же различает гонку и отказ сервера.
          # Своя запись каждый раз пересобирается ПОВЕРХ свежего origin/comms —
          # протокол append-only, старый текст не переносится.
          source "${GITHUB_WORKSPACE}/.code/.github/scripts/comms-push.sh"
          echo "2/2 · запись в стоячий адрес '${THREAD_SLUG}' (${WF_NAME}, исход ${CONCLUSION})"
          for attempt in $(seq 1 "$COMMS_PUSH_ATTEMPTS"); do
            git fetch --no-tags origin comms
            git reset --hard origin/comms
            # АДРЕС РЕШАЕТСЯ ВНУТРИ ПОПЫТКИ, а не до цикла: команда выбирает
            # приёмник по ленте, на которую мы сейчас пушим, — потому этот вызов
            # и стоит ПОСЛЕ `reset --hard origin/comms`. Два отказа одной минуты
            # так дают один приёмник, а не два.
            if ! (cd .code && pnpm -F agent-protocol --silent cli new-message \
                  --root "${GITHUB_WORKSPACE}/agent-comms" --repo . --ref origin/main \
                  --ensure-thread "$THREAD_SLUG" --title "$THREAD_TITLE" \
                  --participants "$THREAD_PARTICIPANTS" \
                  --from github --expects none --waiting-on "$ROLE" \
                  --worker gh-action \
                  --body-file "$BODY_TMP" --write --no-push); then
              echo "::error::new-message отказал — отказ уведомителя ${WF_NAME} (${RUN_ID}) НЕ записан в адрес '${THREAD_SLUG}'."
              exit 1
            fi
            # КУДА ЛЕГЛО — СПРАШИВАЕТСЯ У ДЕРЕВА, А НЕ У ВЫВОДА КОМАНДЫ: приёмник
            # мог быть открыт этим же вызовом, и его номер отсюда иначе не узнать.
            # Дерево перед вызовом чистое (`reset --hard` строкой выше), поэтому
            # всё новое под `agent-comms/` — это ровно то, что записала доставка.
            LANDED_IN="$(git status --porcelain --untracked-files=all -- agent-comms \
              | sed -nE 's#^.. "?agent-comms/([0-9]{3}-[a-z0-9-]+)/.*#\1#p' | sort -u | head -1)"
            if [ -z "$LANDED_IN" ]; then
              echo "::error::new-message отчитался об успехе, но под agent-comms/ ничего не появилось — отказ уведомителя ${WF_NAME} (${RUN_ID}) НЕ записан."
              exit 1
            fi
            git add agent-comms
            git commit -m "chore(comms): уведомитель ${WF_NAME} отказал (${CONCLUSION}) — звонок в тред ${LANDED_IN}"
            if comms_push "$attempt"; then
              echo "Отказ уведомителя ${WF_NAME} (${RUN_ID}) доставлен в тред ${LANDED_IN} (адрес '${THREAD_SLUG}')."
              exit 0
            fi
          done

          echo "::error::Не удалось доставить отказ уведомителя ${WF_NAME} (${RUN_ID}) в адрес '${THREAD_SLUG}' за ${COMMS_PUSH_ATTEMPTS} попыток."
          exit 1
