name: CI Outcome

# ИСХОД CHECKS ДОСТАВЛЯЕТСЯ СОБЫТИЕМ В ТРЕД (постановка curator по требованию
# john, тред 035-ci-outcome-event). До сих пор исход прогона ждала САМА сессия
# (`gh run watch`): на медиане 382 с прогона это 11% часового окна роли при
# нулевой работе, а после D-2 ждущая сессия ещё и держит рабочее место роли —
# ожидание CI становится простоем целой роли, а не одной задачи.
#
# Механизм не новый: канал «воркфлоу-событие → сообщение в тред → ход вернулся»
# уже протоптан вердиктами ревьюера (#14/#67) и уведомлением о merge. Этот
# воркфлоу — третий писатель по тому же образцу и намеренно БЕЗ LLM: задача
# механическая (прочитать исход, назвать его в треде), недетерминизм модели
# здесь ничем не оправдан — ровно тот же довод, что в merge-notify.yml.
#
# ПОЧЕМУ workflow_run, А НЕ ДЖОБА ВНУТРИ ci.yml:
#   * воркфлоу-событие исполняется версией файла С ДЕФОЛТНОЙ ВЕТКИ — PR не может
#     подправить своего же уведомителя (джоба внутри ci.yml на событии
#     pull_request берётся из merge-ref, то есть из ветки PR);
#   * ci.yml не трогается вовсе: правка уведомителя — правка ОДНОГО файла,
#     а не файла, от которого зависит зелёность каждого PR;
#   * исход виден целиком, вместе с падениями setup-шагов, которые джоба
#     `needs: [...] if: always()` увидела бы как `skipped` без объяснения.
# Цена решения названа: воркфлоу СОБСТВЕННОГО прогона себе не шлёт (workflow_run
# не рекурсивен по построению). За отказом ЭТОГО уведомителя следит отдельный
# смотритель — `notifier-watch.yml`, пишущий в тред 042 (C-3.2, тред 040);
# «следят глазами в Actions» стояло здесь раньше и было неправдой: двадцать
# отказов подряд провисели незамеченными.
#
# ПРОГОН БЕЗ PR — ЕСТЬ АДРЕСАТ (C-3.1, тред 040). `thread:`/`role:` берутся из
# описания PR, а у push в main описания нет — раньше такое событие молча
# уходило, и красный `48ee0929` нашёлся случайным взглядом. Теперь у него
# стоячий адрес: тред 041 (`agent-comms/041-main-red-alarm`). Доставляется
# ТОЛЬКО красный и ТОЛЬКО по дефолтной ветке — молчание на зелёном здесь и есть
# правильный ответ (решение curator, 040). Порядок аварийного класса (тред 031)
# не меняется: 041 — звонок, а разбор заводит СВОЙ тред ДО PR.
#
# СМОТРИМ И ЗА `E2E`: смоки гоняются только по push в main и по dispatch, то
# есть на PR-цикл они не шумят вовсе, а красный main дают наравне с `checks`
# (тред 032 ровно об этом). Уведомитель у обоих один — второй копии не нужно.
on:
  workflow_run:
    workflows: [CI, E2E]
    types: [completed]

jobs:
  deliver:
    runs-on: ubuntu-latest
    permissions:
      contents: write # запись в ветку comms
      pull-requests: read # описание PR: строки `thread:` и `role:`
      # `actions: read` — разбор прогона ПО ДЖОБАМ (`/actions/runs/.../jobs`).
      # У installation-токена джобы есть РОВНО перечисленное здесь, неперечисленное
      # ОБНУЛЯЕТСЯ, а не наследуется, — и обнулённый scope отвечает тем же
      # `Resource not accessible by integration`, что и запрет на эндпойнт. Класс в
      # репозитории уже описан (claude-review.yml, `checks: read` — вердикт по #61),
      # и обе первые правки этого файла его не прочитали: 403 ловился на вызовах,
      # а причина была в блоке прав четырьмя строками выше.
      actions: read
    steps:
      # Ветка comms живёт отдельно от кода: чекаутим ЕЁ, а не голову прогона.
      - uses: actions/checkout@v5
        with:
          ref: comms
          fetch-depth: 0

      # Второй чекаут — код: конфиг протокола и пакет живут в main. Копия дерева
      # в comms СТАРАЯ, и исполнять протокол ею значило бы работать версией,
      # отставшей на неизвестное число merge'ей (та же оговорка, что в
      # merge-notify.yml).
      - uses: actions/checkout@v5
        with:
          ref: main
          path: .code
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .code/.nvmrc
          cache: pnpm
          cache-dependency-path: .code/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: .code

      - name: Доставить исход прогона в тред пакета
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          WF_NAME: ${{ github.event.workflow_run.name }}
          WF_EVENT: ${{ github.event.workflow_run.event }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          # Стоячий тред-приёмник красного main: у события без PR адресата не
          # выводится, поэтому он назначен, а не найден. Заведён руками
          # (dev-core, 040) — воркфлоу, выбирающий следующий свободный номер,
          # гонялся бы за цифру с живыми ролями.
          MAIN_RED_THREAD: 041-main-red-alarm
        run: |
          set -euo pipefail

          # PR ищется ПО ГОЛОВЕ прогона через API, а не берётся из
          # `workflow_run.pull_requests`: последнее пусто для форков и для
          # прогонов, поднятых не событием pull_request, — то есть у поля было
          # бы два читателя с разным поведением. Одно правило на все случаи.
          #
          # ОДИН REST-ВЫЗОВ НА ВСЁ: эндпойнт `/commits/{sha}/pulls` отдаёт PR
          # ЦЕЛИКОМ (номер, заголовок, тело, текущая голова) — второму вызову
          # взяться неоткуда. Пришёл он на место трёх `gh pr view --json` после
          # 403 на первых живых прогонах (30440799126, 30440882500); тогдашний
          # разбор назвал причиной GraphQL, и это была ДОГАДКА, а не измерение:
          # шаг умирал до единой строки вывода, что локализует отказ лишь до
          # «один из вызовов ДО первого echo», а их было два класса. Настоящая
          # причина — обнулённый `actions: read` (см. блок прав) — пережила
          # правку и повторила 403 на 30446225176/30447282660. Отсюда эхо-метки
          # ниже: следующий отказ обязан называть свой вызов сам.
          echo "1/3 · PR по голове ${HEAD_SHA} (/commits/{sha}/pulls)"
          PR_JSON=$(gh api "/repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/pulls" \
                      --jq 'map(select(.state == "open")) | .[0] // empty') || true
          PR=$(printf '%s' "${PR_JSON:-}" | jq -r '.number // empty')

          # ПРОГОН БЕЗ PR (C-3.1, тред 040). Раньше здесь был безусловный
          # молчаливый выход — и красный main обнаруживался случайным взглядом.
          # Теперь выход остаётся ровно там, где адресата действительно нет:
          # зелёный (доставлять нечего) и чужая ветка (dispatch по фиче — дело
          # того, кто его нажал). Красный по дефолтной ветке едет в стоячий
          # приёмник MAIN_RED_THREAD.
          MAIN_RED=""
          if [ -z "${PR:-}" ]; then
            if [ "$CONCLUSION" = "success" ]; then
              echo "Прогон ${RUN_ID} (${WF_EVENT}) не привязан к открытому PR и зелёный — доставлять нечего."
              exit 0
            fi
            if [ "${HEAD_BRANCH:-}" != "${DEFAULT_BRANCH:-}" ]; then
              echo "Прогон ${RUN_ID} (${WF_EVENT}) не привязан к открытому PR и не по '${DEFAULT_BRANCH:-?}' (ветка '${HEAD_BRANCH:-?}') — адресата нет."
              exit 0
            fi
            MAIN_RED=1

            # PR-ПРЕДОК КОММИТА: merge у нас только squash, а squash дописывает
            # `(#N)` в конец заголовка. Это не адресат — адрес уже назначен, —
            # а СЛЕД: чей пакет покрасил main и какой роли отдавать ход. Не
            # вывелся (прямой push, ручной коммит) — событие едет всё равно,
            # молчание дороже неполного письма.
            echo "1b/3 · PR-предок по заголовку коммита ${HEAD_SHA} (/commits/{sha})"
            SUBJECT=$(gh api "/repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}" --jq '.commit.message' | head -1) || true
            SRC_PR=$(printf '%s' "${SUBJECT:-}" | grep -oE '\(#[0-9]+\)$' | tr -cd '0-9') || true
            if [ -n "${SRC_PR:-}" ]; then
              PR_JSON=$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/${SRC_PR}") || true
            fi
          fi
          [ -n "${PR_JSON:-}" ] || PR_JSON='{}'

          PR_BODY=$(printf '%s' "$PR_JSON" | jq -r '.body // ""')
          PR_TITLE=$(printf '%s' "$PR_JSON" | jq -r '.title // ""')
          PR_HEAD=$(printf '%s' "$PR_JSON" | jq -r '.head.sha // ""')

          # Те же терпимые к оформлению regex'ы, что в merge-notify.yml и
          # claude-review.yml: строки в бэктиках однажды уже ослепили парсер
          # (PR #16), и третий формат для одного поля здесь заводить нельзя.
          THREAD=$(printf '%s' "$PR_BODY" | grep -oiE '^[[:space:]`*]*thread`?:[[:space:]]*`?[0-9]{3}-[a-z0-9-]+' | head -1 | sed -E 's/^[^0-9]*//; s/[`*].*//') || true
          ROLE=$(printf '%s' "$PR_BODY" | grep -oiE '^[[:space:]`*]*role`?:[[:space:]]*`?[a-z][a-z0-9-]*' | head -1 | sed -E 's/^[^a-z]*role`?:[[:space:]]*`?//i') || true

          if [ -n "${MAIN_RED:-}" ]; then
            # У красного main адрес НАЗНАЧЕН, а не найден: `thread:` предка —
            # это тред уже закрытого пакета, и авария ему не тема. Роль же
            # берётся именно оттуда: покрасил main тот, чей пакет въехал. Не
            # вывелась — curator: аварийный класс красного main в его карточке.
            SRC_THREAD="${THREAD:-}"
            THREAD="$MAIN_RED_THREAD"
            ROLE="${ROLE:-curator}"
          fi

          if [ -z "${THREAD:-}" ]; then
            echo "::warning::В описании PR #${PR} нет строки 'thread: NNN-slug' — исход прогона сообщить некуда."
            exit 0
          fi
          if [ ! -d "agent-comms/${THREAD}/messages" ]; then
            # Legacy-тред (009/010 до миграции): файловая запись там отказывает,
            # а второй, дописывающий `_thread.md`, путь — это ветка кода, которая
            # умрёт вместе с миграцией. Уведомитель о merge её держит, потому что
            # он ЕДИНСТВЕННЫЙ писатель факта merge; исход прогона в legacy-треде
            # по-прежнему виден на странице PR, поэтому здесь хватает warning'а.
            echo "::warning::Тред '${THREAD}' не найден или ещё legacy — исход прогона не доставлен."
            exit 0
          fi

          # Исход ПО-ДЖОБНО и именно ЭТОЙ попытки: у перезапущенного прогона
          # общий эндпойнт отдал бы последнюю, и сообщение о попытке №1
          # рассказывало бы про попытку №2.
          echo "2/3 · разбор по джобам прогона ${RUN_ID}, попытка ${RUN_ATTEMPT} (/actions/runs/.../jobs)"
          JOBS=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/attempts/${RUN_ATTEMPT}/jobs" --paginate \
                   --jq '.jobs[] | "- `\(.name)` — **\(.conclusion // "?")**"')

          # Тело — ФАЙЛОМ ВНЕ чекаута почты: доставка делает reset --hard при
          # отклонённом push и снесла бы файл, лежащий внутри.
          BODY_TMP="$(mktemp)"
          {
            if [ -n "${MAIN_RED:-}" ]; then
              printf '❌ **%s по `%s`: `%s`.** Открытого PR у прогона нет — авария на ветке, а не в пакете.\n\n' \
                "$WF_NAME" "$HEAD_BRANCH" "$CONCLUSION"
              printf '%s\n\n' "${SUBJECT:-(заголовок коммита не прочитан)}"
              printf 'коммит `%s` · попытка %s · прогон [`%s`](%s)\n\n' \
                "$HEAD_SHA" "$RUN_ATTEMPT" "$RUN_ID" "$RUN_URL"
            else
              case "$CONCLUSION" in
                success) printf '✅ **%s по PR #%s: `success`.**\n\n' "$WF_NAME" "$PR" ;;
                *)       printf '❌ **%s по PR #%s: `%s`.**\n\n' "$WF_NAME" "$PR" "$CONCLUSION" ;;
              esac
              printf '%s · голова `%s` · попытка %s · прогон [`%s`](%s)\n\n' \
                "$PR_TITLE" "$HEAD_SHA" "$RUN_ATTEMPT" "$RUN_ID" "$RUN_URL"
            fi
            printf '%s\n' "$JOBS"
            if [ -n "${MAIN_RED:-}" ]; then
              if [ -n "${SRC_PR:-}" ]; then
                printf '\nКоммит из PR #%s (`%s`)%s.\n' "$SRC_PR" "$PR_TITLE" \
                  "${SRC_THREAD:+, тред пакета \`${SRC_THREAD}\`}"
              else
                printf '\nPR-предок по заголовку коммита не вывелся — чей это пакет, смотреть по `git log`.\n'
              fi
              # Приёмник — ЗВОНОК, а не место разбора: порядок аварийного класса
              # (тред 031) не меняется, и напоминание стоит в каждом письме,
              # потому что читать его будут по одному, а не подряд.
              printf '\nПорядок аварийного класса не меняется: чинится БЕЗ постановки, но **тред заводится ДО PR** — первым действием, с id этого прогона в постановочном сообщении, и PR несёт `thread:` ТОГО треда. Здесь достаточно ответить, куда авария уехала.\n'
            # ГОЛОВА МОГЛА СДВИНУТЬСЯ, пока прогон шёл: зелёный исход прошлой
            # головы читается как «пакет закрыт», хотя проверялось не то, что
            # сейчас лежит в ветке. Расхождение называется, а не оставляется на
            # внимательность читающего — тот же класс, что «база merge не main»
            # в уведомителе о merge.
            elif [ -n "${PR_HEAD:-}" ] && [ "$PR_HEAD" != "$HEAD_SHA" ]; then
              printf '\n⚠️ Голова PR уже сдвинулась (`%s`) — исход относится к ПРОШЛОЙ голове, по текущей прогон свой.\n' "$PR_HEAD"
            fi
          } > "$BODY_TMP"

          # Роль сверяется С КОНФИГОМ И ЧЕРЕЗ ПАКЕТ (как в merge-notify и
          # claude-review): опечатка иначе завалила бы `new-message` на двери, и
          # исход потерялся бы целиком. Лучше сказать без передачи хода, чем не
          # сказать: ход объявляется руками, несказанное не замечает никто.
          WAIT_ARGS=""
          if [ -n "${ROLE:-}" ]; then
            # `origin/main`, а не `HEAD` — тот же ref, которым ниже пишет
            # `new-message`: роль сверяется с ДЕЙСТВУЮЩИМ конфигом дефолтной
            # ветки, а не с тем, что оказалось головой чекаута `.code`
            # (в claude-review.yml это уже стоило переданного хода — там же причина).
            if (cd .code && pnpm -F agent-protocol --silent cli role exists --repo . --ref origin/main --role "$ROLE" >/dev/null 2>&1); then
              WAIT_ARGS="--waiting-on ${ROLE}"
            elif [ -n "${MAIN_RED:-}" ]; then
              # Красный main без хода — звонок без адресата, то есть та же
              # тишина, ради устранения которой всё это писалось. Опечатка в
              # `role:` предка не должна её вернуть: ход уходит curator.
              echo "::warning::В PR-предке #${SRC_PR:-?} указана роль '${ROLE}', которой нет в конфиге — ход по красному main передан curator."
              printf '\n⚠️ Роль `%s` из PR-предка в конфиге не найдена — ход передан curator.\n' "$ROLE" >> "$BODY_TMP"
              WAIT_ARGS="--waiting-on curator"
            else
              echo "::warning::В PR #${PR} указана роль '${ROLE}', которой нет в конфиге протокола — ход не передан."
              printf '\n⚠️ Ход не передан: в описании PR указана роль `%s`, которой нет в конфиге протокола — объявите ожидание вручную.\n' "$ROLE" >> "$BODY_TMP"
            fi
          else
            printf '\n⚠️ Ход не передан: в описании PR не было строки `role: <id>` — объявите ожидание вручную.\n' >> "$BODY_TMP"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # До пяти попыток: в comms пишут параллельно живые роли. Протокол
          # append-only — свою запись каждый раз пересобираем ПОВЕРХ свежего
          # origin/comms, а не переносим старый текст.
          if [ -n "${MAIN_RED:-}" ]; then
            WHAT="по ${HEAD_BRANCH} (${HEAD_SHA:0:7})"
          else
            WHAT="по PR #${PR}"
          fi
          echo "3/3 · запись события в тред ${THREAD} (${WHAT}, исход ${CONCLUSION})"
          for attempt in 1 2 3 4 5; do
            git fetch --no-tags origin comms
            git reset --hard origin/comms
            if ! (cd .code && pnpm -F agent-protocol --silent cli new-message \
                  --root "${GITHUB_WORKSPACE}/agent-comms" --repo . --ref origin/main \
                  --thread "$THREAD" --from github --expects none ${WAIT_ARGS} \
                  --worker gh-action \
                  --body-file "$BODY_TMP" --write --no-push); then
              echo "::error::new-message отказал — исход прогона ${RUN_ID} НЕ записан в ${THREAD}."
              exit 1
            fi
            git add agent-comms
            git commit -m "chore(comms): ${WF_NAME} ${WHAT} — ${CONCLUSION}, событие в тред ${THREAD}"
            if git push origin HEAD:comms; then
              echo "Исход прогона ${RUN_ID} (${CONCLUSION}) доставлен в тред ${THREAD}."
              exit 0
            fi
            echo "Push отклонён (попытка ${attempt}) — в comms писали параллельно, пересобираю."
          done

          echo "::error::Не удалось доставить исход прогона ${RUN_ID} в ${THREAD} за 5 попыток."
          exit 1
