name: CI Outcome

# ИСХОД CHECKS ДОСТАВЛЯЕТСЯ СОБЫТИЕМ В ТРЕД (постановка curator по требованию
# john, тред 035-ci-outcome-event). До сих пор исход прогона ждала САМА сессия
# (`gh run watch`): на медиане 382 с прогона это 11% часового окна роли при
# нулевой работе, а после D-2 ждущая сессия ещё и держит рабочее место роли —
# ожидание CI становится простоем целой роли, а не одной задачи.
#
# Механизм не новый: канал «воркфлоу-событие → сообщение в тред → ход вернулся»
# уже протоптан вердиктами ревьюера (#14/#67) и уведомлением о merge. Этот
# воркфлоу — третий писатель по тому же образцу и намеренно БЕЗ LLM: задача
# механическая (прочитать исход, назвать его в треде), недетерминизм модели
# здесь ничем не оправдан — ровно тот же довод, что в merge-notify.yml.
#
# ПОЧЕМУ workflow_run, А НЕ ДЖОБА ВНУТРИ ci.yml:
#   * воркфлоу-событие исполняется версией файла С ДЕФОЛТНОЙ ВЕТКИ — PR не может
#     подправить своего же уведомителя (джоба внутри ci.yml на событии
#     pull_request берётся из merge-ref, то есть из ветки PR);
#   * ci.yml не трогается вовсе: правка уведомителя — правка ОДНОГО файла,
#     а не файла, от которого зависит зелёность каждого PR;
#   * исход виден целиком, вместе с падениями setup-шагов, которые джоба
#     `needs: [...] if: always()` увидела бы как `skipped` без объяснения.
# Цена решения названа: воркфлоу СОБСТВЕННОГО прогона себе не шлёт (workflow_run
# не рекурсивен по построению). За отказом ЭТОГО уведомителя следит отдельный
# смотритель — `notifier-watch.yml`, пишущий в тред 042 (C-3.2, тред 040);
# «следят глазами в Actions» стояло здесь раньше и было неправдой: двадцать
# отказов подряд провисели незамеченными.
#
# ПРОГОН БЕЗ PR — ЕСТЬ АДРЕСАТ (C-3.1, тред 040). `thread:`/`role:` берутся из
# описания PR, а у push в main описания нет — раньше такое событие молча
# уходило, и красный `48ee0929` нашёлся случайным взглядом. Теперь у него
# стоячий адрес: тред 041 (`agent-comms/041-main-red-alarm`). Доставляется
# ТОЛЬКО красный и ТОЛЬКО по дефолтной ветке — молчание на зелёном здесь и есть
# правильный ответ (решение curator, 040). Порядок аварийного класса (тред 031)
# не меняется: 041 — звонок, а разбор заводит СВОЙ тред ДО PR.
#
# СМОТРИМ И ЗА `E2E`: смоки гоняются только по push в main и по dispatch, то
# есть на PR-цикл они не шумят вовсе, а красный main дают наравне с `checks`
# (тред 032 ровно об этом). Уведомитель у обоих один — второй копии не нужно.
#
# И ЗА `Mobile E2E` (тред 064): список воркфлоу поимённый, а новый эмуляторный
# прогон в него никто не дописал — то есть его completed-событие письма НЕ
# рождало вовсе. Цена измерена дважды подряд 2026-08-14: парковка `run:264`
# снималась не исходом, а TTL (30 мин, страховка треда 062), и сессия
# поднималась вслепую через полчаса после того, как круг уже закончился —
# при том что круг этот единственный в репозитории занимает облачный раннер
# тридцать минут. Второе наблюдение john по тому же PR — то же самое, два из
# двух. Зов на метку `review` этой веткой не задевается по построению: он
# требует зелёной джобы ИМЕНОВАННО `checks`, а у эмуляторного прогона джоба
# одна и зовут её `emulator` — `CHECKS_CONCLUSION` останется пустым.
#
# ХОД ПЕРЕДАЁТСЯ ТОЛЬКО НА ДЕЙСТВЕННОМ ИСХОДЕ (форма (б), решение john
# 2026-08-01, тред 048-ci-outcome-green-raise). Раньше `--waiting-on` ставился на
# PR-пути БЕЗУСЛОВНО — и зелёный исход поднимал роль автора, у которой действия
# нет по построению: вердикта ещё нет, дверь merge не его, а перекладка под
# живым кругом ревью снесла бы якорь коммита, ради которого круг и запускался.
# Замер на PR #141: два подъёма за ночь, оба свелись к четырём чтениям и
# сообщению «жду вердикта». Теперь исход делится на два класса:
#   * ДЕЙСТВИЕ У АВТОРА ЕСТЬ (`failure`, `timed_out`, `startup_failure`,
#     `action_required`) — ход передаётся, как и раньше;
#   * СЛЕД БЕЗ ХОДА (`success`, `cancelled`, `skipped`, `neutral`, `stale`) —
#     флаг ОПУСКАЕТСЯ. Именно опускается: `--waiting-on "—"` это не «не
#     трогать», а объявленный null, который обнулил бы держателя хода. Ход
#     остаётся там, где его оставила лента: `waitingOnOf` идёт назад до
#     сообщения, где поле ОБЪЯВЛЕНО, и сообщение без поля пропускает.
# По тому же классификатору идёт разметка (иначе `cancelled` читается как
# «упал») и строки «⚠️ Ход не передан… объявите ожидание вручную»: в классе-следе
# непереданный ход — норма, а не дефект, и печатать про него нечего.
#
# КЛАСС-СЛЕД ГОВОРИТ О ХОДЕ РОВНО ТО, ЧТО ДЕЛАЕТ ЕГО ЗАГОЛОВОК — «ход остаётся
# там, где его оставила лента», а НЕ «ход не передаётся» (тред 042, 2026-08-13).
# Разница не стилистическая: дверь `new-message` отказывает сообщению, чьё ТЕЛО
# объявляет ход снятым, а флага в заголовке нет (прозаическая форма 058:
# `ход … не переда[её]тся | никому не переда | отсюда уходит | снимаю`). Письмо
# класса-следа флаг не ставит НАРОЧНО (это не `—`, а отсутствие поля), поэтому
# прежняя формулировка описывала как снятие ровно то, что снятием не является,
# и дверь честно отказывала — целиком, вместе с исходом. Живой случай: прогон
# 31750839952, исход `cancelled` E2E по PR #279 не записан в 066 вовсе.
# Лечится здесь, а не в двери: у двери ноль ложных срабатываний по замеру 058,
# а неточна была фраза уведомителя. Строк этого класса здесь ДВЕ — сам класс-след
# и заметка `ℹ️` про `NO_ROUND` ниже, — и КАЖДАЯ запиннена своим тестом двери
# (пакет `agent-protocol`, «the machine writer of the trace class» и «the machine
# writer of the NO_ROUND note»): вторая не выстрелила только потому, что исход на
# PR, правящем `claude-review.yml`, ещё не случался, а не потому, что она другая.
# Там же и причина, по которой у машинного писателя нет флага.
#
# ОДНО ИСКЛЮЧЕНИЕ, ГДЕ РАЗМЕТКА И ХОД РАСХОДЯТСЯ НАМЕРЕННО (решение john
# 2026-08-03, тред 023-daemon-parallelism): зелёный `checks` на PR, у которого
# метки `review` ЕЩЁ НЕТ, — для роли АВТОРА исход действенный. Норма 03.08
# (тред 049, #183) велит вешать метку ПОСЛЕ зелёного `checks` на той же голове,
# то есть у автора здесь есть ровно одно действие, и оно его. Разметка остаётся
# ✅ — прогон и правда зелёный; передаётся только ход, и письмо называет это
# действие словами, иначе разбуженный автор читает голую галку.
# Замер, ради которого это заведено: между пушем и меткой ожидание автора не
# парковалось НИ ОДНОЙ формой (`run:` ждёт вердикт, `pr:` — кнопку), и лифт
# замыкался сам на себя — без зелёного нет метки, без метки нет круга, без
# круга нет вердикта. Пара dev-core×023 прокрутила из-за этого два холостых
# такта подряд 2026-08-03, каждый — подъём сессии ради одного tool-call
# «посмотреть, зелено ли». Это ровно тот остаток, который 048 оставлял на
# «отдельную проверку PR без круга ревью»: john выбрал закрыть его здесь.
# Условия — все пять, и каждое отсекает свой ложный подъём:
#   * исход `success` И джоба `checks` этого прогона зелёная — норма говорит
#     про `checks` поимённо, а зелёный `E2E` по dispatch метку не разрешает;
#   * метки `review` на PR НЕТ в момент доставки (оговорка формы, принятая
#     john вместе с решением): круг уже идёт — хода у автора нет, как в 048;
#   * голова PR совпадает с головой прогона — исход прошлой головы метку на
#     текущей не разрешает, по ней идёт свой прогон, он и позовёт;
#   * дифф PR НЕ трогает `.github/workflows/claude-review.yml` (тред 042).
# Гонка внутри окна доставки (десятки секунд между чтением PR и push'ем)
# безвредна в обе стороны: метка появилась — автор увидит идущий круг и не
# сделает ничего, метка снята — позовёт следующий прогон.
#
# ПЯТОЕ УСЛОВИЕ — PR, У КОТОРОГО КРУГА НЕ БУДЕТ ПО ПОСТРОЕНИЮ (тред
# 042-notifier-down). Такой PR своего автоматического ревью не получает:
# claude-code-action пропускает круг сам («Skipping action due to workflow
# validation»), ревьюит человек. Метка там не запускает круг, а сжигает его,
# поэтому зов на метку у автора действием не является: у него ровно то же
# «нечего делать», ради которого заведён класс-след 048. Измерено пятикратно
# и подряд на одном пакете — #217 (msg-046, msg-049, msg-055) и #221
# (msg-061): каждый раз ход автора уходил на объяснение, почему метку он не
# вешает. Исход остаётся ✅ и класса-следа: ход НЕ передаётся, а причина
# печатается в письме — иначе читающий тред не отличит «круг не положен» от
# «уведомитель забыл позвать».
#
# УСЛОВИЕ НАПИСАНО ПО МЕХАНИЗМУ, А НЕ ПО ПРОЗЕ ПРАВИЛА №14 — и это разница,
# а не придирка. Правило говорит про ЛЮБОЙ файл `.github/workflows/**` в
# диффе; гард действия смотрит НА ОДИН ФАЙЛ — `claude-review.yml` в прогоне
# против версии на дефолтной ветке. Три факта, каждый проверяемый:
#   * код отказа обмена OIDC-токена — `workflow_not_found_on_default_branch`
#     (`anthropics/claude-code-action@v1`, `src/github/token.ts`): воркфлоу
#     в единственном числе — тот, из которого прогон запущен;
#   * шаг `guard` в нашем же `claude-review.yml` (заведён #133, ревью curator
#     в треде 046) воспроизводит условие ровно этой одной командой: `WF=
#     .github/workflows/claude-review.yml` против дефолтной ветки;
#   * живой случай, который прозу правила ОПРОВЕРГАЕТ: прогон 30643932101 по
#     #106 пропустился, а дифф #106 не трогал воркфлоу ВООБЩЕ — ветка просто
#     отстала от main по `claude-review.yml` (тред 046, msg-001).
# Поэтому «дифф трогает workflows/**» гарду не равно ни в одну сторону, и
# широкое условие молча лишало бы зова PR, которому круг положен (правка
# `ci.yml`, `e2e.yml`, `comms-derived.yml` при совпадающем `claude-review.yml`).
# Три случая условия сходятся так: PR ПРАВИТ `claude-review.yml` — круга нет
# по построению, зова нет (эта ветка); PR отстал от main по нему, но не
# правит — круг не состоится, НО действие у автора есть и оно своё
# (`git merge origin/main` и метка заново), зов остаётся; PR правит другой
# воркфлоу — круг идёт штатно, зов остаётся.
# ЧИТАЕТСЯ ОНО ПОСЛЕДНИМ и одним лишним вызовом (`/pulls/{n}/files`): три
# условия выше решаются полями, которые уже приехали, и на зелёном PR с меткой
# или со сдвинутой головой состав диффа спрашивать не за чем.
# ОТКАЗ ЭТОГО ВЫЗОВА ВОЗВРАЩАЕТ ПРЕЖНЕЕ ПОВЕДЕНИЕ, а не тишину: не прочитанный
# состав диффа — это «не знаю», и лишний зов дешевле проглоченного.
# Ветка MAIN_RED классификатором НЕ затронута (решение john там же): адрес ей
# назначен решением 040 (C-3.1), случай не измерен. Остаточная цена названа:
# ОТМЕНЁННЫЙ прогон по `main` позвонит в 041 вхолостую.
on:
  workflow_run:
    workflows: [CI, E2E, "Mobile E2E"]
    types: [completed]

jobs:
  deliver:
    # Пул ящика (этап 2, тред 049; решение john «переносится ВСЁ, включая
    # уведомители»). Цена переезда названа замером, а не догадкой: на пуле три
    # воркера, и в пиковый час их занимает `checks` (9 мин медиана) — тогда
    # доставка исхода встаёт в очередь за ним. Уведомитель дёшев по минутам
    # (42 с на прогон), поэтому переезд экономит мало, а задержка события,
    # передающего ход, — единственное, что тут вообще может ухудшиться;
    # измеряется пунктом 5 постановки (пиковый час), откатывается одной строкой.
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: write # запись в ветку comms
      pull-requests: read # описание PR: строки `thread:` и `role:`
      # `actions: read` — разбор прогона ПО ДЖОБАМ (`/actions/runs/.../jobs`).
      # У installation-токена джобы есть РОВНО перечисленное здесь, неперечисленное
      # ОБНУЛЯЕТСЯ, а не наследуется, — и обнулённый scope отвечает тем же
      # `Resource not accessible by integration`, что и запрет на эндпойнт. Класс в
      # репозитории уже описан (claude-review.yml, `checks: read` — вердикт по #61),
      # и обе первые правки этого файла его не прочитали: 403 ловился на вызовах,
      # а причина была в блоке прав четырьмя строками выше.
      actions: read
    steps:
      # Ветка comms живёт отдельно от кода: чекаутим ЕЁ, а не голову прогона.
      - uses: actions/checkout@v5
        with:
          ref: comms
          fetch-depth: 0

      # Второй чекаут — код: конфиг протокола и пакет живут в main. Копия дерева
      # в comms СТАРАЯ, и исполнять протокол ею значило бы работать версией,
      # отставшей на неизвестное число merge'ей (та же оговорка, что в
      # merge-notify.yml).
      - uses: actions/checkout@v5
        with:
          ref: main
          path: .code
      # `dest` ОБЯЗАТЕЛЕН вместе с переездом на пул, и это не украшение: по
      # умолчанию pnpm ставится в `~/setup-pnpm` — общий `$HOME` трёх воркеров
      # ящика, — и каждая джоба выдёргивает бинарь и стор из-под соседа, который
      # уже работает. Класс измерен и дважды валил прогоны (тред 049, #153);
      # здесь соседом будет живой `checks`. Полное обоснование — ci.yml.
      - uses: pnpm/action-setup@v5
        with:
          dest: ${{ runner.tool_cache }}/setup-pnpm
      - uses: actions/setup-node@v5
        with:
          node-version-file: .code/.nvmrc
          cache: pnpm
          cache-dependency-path: .code/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: .code

      - name: Доставить исход прогона в тред пакета
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          WF_NAME: ${{ github.event.workflow_run.name }}
          WF_EVENT: ${{ github.event.workflow_run.event }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          # Стоячий тред-приёмник красного main: у события без PR адресата не
          # выводится, поэтому он назначен, а не найден. Заведён руками
          # (dev-core, 040) — воркфлоу, выбирающий следующий свободный номер,
          # гонялся бы за цифру с живыми ролями.
          MAIN_RED_THREAD: 041-main-red-alarm
        run: |
          set -euo pipefail

          # PR ищется ПО ГОЛОВЕ прогона через API, а не берётся из
          # `workflow_run.pull_requests`: последнее пусто для форков и для
          # прогонов, поднятых не событием pull_request, — то есть у поля было
          # бы два читателя с разным поведением. Одно правило на все случаи.
          #
          # ОДИН REST-ВЫЗОВ НА ВСЁ: эндпойнт `/commits/{sha}/pulls` отдаёт PR
          # ЦЕЛИКОМ (номер, заголовок, тело, текущая голова) — второму вызову
          # взяться неоткуда. Пришёл он на место трёх `gh pr view --json` после
          # 403 на первых живых прогонах (30440799126, 30440882500); тогдашний
          # разбор назвал причиной GraphQL, и это была ДОГАДКА, а не измерение:
          # шаг умирал до единой строки вывода, что локализует отказ лишь до
          # «один из вызовов ДО первого echo», а их было два класса. Настоящая
          # причина — обнулённый `actions: read` (см. блок прав) — пережила
          # правку и повторила 403 на 30446225176/30447282660. Отсюда эхо-метки
          # ниже: следующий отказ обязан называть свой вызов сам.
          echo "1/3 · PR по голове ${HEAD_SHA} (/commits/{sha}/pulls)"
          PR_JSON=$(gh api "/repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/pulls" \
                      --jq 'map(select(.state == "open")) | .[0] // empty') || true
          PR=$(printf '%s' "${PR_JSON:-}" | jq -r '.number // empty')

          # ПРОГОН БЕЗ PR (C-3.1, тред 040). Раньше здесь был безусловный
          # молчаливый выход — и красный main обнаруживался случайным взглядом.
          # Теперь выход остаётся ровно там, где адресата действительно нет:
          # зелёный (доставлять нечего) и чужая ветка (dispatch по фиче — дело
          # того, кто его нажал). Красный по дефолтной ветке едет в стоячий
          # приёмник MAIN_RED_THREAD.
          MAIN_RED=""
          if [ -z "${PR:-}" ]; then
            if [ "$CONCLUSION" = "success" ]; then
              echo "Прогон ${RUN_ID} (${WF_EVENT}) не привязан к открытому PR и зелёный — доставлять нечего."
              exit 0
            fi
            if [ "${HEAD_BRANCH:-}" != "${DEFAULT_BRANCH:-}" ]; then
              echo "Прогон ${RUN_ID} (${WF_EVENT}) не привязан к открытому PR и не по '${DEFAULT_BRANCH:-?}' (ветка '${HEAD_BRANCH:-?}') — адресата нет."
              exit 0
            fi
            MAIN_RED=1

            # PR-ПРЕДОК КОММИТА: merge у нас только squash, а squash дописывает
            # `(#N)` в конец заголовка. Это не адресат — адрес уже назначен, —
            # а СЛЕД: чей пакет покрасил main и какой роли отдавать ход. Не
            # вывелся (прямой push, ручной коммит) — событие едет всё равно,
            # молчание дороже неполного письма.
            echo "1b/3 · PR-предок по заголовку коммита ${HEAD_SHA} (/commits/{sha})"
            SUBJECT=$(gh api "/repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}" --jq '.commit.message' | head -1) || true
            SRC_PR=$(printf '%s' "${SUBJECT:-}" | grep -oE '\(#[0-9]+\)$' | tr -cd '0-9') || true
            if [ -n "${SRC_PR:-}" ]; then
              PR_JSON=$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/${SRC_PR}") || true
            fi
          fi
          [ -n "${PR_JSON:-}" ] || PR_JSON='{}'

          PR_BODY=$(printf '%s' "$PR_JSON" | jq -r '.body // ""')
          PR_TITLE=$(printf '%s' "$PR_JSON" | jq -r '.title // ""')
          PR_HEAD=$(printf '%s' "$PR_JSON" | jq -r '.head.sha // ""')

          # Те же терпимые к оформлению regex'ы, что в merge-notify.yml и
          # claude-review.yml: строки в бэктиках однажды уже ослепили парсер
          # (PR #16), и третий формат для одного поля здесь заводить нельзя.
          THREAD=$(printf '%s' "$PR_BODY" | grep -oiE '^[[:space:]`*]*thread`?:[[:space:]]*`?[0-9]{3}-[a-z0-9-]+' | head -1 | sed -E 's/^[^0-9]*//; s/[`*].*//') || true
          ROLE=$(printf '%s' "$PR_BODY" | grep -oiE '^[[:space:]`*]*role`?:[[:space:]]*`?[a-z][a-z0-9-]*' | head -1 | sed -E 's/^[^a-z]*role`?:[[:space:]]*`?//i') || true

          if [ -n "${MAIN_RED:-}" ]; then
            # У красного main адрес НАЗНАЧЕН, а не найден: `thread:` предка —
            # это тред уже закрытого пакета, и авария ему не тема. Роль же
            # берётся именно оттуда: покрасил main тот, чей пакет въехал. Не
            # вывелась — curator: аварийный класс красного main в его карточке.
            SRC_THREAD="${THREAD:-}"
            THREAD="$MAIN_RED_THREAD"
            ROLE="${ROLE:-curator}"
          fi

          if [ -z "${THREAD:-}" ]; then
            echo "::warning::В описании PR #${PR} нет строки 'thread: NNN-slug' — исход прогона сообщить некуда."
            exit 0
          fi
          if [ ! -d "agent-comms/${THREAD}/messages" ]; then
            # Legacy-тред (009/010 до миграции): файловая запись там отказывает,
            # а второй, дописывающий `_thread.md`, путь — это ветка кода, которая
            # умрёт вместе с миграцией. Уведомитель о merge её держит, потому что
            # он ЕДИНСТВЕННЫЙ писатель факта merge; исход прогона в legacy-треде
            # по-прежнему виден на странице PR, поэтому здесь хватает warning'а.
            echo "::warning::Тред '${THREAD}' не найден или ещё legacy — исход прогона не доставлен."
            exit 0
          fi

          # Исход ПО-ДЖОБНО и именно ЭТОЙ попытки: у перезапущенного прогона
          # общий эндпойнт отдал бы последнюю, и сообщение о попытке №1
          # рассказывало бы про попытку №2.
          echo "2/3 · разбор по джобам прогона ${RUN_ID}, попытка ${RUN_ATTEMPT} (/actions/runs/.../jobs)"
          # Один вызов, два читателя: список для письма и исход ИМЕНОВАННОЙ
          # джобы `checks` для зова на метку ниже. Промежуточная форма — TSV, а
          # не готовый markdown: второй читатель, грепающий чужое оформление,
          # ломается от правки первого.
          JOBS_TSV=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/attempts/${RUN_ATTEMPT}/jobs" --paginate \
                       --jq '.jobs[] | [.name, (.conclusion // "?")] | @tsv')
          JOBS=$(printf '%s\n' "$JOBS_TSV" | awk -F'\t' 'NF { printf "- `%s` — **%s**\n", $1, $2 }')
          CHECKS_CONCLUSION=$(printf '%s\n' "$JOBS_TSV" | awk -F'\t' '$1 == "checks" { print $2; exit }')

          # КЛАССИФИКАТОР ИСХОДА (тред 048) — один на письмо: по нему идут и
          # разметка, и передача хода, иначе письмо противоречит само себе.
          # «Не зелёный» намеренно НЕ равно «красный»: `cancelled` и `skipped`
          # чинить нечего, а `action_required` зелёным не является.
          case "$CONCLUSION" in
            failure|timed_out|startup_failure|action_required) ACTIONABLE=1 ;;
            *)                                                ACTIONABLE=""  ;;
          esac

          # ЗОВ НА МЕТКУ (тред 023) — вторая, узкая дверь к передаче хода: она
          # НЕ трогает ACTIONABLE, потому что разметка письма остаётся зелёной
          # (см. шапку). `--jq` не берём: labels уже приехали в PR_JSON первым
          # вызовом, и второй читал бы то же самое на секунду позже.
          LABEL_CALL=""
          NO_ROUND=""
          if [ -z "${MAIN_RED:-}" ] && [ "$CONCLUSION" = "success" ] && [ "${CHECKS_CONCLUSION:-}" = "success" ]; then
            HAS_REVIEW_LABEL=$(printf '%s' "$PR_JSON" | jq -r '[.labels[]?.name] | index("review") // empty')
            if [ -n "${HAS_REVIEW_LABEL:-}" ]; then
              echo "PR #${PR}: метка 'review' уже стоит — круг ревью идёт, действия у автора нет (класс-след)."
            elif [ -n "${PR_HEAD:-}" ] && [ "$PR_HEAD" != "$HEAD_SHA" ]; then
              echo "PR #${PR}: голова сдвинулась (${PR_HEAD} != ${HEAD_SHA}) — метку разрешает прогон текущей головы, не этот."
            else
              # Пятое условие (тред 042): состав диффа. Спрашивается ТОЛЬКО здесь
              # — три ветки выше зов уже отклонили, и лишний вызов там был бы
              # платой ни за что. `|| true` намеренно: отказ читается как
              # «состав неизвестен», и зов остаётся прежним (см. шапку).
              echo "2b/3 · состав диффа PR #${PR} (/pulls/{n}/files)"
              PR_FILES=$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" --paginate --jq '.[].filename') || PR_FILES=""
              if printf '%s\n' "${PR_FILES:-}" | grep -q '^\.github/workflows/claude-review\.yml$'; then
                NO_ROUND=1
                echo "PR #${PR}: дифф правит .github/workflows/claude-review.yml — автоматического круга у такого PR не бывает (самопропуск действия), метка его не даст. Зова нет, класс-след."
              else
                LABEL_CALL=1
                echo "PR #${PR}: 'checks' зелёный, метки 'review' нет, голова та же — зов автору повесить метку."
              fi
            fi
          fi

          # Тело — ФАЙЛОМ ВНЕ чекаута почты: доставка делает reset --hard при
          # отклонённом push и снесла бы файл, лежащий внутри.
          BODY_TMP="$(mktemp)"
          {
            if [ -n "${MAIN_RED:-}" ]; then
              printf '❌ **%s по `%s`: `%s`.** Открытого PR у прогона нет — авария на ветке, а не в пакете.\n\n' \
                "$WF_NAME" "$HEAD_BRANCH" "$CONCLUSION"
              printf '%s\n\n' "${SUBJECT:-(заголовок коммита не прочитан)}"
              printf 'коммит `%s` · попытка %s · прогон [`%s`](%s)\n\n' \
                "$HEAD_SHA" "$RUN_ATTEMPT" "$RUN_ID" "$RUN_URL"
            else
              # Три метки на два класса: крест носит ТОЛЬКО действенный исход,
              # галка — только `success`. Остальному классу-следу зелёная галка
              # была бы такой же неправдой, как крест, — он ни то, ни другое.
              if [ -n "${ACTIONABLE:-}" ]; then
                printf '❌ **%s по PR #%s: `%s`.**\n\n' "$WF_NAME" "$PR" "$CONCLUSION"
              elif [ "$CONCLUSION" = "success" ]; then
                printf '✅ **%s по PR #%s: `success`.**\n\n' "$WF_NAME" "$PR"
              else
                printf '⚪ **%s по PR #%s: `%s`.** Прогон не состоялся — чинить нечего, ход остаётся там, где его оставила лента.\n\n' \
                  "$WF_NAME" "$PR" "$CONCLUSION"
              fi
              printf '%s · голова `%s` · попытка %s · прогон [`%s`](%s)\n\n' \
                "$PR_TITLE" "$HEAD_SHA" "$RUN_ATTEMPT" "$RUN_ID" "$RUN_URL"
            fi
            printf '%s\n' "$JOBS"
            if [ -n "${MAIN_RED:-}" ]; then
              if [ -n "${SRC_PR:-}" ]; then
                printf '\nКоммит из PR #%s (`%s`)%s.\n' "$SRC_PR" "$PR_TITLE" \
                  "${SRC_THREAD:+, тред пакета \`${SRC_THREAD}\`}"
              else
                printf '\nPR-предок по заголовку коммита не вывелся — чей это пакет, смотреть по `git log`.\n'
              fi
              # Приёмник — ЗВОНОК, а не место разбора: порядок аварийного класса
              # (тред 031) не меняется, и напоминание стоит в каждом письме,
              # потому что читать его будут по одному, а не подряд.
              printf '\nПорядок аварийного класса не меняется: чинится БЕЗ постановки, но **тред заводится ДО PR** — первым действием, с id этого прогона в постановочном сообщении, и PR несёт `thread:` ТОГО треда. Здесь достаточно ответить, куда авария уехала.\n'
            # ГОЛОВА МОГЛА СДВИНУТЬСЯ, пока прогон шёл: зелёный исход прошлой
            # головы читается как «пакет закрыт», хотя проверялось не то, что
            # сейчас лежит в ветке. Расхождение называется, а не оставляется на
            # внимательность читающего — тот же класс, что «база merge не main»
            # в уведомителе о merge.
            elif [ -n "${PR_HEAD:-}" ] && [ "$PR_HEAD" != "$HEAD_SHA" ]; then
              printf '\n⚠️ Голова PR уже сдвинулась (`%s`) — исход относится к ПРОШЛОЙ голове, по текущей прогон свой.\n' "$PR_HEAD"
            # ДЕЙСТВИЕ НАЗЫВАЕТСЯ СЛОВАМИ: ход передаётся при зелёной галке, и
            # без этой строки автор читает письмо как «просто зелено» — то есть
            # ровно тот холостой такт, ради которого зов и заведён.
            elif [ -n "${LABEL_CALL:-}" ]; then
              printf '\n👉 Круга ревью на этой голове ещё нет — метка `review` не повешена. По норме 03.08 (тред 049, [#183](https://github.com/%s/pull/183)) она вешается ПОСЛЕ зелёного `checks` на той же голове, то есть сейчас. Ход у автора ровно на это одно действие.\n' \
                "$GITHUB_REPOSITORY"
            # ПОЧЕМУ ЗОВА НЕТ — сказано вслух (тред 042): молчание на этом месте
            # читается как «уведомитель забыл позвать», а не как «круг не
            # положен», и первое стоило бы того же хода, что и лишний зов.
            elif [ -n "${NO_ROUND:-}" ]; then
              printf '\nℹ️ Метку `review` вешать не нужно: дифф правит `.github/workflows/claude-review.yml`, а такому PR автоматический круг не положен по построению — действие пропускает своё ревью само («Skipping action due to workflow validation»). Ревью человеческое, merge за john (правило №14). Действия у автора здесь нет, поэтому ход остаётся там, где его оставила лента.\n'
            fi
          } > "$BODY_TMP"

          # Роль сверяется С КОНФИГОМ И ЧЕРЕЗ ПАКЕТ (как в merge-notify и
          # claude-review): опечатка иначе завалила бы `new-message` на двери, и
          # исход потерялся бы целиком. Лучше сказать без передачи хода, чем не
          # сказать: ход объявляется руками, несказанное не замечает никто.
          WAIT_ARGS=""
          if [ -z "${MAIN_RED:-}" ] && [ -z "${ACTIONABLE:-}" ] && [ -z "${LABEL_CALL:-}" ]; then
            # КЛАСС-СЛЕД (тред 048): флаг не ставится вовсе — ни ролью, ни
            # прочерком. Предупреждений «ход не передан» здесь тоже нет: ход и
            # не должен передаваться, а письмо, объясняющее норму как дефект,
            # читается как поломка на каждом зелёном PR без строки `role:`.
            echo "Исход '${CONCLUSION}' по PR #${PR} — след без хода: waiting-on не объявляется, ход остаётся по ленте."
          elif [ -n "${ROLE:-}" ]; then
            # `origin/main`, а не `HEAD` — тот же ref, которым ниже пишет
            # `new-message`: роль сверяется с ДЕЙСТВУЮЩИМ конфигом дефолтной
            # ветки, а не с тем, что оказалось головой чекаута `.code`
            # (в claude-review.yml это уже стоило переданного хода — там же причина).
            if (cd .code && pnpm -F agent-protocol --silent cli role exists --repo . --ref origin/main --role "$ROLE" >/dev/null 2>&1); then
              WAIT_ARGS="--waiting-on ${ROLE}"
            elif [ -n "${MAIN_RED:-}" ]; then
              # Красный main без хода — звонок без адресата, то есть та же
              # тишина, ради устранения которой всё это писалось. Опечатка в
              # `role:` предка не должна её вернуть: ход уходит curator.
              echo "::warning::В PR-предке #${SRC_PR:-?} указана роль '${ROLE}', которой нет в конфиге — ход по красному main передан curator."
              printf '\n⚠️ Роль `%s` из PR-предка в конфиге не найдена — ход передан curator.\n' "$ROLE" >> "$BODY_TMP"
              WAIT_ARGS="--waiting-on curator"
            else
              echo "::warning::В PR #${PR} указана роль '${ROLE}', которой нет в конфиге протокола — ход не передан."
              printf '\n⚠️ Ход не передан: в описании PR указана роль `%s`, которой нет в конфиге протокола — объявите ожидание вручную.\n' "$ROLE" >> "$BODY_TMP"
            fi
          else
            printf '\n⚠️ Ход не передан: в описании PR не было строки `role: <id>` — объявите ожидание вручную.\n' >> "$BODY_TMP"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Дверь push'а — общая на всех писателей контура (тред 042): она же
          # объявляет потолок попыток и она же различает гонку и отказ сервера.
          # Своя запись каждый раз пересобирается ПОВЕРХ свежего origin/comms —
          # протокол append-only, старый текст не переносится.
          source "${GITHUB_WORKSPACE}/.code/.github/scripts/comms-push.sh"
          if [ -n "${MAIN_RED:-}" ]; then
            WHAT="по ${HEAD_BRANCH} (${HEAD_SHA:0:7})"
          else
            WHAT="по PR #${PR}"
          fi
          echo "3/3 · запись события в тред ${THREAD} (${WHAT}, исход ${CONCLUSION})"
          for attempt in $(seq 1 "$COMMS_PUSH_ATTEMPTS"); do
            git fetch --no-tags origin comms
            git reset --hard origin/comms
            if ! (cd .code && pnpm -F agent-protocol --silent cli new-message \
                  --root "${GITHUB_WORKSPACE}/agent-comms" --repo . --ref origin/main \
                  --thread "$THREAD" --from github --expects none ${WAIT_ARGS} \
                  --worker gh-action \
                  --body-file "$BODY_TMP" --write --no-push); then
              echo "::error::new-message отказал — исход прогона ${RUN_ID} НЕ записан в ${THREAD}."
              exit 1
            fi
            git add agent-comms
            git commit -m "chore(comms): ${WF_NAME} ${WHAT} — ${CONCLUSION}, событие в тред ${THREAD}"
            if comms_push "$attempt"; then
              echo "Исход прогона ${RUN_ID} (${CONCLUSION}) доставлен в тред ${THREAD}."
              exit 0
            fi
          done

          echo "::error::Не удалось доставить исход прогона ${RUN_ID} в ${THREAD} за ${COMMS_PUSH_ATTEMPTS} попыток."
          exit 1
