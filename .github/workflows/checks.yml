name: checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  checks:
    # HOSTED, И ЭТО СЛЕДСТВИЕ ПУБЛИЧНОСТИ РЕПОЗИТОРИЯ (тред 006), а не откат
    # решения 049: тот принимался на ПРИВАТНОМ репозитории, и публикация
    # 2026-08-18 12:20Z легитимно меняет ответ по трём пунктам.
    # 1. ИЗОЛЯЦИЯ. Публичный репозиторий тянет fork-PR, то есть ЧУЖОЙ код; на
    #    self-hosted он исполнялся бы на ящике, где рядом живут контур LLE, его
    #    секреты и резидентный демон этого протокола. GitHub прямо не советует
    #    self-hosted для public — hosted снимает класс целиком, а не уменьшает.
    # 2. ОЧЕРЕДЬ. Раннер-группа организации по умолчанию публичные репозитории
    #    НЕ обслуживает: замер того же дня — джоба `checks` PR #10 простояла
    #    77 минут (15:01:57Z → 16:18:56Z), пока john временно не включил
    #    «Allow public repositories». Галка временная, hosted — целевое.
    # 3. ДЕНЬГИ. Для публичных репозиториев hosted-раннеры бесплатны без лимита
    #    минут, так что экономия, ради которой ехали на пул, здесь исчезла.
    # ЦЕНА НАЗВАНА, А НЕ ЗАМОЛЧАНА: hosted-железо слабее ящика (шареные vCPU),
    # прогон медленнее — числа в отчёте треда 006. Треть сьюта поднимает
    # настоящий git и спавнит процессы; если на слабом железе проснётся флак,
    # калибруются ТАЙМАУТЫ, а не утверждения тестов.
    runs-on: ubuntu-latest
    steps:
      # `fetch-depth: 0` — ради шага сверки с каноном в конце джобы: он считает
      # «этот PR трогает канон» ТРЁХТОЧЕЧНЫМ диффом от merge-base, а merge-base
      # на shallow-клоне (глубина по умолчанию — 1) не считается ВОВСЕ. Репозиторий
      # маленький, полная история дешевле, чем догадка о нужной глубине.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # ДВЕРЬ ВОКРУГ КОНФИГА ПРОТОКОЛА (тред 014-merge-model, решение john
      # 2026-08-19). До этого шага `agent-protocol.json` не проверял в конвейере
      # НИКТО: сломанный конфиг проходил прогон зелёным и падал потом у первой
      # команды, которая его прочитает. Класс — «дверь молчит», и цена за сутки
      # 19.08 заплачена трижды: форма роли `reviewer-pr`, не прошедшая схему;
      # путь `instructions: REVIEWER.md`, добавленный ровно затем, чтобы
      # исчезновение критериев отказывало ПО ИМЕНИ, — а существование этого пути
      # проверяет только `config check`; и роль `github` в `merge-notify.yml`,
      # из-за которой шестнадцать прогонов почтового воркфлоу подряд упали, и ни
      # один из них никому не позвонил.
      #
      # ШАГ СТОИТ ПЕРВЫМ ПОСЛЕ УСТАНОВКИ, а не последним: он стоит полсекунды и
      # называет причину, которую сломанный конфиг иначе покажет как чужое
      # падение теста через шесть минут.
      #
      # `--ref HEAD`, И ЭТО НЕСУЩЕЕ. Конфиг читается только через git на ЯВНОМ
      # ref (`config/load.ts`: у `ref` намеренно нет умолчания), а вопрос CI —
      # «держится ли конфиг ТОГО, что будет влито». На `pull_request` HEAD
      # чекаута — merge-ref, то есть голова PR, уже слитая с базой; на push в
      # `main` — сам `main`. `origin/main` здесь сказал бы «ок» про файл,
      # которого этот PR не содержит.
      #
      # В СЕТЬ ШАГ НЕ ХОДИТ, и это следствие того же выбора, а не обещание:
      # `fetchRef` (`fs/git.ts`) уходит первой строкой на любом ref, не
      # начинающемся с `origin/`. Поэтому `--no-fetch` здесь НЕ нужен — он про
      # черствение `origin/*`, которого тут нет, и его предупреждение было бы
      # шумом о несуществующем риске.
      #
      # ЧТО ШАГ ЛОВИТ: схему конфига целиком, версию протокола (R2),
      # существование объявленных путей `instructions` на этом же ref, владение
      # инстансами (R13 — launchable- или ресидентная роль без инстанса либо с
      # двумя). ЧЕГО НЕ ЛОВИТ, и это граница, а не пробел: машинный конфиг бокса
      # (`~/.config/agent-protocol/local.json`) — его в репозитории нет, это зона
      # `doctor`; и конфиг обслуживаемого проекта в чужом репозитории — шаг
      # проверяет свой корень.
      #
      # ИМЯ ПРИЧИНЫ ДОЕЗЖАЕТ И ДО АННОТАЦИИ. Сама команда называет причину на
      # stderr, но сводка PR показывает у упавшего шага только «exit code 1» —
      # то есть ровно тот отказ, из которого нельзя понять, что чинить. Поэтому
      # первая содержательная строка отказа повторяется через `::error::`.
      - name: agent-protocol.json держится
        run: |
          set -o pipefail
          log="${RUNNER_TEMP}/config-check.log"
          if pnpm protocol config check --ref HEAD 2>&1 | tee "$log"; then
            exit 0
          fi
          reason=$(grep -m1 '^- ' "$log" || grep -m1 '^agent-protocol: ' "$log" || true)
          echo "::error::config check отказал: ${reason:-причина в логе шага}"
          exit 1

      - run: pnpm lint
      - run: pnpm typecheck
      # треть сьюта поднимает настоящий git; без идентичности эти тесты
      # умирают на первом же своём коммите
      - name: git identity
        run: |
          git config --global user.email ci@example.invalid
          git config --global user.name ci
      - run: pnpm test

      # ДВЕРЬ ВОКРУГ ГЕНЕРАТОРА ПРОИЗВОДНЫХ (тред 007). `comms-derived.yml` на
      # событии `push` исполняется из версии файла В ВЕТКЕ `comms`, а не из
      # дефолтной, поэтому правку канона обязаны продублировать в `comms` —
      # иначе генератор исполняет старую версию, а CI об этом молчит. До
      # 2026-08-18 шапка канона объявляла этот гард (называя чужой `ci.yml`),
      # а самого гарда в репозитории не было: класс «дверь объявлена, дверь не
      # поставлена». Форма шага взята с отлаженного прототипа LLE.
      #
      # СПРАШИВАЕТСЯ ОН НЕ У ВСЕХ, и это несущее. Копия в `comms` кладётся ДО
      # merge'а канонической правки — иначе покраснеет push-прогон main, то есть
      # аварийный класс. Значит между «копия легла» и «канон влит» ветка `comms`
      # ЗАКОННО впереди main, и безусловное сравнение красило бы в этом окне ЛЮБОЙ
      # посторонний PR: его чекаут несёт старый канон, к которому он отношения не
      # имеет (в LLE так и вышло — PR #176 и #177 стали красными из-за #175).
      # Поэтому на PR гард спрашивает только тогда, когда ЭТОТ PR канон и трогает;
      # на push в main — ВСЕГДА, безусловно: там сравнение и есть непрерывный
      # инвариант, и только оно ловит копию, положенную под PR, который потом
      # бросили.
      #
      # «ЭТОТ PR ТРОГАЕТ КАНОН» СЧИТАЕТСЯ ДИФФОМ ОТ MERGE-BASE (`base...HEAD`), а
      # НЕ сравнением содержимого чекаута с ГОЛОВОЙ базы, и разница не
      # стилистическая: чекаут PR — merge-ref, собранный платформой в момент
      # события и замороженный, а `origin/<base>` читается шагом на десять минут
      # позже и к тому времени может уехать вперёд. Первая версия гарда в LLE
      # сравнивала именно содержимое и покраснела на прогоне 30788651443 по ЧУЖОЙ
      # правке, влитой пока шли тесты. Трёхточечный дифф спрашивает про правку
      # САМОГО PR и к движению базы невосприимчив по построению.
      #
      # `github.base_ref` пусто на `push` — оттого путь `push` до него и не
      # доходит; `${BASE_REF:-main}` страхует и это.
      - name: comms-derived синхронен с каноном
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          canon=.github/workflows/comms-derived.yml
          if [ "${GITHUB_EVENT_NAME}" != push ]; then
            base="${BASE_REF:-main}"
            git fetch --no-tags --quiet origin "+refs/heads/$base:refs/remotes/origin/$base"
            if git diff --quiet "origin/$base...HEAD" -- "$canon"; then
              echo "канон не тронут правкой этого PR (дифф от merge-base с origin/$base пуст) — расхождение копии, если оно есть, принадлежит чужой правке; не спрашиваю."
              exit 0
            fi
          fi
          git fetch --no-tags --depth=1 origin comms
          if ! diff -q "$canon" <(git show "origin/comms:$canon") >/dev/null 2>&1; then
            echo "::error::comms-derived.yml в ветке comms разошёлся с каноном в main — синхронизируйте копию (тред 007). Порядок: копия в comms кладётся ДО merge'а канонической правки."
            exit 1
          fi
